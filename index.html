<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>پترو پارسیان — اکسیر جوانی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a101f;--p1:#0e1a33;--ln:#22396b;--gold:#d4a437;--gr:#1db86a;--warn:#f0a92c;--dgr:#e2453c;--blu:#2f9be8;--pur:#7b5cd6}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 18% 0%,#13234c 0%,transparent 46%),var(--bg);color:#e9effb;min-height:100vh}
.hid{display:none!important}
#errbar{display:none;position:fixed;top:0;left:0;right:0;background:#7c1d1d;color:#fff;padding:8px;font-size:12px;z-index:9999;text-align:center}
#tw{position:fixed;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.ts{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;max-width:460px}
.ts.sh{opacity:1;transform:none}.ts.er{background:#3a1420;color:#ffc4c4;border-color:#7c2d2d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view{animation:fi .3s ease}
.lg{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:14.5px;margin-bottom:9px}
.note{color:#8fa8cc;font-size:12px;text-align:center;margin-top:10px;line-height:2}.note b{color:var(--gold)}
.tabs{display:flex;gap:10px;margin:14px 0}
.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:#1a1206;font-weight:800}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(10,18,38,.94);border-bottom:1px solid var(--ln);padding:8px 12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px}.brand b{color:var(--gold);font-size:15px}.brand small{display:block;color:#8fa8cc;font-size:10px}

@media(max-width:960px){#sideToggle{display:block;background:var(--p1);border:1px solid var(--ln);color:var(--gold);border-radius:9px;padding:5px 10px;font-size:17px;font-family:inherit;cursor:pointer}nav#side{position:fixed;right:-225px;z-index:200;transition:.3s;height:100vh;top:0;overflow-y:auto}nav#side.open{right:0}}
.gr{color:var(--gold);font-size:10px;margin:11px 6px 4px}
.nv{display:flex;gap:8px;width:100%;background:none;border:none;color:#a9c2e8;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:12.3px;text-align:right}
.nv.on{background:linear-gradient(90deg,rgba(212,164,55,.22),transparent);color:var(--gold)}
main#view{flex:1;padding:12px 14px 60px;min-width:0}
h2.vt{color:var(--gold);font-size:17px;margin-bottom:10px}
.pan{background:linear-gradient(180deg,#12224a,#0d1a35);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:11px}
.pan h3{color:#cfe0ff;font-size:13px;margin-bottom:8px}
.row2{display:grid;grid-template-columns:1.1fr .9fr;gap:11px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:960px){.row2,.row3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:11px}
.kpi{border-radius:13px;padding:11px 13px;color:#fff;border:none;cursor:pointer;text-align:right;font-family:inherit}
.kpi small{display:block;font-size:10px;opacity:.93;margin-bottom:3px}.kpi b{font-size:16px}
.k1{background:linear-gradient(135deg,#159a52,#1db86a)}.k2{background:linear-gradient(135deg,#1565c0,#2f9be8)}.k3{background:linear-gradient(135deg,#6d3fd4,#8b6cf0)}.k4{background:linear-gradient(135deg,#d97706,#f0a92c)}.k5{background:linear-gradient(135deg,#c0392b,#e2453c)}
.scrl{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}
table.dtb{width:100%;border-collapse:collapse;font-size:11.3px;min-width:700px}
.dtb th{background:#152c58;color:var(--gold);padding:8px 6px;white-space:nowrap;border:1px solid #1d3566;font-weight:600}
.dtb td{padding:7px 6px;border:1px solid #1a2f5c;text-align:center;white-space:nowrap;color:#d8e4fa}
.dtb td.l{text-align:right;white-space:normal}
td.hot{background:#e2453c33!important;color:#ff9f9f!important;font-weight:800}
td.mid{background:#b8860b33!important;color:#ffd98c!important;font-weight:800}
td.env{background:#0e2038!important;color:#8fc4ff!important;font-weight:700}
td.ok2{color:#7dffbe!important;font-weight:700}
.dtb input{width:70px;padding:4px;border-radius:6px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:12px;text-align:center}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-bottom:9px}
.fgrid label{display:block;font-size:10px;color:#8fa8cc;margin-bottom:3px}
.fgrid input,.fgrid select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:13px}
.btn{padding:9px 15px;border:none;border-radius:9px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
.btn.go{background:linear-gradient(90deg,#159a52,#28c76f);color:#fff}
.btn.out{background:#26477e;color:#cfe0ff}
.btn.sm{padding:5px 10px;font-size:11px}
.pill{border:none;border-radius:7px;padding:4px 9px;font-family:inherit;font-weight:700;font-size:10.5px;cursor:pointer}
.pill.ok{background:var(--gr);color:#fff}.pill.wn{background:var(--warn);color:#1a1206}.pill.gy{background:#26477e;color:#cfe0ff}.pill.bl{background:var(--blu);color:#fff}
.st-badge{border-radius:99px;padding:2px 8px;font-size:9.5px;font-weight:800;white-space:nowrap}
.sb-ok{background:#0e2b1a;color:#7dffbe;border:1px solid #1f5c39}
.sb-pnd{background:#2b2210;color:#ffd98c;border:1px solid #6b5518}
.by{color:#8fa8cc;font-size:10px}
.meta{background:#0c1a35;border:1px dashed var(--ln);border-radius:10px;padding:8px 11px;font-size:12px;margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.meta b{color:#ffd98c;font-family:monospace}
.lockbox{background:#1c1430;border:1px solid #4a3a7a;border-radius:12px;padding:14px;text-align:center}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tb{padding:7px 13px;border-radius:99px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;font-size:11.5px;cursor:pointer}
.tb.on{background:var(--gold);color:#1a1206;font-weight:800}
.ai-it{display:flex;gap:8px;padding:7px 2px;border-bottom:1px dashed #1c3560;font-size:12px;align-items:flex-start;flex-wrap:wrap}
.bcard{background:#0c1a35;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.bcard.on{border-color:var(--gold)}
.brow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.bx{flex:1;min-width:82px;text-align:center}.bx b{display:block;font-size:13px}.bx span{color:#8fa8cc;font-size:9.5px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px}
.ckbox{display:flex;align-items:center;gap:8px;background:#0c1a35;border:1px solid #1c3560;border-radius:9px;padding:8px 10px;font-size:11.8px;cursor:pointer}
.ckbox input{width:16px;height:16px;accent-color:#22c55e;flex-shrink:0}
.ckbox.okd{background:#0e2b1a;border-color:#1f5c39}
.empty{color:#8fa8cc;font-size:12px;text-align:center;padding:9px}
.hero{text-align:center;padding:26px 14px 10px}
.hero .fl{font-size:54px}
.hero h1{color:var(--gold);font-size:23px;margin:8px 0 4px}
.hero p{color:#a9c2e8;font-size:13px;line-height:2.2;max-width:720px;margin:0 auto}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:14px 0}
.ft{background:#0c1a35;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:12px;line-height:1.9}
.ft b{color:#ffd98c;display:block;margin-bottom:3px}
.firms{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px}
.fcard{background:linear-gradient(160deg,#17284f,#0d1a35);border:1px solid var(--gold);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.fcard:before{content:'';position:absolute;top:-30px;left:-30px;width:95px;height:95px;background:radial-gradient(circle,rgba(212,164,55,.28),transparent 70%)}
.fcard h4{color:var(--gold);font-size:14.5px;margin-bottom:6px;position:relative}
.fcard .fl2{font-size:11.5px;color:#cfe0ff;line-height:2;position:relative}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.plan{background:#0c1a35;border:1px solid var(--ln);border-radius:14px;padding:16px;text-align:center}
.plan.gd{border-color:var(--gold)}
.plan b.t{color:var(--gold);font-size:15px}
.plan .pr{font-size:17px;font-weight:800;margin:8px 0;color:#fff}
.plan ul{list-style:none;font-size:11.5px;color:#a9c2e8;line-height:2.2;margin-bottom:10px}
.unl{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;border-radius:11px;padding:9px;text-align:center;font-size:12.5px;margin-top:8px}
.lock{background:#2a1215;color:#ffc4c4;border:1px solid #7c2d2d;border-radius:11px;padding:9px;text-align:center;font-size:12.5px;margin-top:8px}
.mat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:7px}
.mc{background:#0c1a35;border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:center}
.mc b{display:block;font-size:13.5px;color:#fff}.mc span{font-size:9.5px;color:#8fa8cc}
.perm{display:inline-block;background:#0c1a35;border:1px solid var(--ln);border-radius:7px;padding:3px 8px;font-size:10px;margin:2px;color:#a9c2e8;cursor:pointer}
.perm.on{background:#16351f;border-color:#2a6b3d;color:#7dffbe}
.gwrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gcard{text-align:center}.gcard .lbl{color:#8fa8cc;font-size:10px}
.flame{transform-origin:50% 100%;animation:ffl .9s ease-in-out infinite}
.flame.f2{animation-duration:1.05s;animation-delay:.15s}.flame.f3{animation-duration:.78s;animation-delay:.3s}
@keyframes ffl{0%,100%{transform:scaleY(1)}30%{transform:scaleY(1.15) scaleX(.9)}60%{transform:scaleY(.88) scaleX(1.07)}}
.stm{animation:rise 2.6s ease-in infinite;transform-box:fill-box}
.stm.s2{animation-delay:.7s}.stm.s3{animation-delay:1.4s}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.55}100%{transform:translateY(-42px) scale(1.7);opacity:0}}
.tl{display:flex;flex-direction:column;gap:8px}
.tl-r{display:flex;gap:9px;align-items:flex-start;font-size:11.6px}
.tl-d{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
#aibox{max-height:360px;overflow-y:auto;background:#0a1526;border:1px solid var(--ln);border-radius:10px;padding:8px;margin-bottom:9px}
.aib{max-width:88%;padding:9px 12px;border-radius:13px;font-size:12.5px;line-height:1.9;margin-bottom:7px;white-space:pre-wrap}
.aib.u{background:#12365c;border:1px solid #2b5e97;margin-inline-start:auto}
.aib.a{background:#1d1a0e;border:1px solid #6b5518;color:#ffe9b8}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
@media print{header,nav#side,#tw,.btn,.pill,.chipbar{display:none!important}body{background:#fff;color:#000}}
</style>

<body>
<div id="errbar"></div>
<div id="tw"></div>

<header id="hdr" class="hid">
<button id="sideToggle" onclick="q('side').classList.toggle('open')">☰</button>
<div class="brand"><span style="font-size:24px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · 09154040240</small></div></div>
<div id="clk">—</div>
<div class="hdr-ics" id="hics"></div>
<div class="ui"><span id="uname"></span><span class="bdg" id="ubadge"></span><button class="btn out sm" onclick="logout()">خروج</button></div>
</header>
<div class="layout hid" id="lay"><nav id="side" class="hid"></nav><main id="view"></main></div>

<script>
"use strict";
var q=function(i){return document.getElementById(i)};
window.onerror=function(m,s,l){var b=q('errbar');if(b){b.style.display='block';b.textContent='⚠️ خطا: '+m+' (خط '+l+')'}};
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function F(n){return (+n||0).toLocaleString('fa-IR')}
function p2(n){return String(n).padStart(2,'0')}
function S(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('حافظه پر است!',1);return false}}
function R(k){return S('pv_'+k,[])}
function US(){return S('pv_users',[])}
function U(){var s=S('pv_sess',null);if(!s)return null;var u=US().filter(function(x){return x.email===s})[0];return (u&&u.st==='ok')?u:null}
function ADM(){var u=U();return !!u&&!!u.admin}
function toast(m,er){var t=document.createElement('div');t.className='ts'+(er?' er':'');t.textContent=m;q('tw').appendChild(t);requestAnimationFrame(function(){t.classList.add('sh')});setTimeout(function(){t.classList.remove('sh');setTimeout(function(){t.remove()},300)},3200)}
function logA(t){var l=S('pv_agentlog',[]);l.unshift({t:Date.now(),txt:t});W('pv_agentlog',l.slice(0,80))}

/* تاریخ شمسی */
function d2j(gy,gm,gd){var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;var gy2=(gm>2)?(gy+1):gy;var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return [jy,jm,jd]}
function hj(){var d=new Date(),j=d2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+p2(j[1])+'/'+p2(j[2])}
function hnow(){var d=new Date();return hj()+' — '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function hhm(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())}
function dayO(j){var p=String(j||'').split('/');if(p.length!==3)return null;var y=+p[0],m=+p[1],d=+p[2];if(!y||!m||!d)return null;return y*365+((m<=6)?((m-1)*31+d):(186+(m-7)*30+d))}
function daysU(j){var t=dayO(hj()),x=dayO(j);if(t==null||x==null)return null;return x-t}
function dLbl(d){if(d==null)return 'بدون تاریخ';if(d>0)return F(d)+' روز مانده';if(d===0)return 'امروز!';return F(-d)+' روز گذشته'}
setInterval(function(){var c=q('clk');if(c){var d=new Date();c.textContent='📅 '+hj()+' 🕒 '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}},1000);

/* تنظیمات بازیابی */
var RECV_EMAIL='';     /* ایمیل تو برای دریافت درخواست ریست پرسنل — مثلا 'ali@gmail.com' */
var KAVENEGAR_KEY='';  /* کلید کاوه‌نگار برای پیامک واقعی. خالی = دمو */
function sendResetEmail(by,acc,np){
 if(!RECV_EMAIL){logA('📧 ایمیل مدیر تنظیم نشده — درخواست فقط داخل اپ ثبت شد');return}
 fetch('https://formsubmit.co/ajax/'+RECV_EMAIL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({_subject:'🔑 درخواست بازیابی رمز — پترو پارسیان',_template:'table','درخواست‌دهنده':by,'حساب':acc,'رمز جدید پیشنهادی':np,'توضیح':'فقط با تایید مدیر داخل اپ فعال می‌شود'})})
 .then(function(r){return r.json()}).then(function(){logA('📧 ایمیل درخواست ریست ارسال شد — '+acc)}).catch(function(){toast('ایمیل ارسال نشد — اما درخواست داخل اپ ثبت شد',1)});
}
function sendSms(to,msg){
 if(!KAVENEGAR_KEY){logA('📱 پیامک (دمو): '+msg);return}
 if(!to){logA('📱 شماره گیرنده ثبت نشده');return}
 fetch('https://api.kavenegar.com/v1/'+KAVENEGAR_KEY+'/sms/send.json?receptor='+encodeURIComponent(to)+'&message='+encodeURIComponent(msg))
 .then(function(r){return r.json()}).then(function(){toast('📱 پیامک ارسال شد')}).catch(function(){toast('اتصال به سامانه پیامک برقرار نشد',1)});
}
/* ⭐ ریست رمز: مدیر کل مستقیم، پرسنل با تایید مدیر */
function forgotPw(){
 var e=prompt('ایمیل حساب خود را وارد کن:');if(!e)return;
 e=e.trim().toLowerCase();
 var u=null,l=US();
 for(var i=0;i<l.length;i++){if(l[i].email===e)u=l[i]}
 if(!u){toast('این ایمیل ثبت نشده است',1);return}
 var np=prompt('رمز جدید (حداقل ۶ کاراکتر):');if(!np)return;
 if(np.length<6){toast('رمز حداقل ۶ کاراکتر',1);return}
 hs(np).then(function(nh){
  if(u.admin){
   for(var j=0;j<l.length;j++){if(l[j].email===e){l[j].pass=nh;break}}
   W('pv_users',l);
   logA('🔑 رمز مدیر کل مستقیماً ریست شد — '+e);
   toast('✅ رمز مدیر عوض شد — حالا با رمز جدید وارد شو');
   return;
  }
  var reqs=S('pv_pwreset',[]);
  reqs.unshift({t:Date.now(),em:e,name:u.name,tel:u.bno||'',newHash:nh,st:'pend'});
  W('pv_pwreset',reqs);
  logA('🔑 درخواست بازیابی رمز — '+u.name+' ('+e+')');
  sendResetEmail(u.name,e,np);
  sendSms(u.bno||'','پترو پارسیان: درخواست ریست رمز برای '+e+' ثبت شد — تایید توسط مدیر');
  toast('✅ درخواست ثبت شد — مدیر در «مدیریت» تایید می‌کند');
 });
}
function approvePw(t){
 var reqs=S('pv_pwreset',[]),r=null;
 for(var i=0;i<reqs.length;i++){if(String(reqs[i].t)===String(t)){r=reqs[i];break}}
 if(!r)return;
 var l=US();
 for(var j=0;j<l.length;j++){if(l[j].email===r.em){l[j].pass=r.newHash;break}}
 W('pv_users',l);

function parsePaper(text){

  var tm=t.match(/(\d{1,2})\s*[:.،]\s*(\d{2})/);
  var h=tm?(p2(Math.min(23,+tm[1]))+':'+tm[2]):'';
  var seg=tm?t.replace(tm[0],' '):t;
  var nums=(seg.match(/\d{1,4}/g)||[]).map(Number).filter(function(n){return n>=20&&n<=500});
  if(!h&&!nums.length)return;
  if(!h&&nums.length&&nums[0]<=24){h=p2(nums[0])+':00';nums=nums.slice(1)}
  rows.push({
   h:h,
   a1:String(nums[0]!=null?nums[0]:''),
   a2:String(nums[1]!=null?nums[1]:''),
   a3:String(nums[2]!=null?nums[2]:''),

}

  inner+='<div class="pan" style="margin-bottom:8px;background:#0c1a35"><div class="ai-it"><span>'+(x.admin?'👑':(x.plan>=2?'🟡':(x.plan>=1?'🥉':'👁')))+'</span><div style="flex:1"><b>'+E(x.name)+'</b> <span class="by">'+E(x.email)+'</span> '+planName(x.plan)+(x.cname?'<br><span class="by">🏭 '+E(x.cname)+' · 📍 '+E(x.addr||x.city||'—')+(x.lat?' · <a href="https://maps.google.com/?q='+x.lat+','+x.lon+'" target="_blank" style="color:#8fc4ff">نقشه</a>':'')+'</span>':'')+(x.st==='pend'?' <span class="st-badge sb-pnd">در انتظار</span>':'')+'</div></div>';
  if(x.st==='pend'&&ADM())inner+='<button class="pill ok" onclick="usrOk(\''+E(x.email)+'\')">✅ تایید حساب (نمایش در صفحه اول)</button> ';
  if(ADM()&&x.email!==u.email)inner+='<button class="pill gy" onclick="usrAdm(\''+E(x.email)+'\')">'+(x.admin?'ناظر شود':'مدیر شود')+'</button> ';
  inner+='<div style="margin-top:6px">';
  if(ADM()&&!x.admin){
   inner+='<span class="by">دسترسی‌ها (کلیک):</span><br>';
   MODS.forEach(function(m){var onx=hasMod(x,m[0]);inner+='<span class="perm'+(onx?' on':'')+'" onclick="permTgl(\''+E(x.email)+'\',\''+m[0]+'\')">'+(onx?'✅ ':'⛔ ')+m[1]+'</span>'});
  }else if(x.admin){inner+='<span class="by">مدیر کل — دسترسی کامل</span>'}

 });
 inner+='</div>';

  preq.forEach(function(r){inner+='<div class="ai-it"><span>💳</span><span style="flex:1"><b>'+E(r.by)+'</b> — '+E(r.plan)+'</span><button class="pill ok" onclick="payok('+r.t+')">تایید</button></div>'});
  inner+='</div>';
 }
 q('view').innerHTML=page('⚙️ مدیریت و دسترسی‌ها',inner);
}

/* ---- لندینگ ---- */
function ltab(w){
 q('lt0').classList.toggle('on',w===0);q('lt1').classList.toggle('on',w===1);
 q('lf0').classList.toggle('hid',w!==0);q('lf1').classList.toggle('hid',w!==1);
}
function firmCard(f){
 var h='<div class="fcard"><h4>🏭 '+E(f.n)+' <span class="st-badge sb-ok">عضو ✅</span></h4><div class="fl2">';
 if(f.addr)h+='📍 '+E(f.addr)+(f.city?' — '+E(f.city):'')+'<br>';
 else if(f.city)h+='📍 '+E(f.city)+'<br>';
 if(f.bno)h+='☎️ بازرگانی: '+E(f.bno)+'<br>';
 if(f.lat&&f.lon)h+='<a class="pill bl" style="text-decoration:none" href="https://maps.google.com/?q='+f.lat+','+f.lon+'" target="_blank">🗺 مشاهده روی نقشه</a>';
 h+='</div></div>';
 return h;
}
function vHome(){
 var firms=S('pv_firms',[]);
 var h='<div class="view"><div class="hero"><div class="fl">🔥</div><h1>پترو پارسیان — اکسیر جوانی</h1><p>سامانه جامع مدیریت کارخانه‌های پیرولیز: ثبت ساعتی دما با دمای محیطِ خودکار، آپلود کاغذ پخت با تشخیص خودکار ساعات و پارامترها، دستیار هوشمند پرسش و پاسخ، هزینه دقیق هر بچ، تعمیرات و کارتابل و شبکه تعامل کارخانه‌ها.</p></div>';
 h+='<div class="pan"><h3>🏭 کارخانه‌های عضو شبکه ('+F(firms.length)+')</h3><div class="firms">';
 if(firms.length){firms.forEach(function(f){h+=firmCard(f)})}
 else{h+='<div class="empty">هنوز کارخانه‌ای تایید نشده — اولین باش</div>'}
 h+='</div></div>';
 h+='<div class="feat">';
 [['📋','فرم پخت یک‌صفحه‌ای','دقیقاً مثل برگه کاغذی + دمای محیط خودکار هر ساعت'],['📸','آپلود کاغذ پخت','عکس برگه را بده؛ ساعات و دماها خودکار در جدول می‌نشینند'],['🤖','دستیار هوشمند','از دما تا مطالبات بپرس — جواب از داده‌های واقعی'],['🔧','CMMS کامل','قطعه از انبار، هزینه مالی، یادآوری بازبینی'],['🔐','دسترسی‌های مدیر','هر نفر با کاربری خودش؛ ثبت به نامش'],['🌐','شبکه کارخانه‌ها','چت، قیمت مواد هر شهر، کاریابی، تامین قطعات']].forEach(function(x){h+='<div class="ft"><b>'+x[0]+' '+x[1]+'</b>'+E(x[2])+'</div>'});
 h+='</div>';
 h+='<div class="row2">';
 h+='<div class="pan"><div class="tabs"><button class="tab on" id="lt0" onclick="ltab(0)">ورود</button><button class="tab" id="lt1" onclick="ltab(1)">ثبت‌نام</button></div>';
 h+='<div id="lf0"><input id="le" class="lg" type="email" placeholder="ایمیل"><input id="lp" class="lg" type="password" placeholder="رمز عبور"><button class="btn go" style="width:100%" onclick="doLogin()">ورود به سامانه</button><button class="btn out sm" style="width:100%" onclick="forgotPw()">🔑 رمزم را فراموش کردم — ریست (مدیر مستقیم / پرسنل با تایید)</button></div>';
 h+='<div id="lf1" class="hid">';
 h+='<input id="rn" class="lg" placeholder="نام و نام‌خانوادگی مسئول">';
 h+='<input id="rc" class="lg" placeholder="🏭 نام شرکت / کارخانه">';
 h+='<input id="ra" class="lg" placeholder="📍 آدرس دقیق کارخانه">';
 h+='<input id="rb" class="lg" placeholder="☎️ شماره بازرگانی (برای پیامک بازیابی رمز)">';
 h+='<button class="btn out sm" style="width:100%;margin-bottom:8px" onclick="capLoc()">📍 گرفتن موقعیت دقیق کارخانه از نقشه</button>';
 h+='<div id="locTag" class="by" style="margin-bottom:8px">موقعیتی ثبت نشده</div>';
 h+='<input id="re" class="lg" type="email" placeholder="ایمیل"><input id="rp" class="lg" type="password" placeholder="رمز (حداقل ۶)">';
 h+='<button class="btn go" style="width:100%" onclick="doReg()">ثبت‌نام کارخانه</button></div>';
 h+='<div class="note">اولین ثبت‌نام = مدیر کل 👑 · بعد از <b>تایید مدیر</b>، کارت کارخانه در همین صفحه نمایش داده می‌شود</div></div>';
 h+='<div class="pan"><h3>💳 پلن‌های عضویت</h3><div class="plans">';
 h+='<div class="plan"><b class="t">رایگان</b><div class="pr">۰</div><ul><li>داشبورد و گزارش پخت</li><li>دستیار هوشمند</li><li>درخواست با ایجنت</li></ul></div>';
 PLANS.forEach(function(p){h+='<div class="plan'+(p.lv===2?' gd':'')+'"><b class="t">'+p.n+'</b><div class="pr">'+p.pr+'</div><ul>'+p.ft.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div>'});
 h+='</div></div>';

 q('view').innerHTML=h;

/* ---- مسیریابی ---- */
var NAVG=[
 ['کلی',[['dash','📊','داشبورد'],['cook','📋','گزارش پخت']]],
 ['عملیات',[['prod','📦','بچ و هزینه'],['maint','🔧','تعمیرات'],['inv','🏭','انبار'],['fin','💰','مالی']]],
 ['هوشمند',[['req','📥','درخواست و ایجنت'],['ai','🤖','دستیار هوشمند'],['people','👥','پرسنل']]],
 ['شبکه و سیستم',[['net','🌐','بازار و چت'],['pay','💳','عضویت'],['settings','⚙️','مدیریت']]]
];
var VIEWS={home:vHome,dash:vDash,cook:vCook,prod:vProd,maint:vMaint,inv:vInv,req:vReq,ai:vAI,people:vPeople,net:vNet,pay:vPay,fin:vFin,settings:vSettings};

function go(p){if(!VIEWS[p])return;route=p;try{location.hash='#/'+p}catch(e){}render()}

var route='home';

function render(){
 var u=U(),hdr=q('hdr'),lay=q('lay'),side=q('side');
 if(!u){hdr.classList.add('hid');side.classList.add('hid');lay.classList.remove('hid');route='home';vHome();return}
 hdr.classList.remove('hid');lay.classList.remove('hid');side.classList.remove('hid');
 q('uname').textContent=u.name;
 q('ubadge').textContent=(u.admin?'مدیر کل 👑 ':'')+(u.cname||planName(u.plan));
 q('ubadge').className='bdg'+(u.admin?'':' v');
 q('hics').innerHTML=[['dash','📊 داشبورد'],['cook','📋 پخت'],['ai','🤖 دستیار'],['net','🌐 شبکه'],['req','📥 درخواست'],['pay','💳 عضویت']].map(function(x){return '<button class="hbtn'+(route===x[0]?' on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
 var sh='';
 NAVG.forEach(function(g){
  var ok=g[1].filter(function(n){return u.admin||(u.perms||[]).indexOf(n[0])>=0});
  if(!ok.length)return;
  sh+='<div class="gr">'+g[0]+'</div>';
  ok.forEach(function(n){sh+='<button class="nv'+(route===n[0]?' on':'')+'" onclick="go(\''+n[0]+'\')">'+n[1]+' '+n[2]+'</button>'});
 });
 sh+='<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:8px"><button class="nv" onclick="logout()">🚪 خروج</button></div>';
 side.innerHTML=sh;
 if(route==='home')route='dash';
 var need=NEEDMOD[route];
 if(need&&!u.admin&&(u.perms||[]).indexOf(need)<0){
  q('view').innerHTML=page('⛔ دسترسی ندارید','<div class="pan"><div class="empty">مدیر دسترسی این بخش را باز نکرده</div><button class="btn out sm" onclick="go(\'req\')">📥 درخواست دسترسی</button></div>');
  return;
 }
 (VIEWS[route]||vDash)();
 side.classList.remove('open');
 window.scrollTo(0,0);
}
function view(){render()}
seed();render();
