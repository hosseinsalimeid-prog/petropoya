<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a101f;--p1:#0e1a33;--p2:#122347;--ln:#22396b;--gold:#d4a437;--gr:#1db86a;--warn:#f0a92c;--dgr:#e2453c;--blu:#2f9be8;--pur:#7b5cd6}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 18% 0%,#13234c 0%,transparent 46%),var(--bg);color:#e9effb;min-height:100vh}
.hid{display:none!important}
#errbar{display:none;position:fixed;top:0;left:0;right:0;background:#7c1d1d;color:#fff;padding:8px;font-size:12px;z-index:9999;text-align:center}
#tw{position:fixed;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.ts{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;max-width:460px}
.ts.sh{opacity:1;transform:none}.ts.er{background:#3a1420;color:#ffc4c4;border-color:#7c2d2d}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.view{animation:fi .3s ease}
.lg{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:14.5px;margin-bottom:9px}
.note{color:#8fa8cc;font-size:12px;text-align:center;margin-top:10px;line-height:2}.note b{color:var(--gold)}
.tabs{display:flex;gap:10px;margin:14px 0}
.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:#1a1206;font-weight:800}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(10,18,38,.94);border-bottom:1px solid var(--ln);padding:8px 12px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:9px}.brand b{color:var(--gold);font-size:15px}.brand small{display:block;color:#8fa8cc;font-size:10px}

.hdr-ics{display:flex;gap:5px;overflow-x:auto}
.hbtn{background:var(--p1);border:1px solid var(--ln);color:#cfe0ff;border-radius:9px;padding:5px 9px;font-size:10px;font-family:inherit;cursor:pointer;white-space:nowrap}

.ui{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}
.bdg{border-radius:99px;padding:3px 10px;font-size:10.5px;font-weight:800;background:var(--gold);color:#1a1206}.bdg.v{background:#2b4c80;color:#cfe0ff}
.layout{display:flex}
nav#side{width:200px;flex-shrink:0;background:rgba(12,22,44,.8);border-inline-end:1px solid var(--ln);padding:10px 8px;min-height:calc(100vh - 52px)}
#sideToggle{display:none}
@media(max-width:960px){#sideToggle{display:block;background:var(--p1);border:1px solid var(--ln);color:var(--gold);border-radius:9px;padding:5px 10px;font-size:17px;font-family:inherit;cursor:pointer}nav#side{position:fixed;right:-225px;z-index:200;transition:.3s;height:100vh;top:0}nav#side.open{right:0}}
.gr{color:var(--gold);font-size:10px;margin:11px 6px 4px}
.nv{display:flex;gap:8px;width:100%;background:none;border:none;color:#a9c2e8;padding:8px 9px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:12.3px;text-align:right}
.nv.on{background:linear-gradient(90deg,rgba(212,164,55,.22),transparent);color:var(--gold)}
main{flex:1;padding:12px 14px 60px;min-width:0}
h2.vt{color:var(--gold);font-size:17px;margin-bottom:10px}
.pan{background:linear-gradient(180deg,#12224a,#0d1a35);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:11px}

.row2{display:grid;grid-template-columns:1.1fr .9fr;gap:11px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
@media(max-width:960px){.row2,.row3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:11px}
.kpi{border-radius:13px;padding:11px 13px;color:#fff;border:none;cursor:pointer;text-align:right;font-family:inherit}
.kpi small{display:block;font-size:10px;opacity:.93;margin-bottom:3px}.kpi b{font-size:16px}
.k1{background:linear-gradient(135deg,#159a52,#1db86a)}.k2{background:linear-gradient(135deg,#1565c0,#2f9be8)}.k3{background:linear-gradient(135deg,#6d3fd4,#8b6cf0)}.k4{background:linear-gradient(135deg,#d97706,#f0a92c)}.k5{background:linear-gradient(135deg,#c0392b,#e2453c)}
.scrl{overflow-x:auto;border:1px solid var(--ln);border-radius:10px}
table.dtb{width:100%;border-collapse:collapse;font-size:11.3px;min-width:640px}
.dtb th{background:#152c58;color:var(--gold);padding:8px 6px;white-space:nowrap;border:1px solid #1d3566;font-weight:600}
.dtb td{padding:7px 6px;border:1px solid #1a2f5c;text-align:center;white-space:nowrap;color:#d8e4fa}
.dtb td.l{text-align:right;white-space:normal}
td.hot{background:#e2453c33!important;color:#ff9f9f!important;font-weight:800}td.mid{background:#b8860b33!important;color:#ffd98c!important;font-weight:800}td.ok2{color:#7dffbe!important;font-weight:700}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-bottom:9px}
.fgrid label{display:block;font-size:10px;color:#8fa8cc;margin-bottom:3px}
.fgrid input,.fgrid select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:13px}
.btn{padding:9px 15px;border:none;border-radius:9px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer}
.btn.go{background:linear-gradient(90deg,#159a52,#28c76f);color:#fff}.btn.out{background:#26477e;color:#cfe0ff}
.btn.sm{padding:5px 10px;font-size:11px}
.pill{border:none;border-radius:7px;padding:4px 9px;font-family:inherit;font-weight:700;font-size:10.5px;cursor:pointer}
.pill.ok{background:var(--gr);color:#fff}.pill.wn{background:var(--warn);color:#1a1206}.pill.gy{background:#26477e;color:#cfe0ff}.pill.bl{background:var(--blu);color:#fff}
.st-badge{border-radius:99px;padding:2px 8px;font-size:9.5px;font-weight:800;white-space:nowrap}
.sb-ok{background:#0e2b1a;color:#7dffbe;border:1px solid #1f5c39}.sb-pnd{background:#2b2210;color:#ffd98c;border:1px solid #6b5518}.sb-arch{background:#222;color:#999;border:1px solid #444}
.by{color:#8fa8cc;font-size:10px}
.meta{background:#0c1a35;border:1px dashed var(--ln);border-radius:10px;padding:8px 11px;font-size:12px;margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:#ffd98c;font-family:monospace}
.lockbox{background:#1c1430;border:1px solid #4a3a7a;border-radius:12px;padding:14px;text-align:center}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tb{padding:7px 13px;border-radius:99px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;font-size:11.5px;cursor:pointer}
.tb.on{background:var(--gold);color:#1a1206;font-weight:800}
.ai-it{display:flex;gap:8px;padding:7px 2px;border-bottom:1px dashed #1c3560;font-size:12px;align-items:flex-start;flex-wrap:wrap}
.bcard{background:#0c1a35;border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.bcard.on{border-color:var(--gold)}
.brow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px}
.bx{flex:1;min-width:82px;text-align:center}.bx b{display:block;font-size:13px}.bx span{color:#8fa8cc;font-size:9.5px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px}
.ckbox{display:flex;align-items:center;gap:8px;background:#0c1a35;border:1px solid #1c3560;border-radius:9px;padding:8px 10px;font-size:11.8px;cursor:pointer}
.ckbox input{width:16px;height:16px;accent-color:#22c55e;flex-shrink:0}
.ckbox.okd{background:#0e2b1a;border-color:#1f5c39}
.empty{color:#8fa8cc;font-size:12px;text-align:center;padding:9px}
.hero{text-align:center;padding:34px 16px 18px}
.hero .fl{font-size:56px}
.hero h1{color:var(--gold);font-size:24px;margin:8px 0 4px}
.hero p{color:#a9c2e8;font-size:13.5px;line-height:2.2;max-width:720px;margin:0 auto}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin:16px 0}
.ft{background:#0c1a35;border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:12px;line-height:1.9}
.ft b{color:#ffd98c;display:block;margin-bottom:3px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.plan{background:#0c1a35;border:1px solid var(--ln);border-radius:14px;padding:16px;text-align:center}
.plan.gd{border-color:var(--gold)}
.plan b.t{color:var(--gold);font-size:15px}
.plan .pr{font-size:17px;font-weight:800;margin:8px 0;color:#fff}
.plan ul{list-style:none;font-size:11.5px;color:#a9c2e8;line-height:2.2;margin-bottom:10px}
.rem{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;font-size:11.8px;margin-bottom:6px;border-inline-start:4px solid;flex-wrap:wrap}
.rem-r{background:#2a1215;border-color:var(--dgr)}.rem-y{background:#2b2210;border-color:var(--warn)}.rem-b{background:#12283f;border-color:var(--blu)}
.unl{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;border-radius:11px;padding:9px;text-align:center;font-size:12.5px;margin-top:8px}
.lock{background:#2a1215;color:#ffc4c4;border:1px solid #7c2d2d;border-radius:11px;padding:9px;text-align:center;font-size:12.5px;margin-top:8px}
.mat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px}
.mc{background:#0c1a35;border:1px solid var(--ln);border-radius:10px;padding:8px;text-align:center}
.mc b{display:block;font-size:13.5px;color:#fff}.mc span{font-size:9.5px;color:#8fa8cc}
.perm{display:inline-block;background:#0c1a35;border:1px solid var(--ln);border-radius:7px;padding:3px 8px;font-size:10px;margin:2px;color:#a9c2e8;cursor:pointer}
.perm.on{background:#16351f;border-color:#2a6b3d;color:#7dffbe}
@media print{header,nav#side,#tw,.btn,.pill,.chipbar{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="tw"></div>

<header id="hdr" class="hid">
<button id="sideToggle" data-a="side">☰</button>
<div class="brand"><span style="font-size:24px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · 09154040240</small></div></div>
<div id="clk">—</div>
<div class="hdr-ics" id="hics"></div>
<div class="ui"><span id="uname"></span><span class="bdg" id="ubadge"></span><button class="btn out sm" data-a="logout">خروج</button></div>
</header>
<div class="layout hid" id="lay"><nav id="side"></nav><main id="view"></main></div>

<script>
"use strict";
const q=i=>document.getElementById(i);
window.onerror=function(m,s,l){var b=q('errbar');if(b){b.style.display='block';b.textContent='⚠️ خطا: '+m+' (خط '+l+')'}};
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>(+n||0).toLocaleString('fa-IR');
const p2=n=>String(n).padStart(2,'0');
function S(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('حافظه پر است!',1);return false}}
const R=k=>S('pv_'+k,[]);
const US=()=>S('pv_users',[]);
function U(){var s=S('pv_sess',null);if(!s)return null;var u=US().find(function(x){return x.email===s});return u&&u.st==='ok'?u:null}
function ADM(){var u=U();return !!u&&!!u.admin}
function toast(m,er){var t=document.createElement('div');t.className='ts'+(er?' er':'');t.textContent=m;q('tw').appendChild(t);requestAnimationFrame(function(){t.classList.add('sh')});setTimeout(function(){t.classList.remove('sh');setTimeout(function(){t.remove()},300)},3200)}
function logA(txt){var l=S('pv_agentlog',[]);l.unshift({t:Date.now(),txt:txt});W('pv_agentlog',l.slice(0,80))}

/* تاریخ شمسی (قفل‌شده — فقط نمایش) */
function d2j(gy,gm,gd){var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;var gy2=(gm>2)?(gy+1):gy;var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return[jy,jm,jd]}
function hj(){var d=new Date();var j=d2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+p2(j[1])+'/'+p2(j[2])}
function hnow(){var d=new Date();return hj()+' — '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function dayO(j){var p=(j||'').split('/');if(p.length!==3)return null;var y=+p[0],m=+p[1],d=+p[2];if(!y||!m||!d)return null;return y*365+(m<=6?(m-1)*31+d:186+(m-7)*30+d)}
function daysU(j){var t=dayO(hj().slice(0,10));var x=dayO(j);if(t==null||x==null)return null;return x-t}
function dLbl(d){if(d==null)return 'بدون تاریخ';if(d>0)return F(d)+' روز مانده';if(d===0)return 'امروز!';return F(-d)+' روز گذشته'}
setInterval(function(){var c=q('clk');if(c)c.textContent='📅 '+hj()+' 🕒 '+hnow().slice(-8)},1000);

/* احراز + دسترسی */
const MODS=[['dash','📊 داشبورد'],['cook','📋 گزارش پخت'],['prod','📦 بچ و هزینه'],['maint','🔧 تعمیرات'],['req','📥 درخواست‌ها'],['people','👥 پرسنل'],['net','🌐 شبکه و بازار'],['settings','⚙️ مدیریت']];
const PLANS=[{lv:1,n:'برنزی',pr:'۵۰۰٬۰۰۰ تومان/ماه',ft:['مرور قیمت مواد و بازار','کاریابی','آموزش پایه']},{lv:2,n:'طلایی',pr:'۱٬۵۰۰٬۰۰۰ تومان/ماه',ft:['همه امکانات برنزی','چت کارخانه‌ها','تامین‌کنندگان قطعات','اولویت پشتیبانی']}];
function planName(lv){return lv>=2?'طلایی 🟡':lv>=1?'برنزی 🥉':'رایگان'}
function hasMod(u,m){if(!u)return false;if(u.admin)return true;return (u.perms||[]).indexOf(m)>=0}
async function hs(t){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pp·'+t));return [...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){var h=0,s='pp·'+t;for(var i=0;i<s.length;i++)h=((h*31)+s.charCodeAt(i))>>>0;return 'f'+h}}
const DEFP=['dash','cook','req','net'];
async function doReg(){var n=q('rn').value.trim(),e=q('re').value.trim().toLowerCase(),p=q('rp').value;
 if(!n||!e||!p)return toast('همه فیلدها را پر کنید',1);
 if(p.length<6)return toast('رمز حداقل ۶ کاراکتر',1);
 var l=US();if(l.some(function(u){return u.email===e}))return toast('این ایمیل قبلاً ثبت شده',1);
 var h=await hs(p);
 if(!l.length){l.push({email:e,pass:h,name:n,admin:1,st:'ok',plan:2,perms:[]});W('pv_users',l);W('pv_sess',e);toast('خوش آمدید مدیر کل 👑');seed();route='dash';render()}
 else{l.push({email:e,pass:h,name:n,admin:0,st:'pend',plan:0,perms:DEFP});W('pv_users',l);toast('ثبت شد — منتظر تایید مدیر 🌱');ltab(0)}
}
async function doLogin(){var e=q('le').value.trim().toLowerCase(),p=q('lp').value;
 var u=US().find(function(x){return x.email===e});
 if(!u||u.pass!==await hs(p))return toast('ایمیل/رمز اشتباه',1);
 if(u.st==='pend')return toast('حساب در انتظار تایید مدیر ⏳',1);
 W('pv_sess',e);seed();route='dash';render();toast('خوش آمدی '+u.name+' 👋')}
function logout(){localStorage.removeItem('pv_sess');route='home';render()}

/* داده اولیه */
function seed(){if(S('pv_seeded'))return;W('pv_seeded',1);
 W('pv_ck',{});
 W('pv_crow',[]);W('pv_csum',[]);
 W('pv_batch',[{t:1,v:{id:'B-1405-0523',d:hj(),feed:'لاستیک',raw:3.05,op:'اپراتور نمونه',start:'14:00',end:'22:30',ck:'6:45',cl:'3:10',note:''},st:'ok',by:'مدیر'}]);
 W('pv_bcost',[{t:1,v:{b:'B-1405-0523',cat:'مواد اولیه',amt:185000000,note:''},st:'ok',by:'مدیر',at:hnow()},{t:2,v:{b:'B-1405-0523',cat:'برق',amt:9200000,note:''},st:'ok',by:'مدیر',at:hnow()},{t:3,v:{b:'B-1405-0523',cat:'گازوئیل',amt:12400000,note:''},st:'ok',by:'مدیر',at:hnow()},{t:4,v:{b:'B-1405-0523',cat:'کارگر / دستمزد',amt:18000000,note:''},st:'ok',by:'مدیر',at:hnow()},{t:5,v:{b:'B-1405-0523',cat:'اجاره ملک',amt:120000000,note:''},st:'ok',by:'مدیر',at:hnow()}]);
 W('pv_inv',[{t:1,v:{item:'واشر نسوز',qty:24,unit:'عدد'},st:'ok',by:'مدیر'},{t:2,v:{item:'گسکت درب راکتور',qty:8,unit:'عدد'},st:'ok',by:'مدیر'},{t:3,v:{item:'بوش و شفت پمپ',qty:12,unit:'عدد'},st:'ok',by:'مدیر'}]);
 W('pv_maint',[{t:1,v:{eq:'کندانسور (C-01)',note:'اورحال کامل + تعویض واشر نسوز',part:'واشر نسوز',pqty:2,cost:6400000,tech:'داریوش',d:hj(),next:'1405/07/20'},st:'ok',by:'مدیر'}]);
 W('pv_pm',[{t:1,v:{eq:'راکتور R-01',job:'بررسی گسکت و بلبرینگ',next:'1405/06/12',tech:'داریوش'},st:'ok',by:'مدیر'}]);
 W('pv_cartable',[{t:1,v:{tech:'داریوش',title:'تعویض واشر نسوز کندانسور',due:'1405/06/16',note:''},st:'pend',by:'مدیر'}]);
 W('pv_hrm',[{t:1,v:{n:'داریوش لطیفی',r:'تعمیرکار ارشد',sh:'روتاری'},st:'ok',by:'مدیر'},{t:2,v:{n:'علی رضایی',r:'اپراتور',sh:'صبح'},st:'ok',by:'مدیر'}]);
 W('pv_out',[{t:1,v:{prod:'روغن گرمایی',qty:12450,unit:'لیتر',batch:'B-1405-0523'},st:'ok',by:'مدیر'}]);
 W('pv_fin',[{t:1,v:{ft:'in',title:'فروش روغن',amt:1245000000},st:'ok',by:'مدیر'},{t:2,v:{ft:'out',title:'هزینه‌ها',amt:620000000},st:'ok',by:'مدیر'}]);
 W('pv_sell',[{t:1,v:{item:'روغن گرمایی',qty:8000,price:27000,cust:'پتروشیمی البرز',due:'',total:216000000,paid:1},st:'ok',by:'مدیر'}]);

 q('view').innerHTML=page('👥 پرسنل',inner)}

/* شبکه و ماژول‌ها */
const NETS=[
 {k:'chat',n:'💬 چت کارخانه‌ها',lv:2,f:[['txt','پیام',1]]},
 {k:'prices',n:'🏷 قیمت مواد اولیه (هر شهر)',lv:1,f:[['city','شهر',1],['item','ماده',1],['price','قیمت (تومان)',1]]},
 {k:'pcity',n:'📦 محصولات تولیدی هر شهر',lv:1,f:[['city','شهر',1],['item','محصول',1],['qty','مقدار'],['price','قیمت']]},
 {k:'jobs',n:'💼 کاریابی',lv:1,f:[['title','عنوان / تخصص',1],['city','شهر'],['tel','تماس']]},
 {k:'sup',n:'🔩 تامین‌کنندگان قطعات',lv:2,f:[['name','نام شرکت',1],['city','شهر'],['parts','قطعات'],['tel','تماس']]},
 {k:'train',n:'🎓 آموزش',lv:1,f:[['title','عنوان',1],['desc','توضیح / لینک']]},
 {k:'tix',n:'🎧 پشتیبانی',lv:0,f:[['txt','مشکل یا سوال',1]]}
];
function vNet(){var u=U(),cur=TABS.net||'chat';
 var inner=tabsUI('net',NETS.map(function(n){return {k:n.k,n:n.n}}),cur);
 var N=NETS.find(function(x){return x.k===cur})||NETS[0];
 if(u.plan<N.lv){inner+='<div class="lockbox"><div style="font-size:30px">🔒</div><b>این ماژول با عضویت '+(N.lv===2?'طلایی':'برنزی')+' فعال می‌شود</b><br><span class="by">عضویت فعلی شما: '+planName(u.plan)+'</span><br><button class="btn go sm" data-a="go" data-p="pay" style="margin-top:9px">💳 خرید عضویت</button></div>';
  q('view').innerHTML=page('🌐 شبکه و بازار',inner);return}
 inner+='<div class="pan"><h3>➕ '+N.n+'</h3><div class="fgrid">';
 N.f.forEach(function(f,i){inner+='<div><label>'+f[1]+'</label><input id="nf_'+i+'"></div>'});
 inner+='</div><button class="btn go" data-a="postnet" data-k="'+N.k+'">📤 ارسال</button></div>';
 var rows=R(N.k).filter(function(r){return r.st!=='arch'}).slice(0,25);
 inner+='<div class="pan"><h3>📄 '+(rows.length?'':'')+'آخرین‌ها'+(cur==='chat'?' (چت زنده بین کارخانه‌ها — نسخه نهایی آنلاین می‌شود)':'')+'</h3>';
 rows.forEach(function(r){inner+='<div class="ai-it"><span>'+(cur==='chat'?'💬':'▪')+'</span><div style="flex:1;min-width:160px">';
  N.f.forEach(function(f){if(r.v[f[0]])inner+=E(f[1])+': <b>'+E(r.v[f[0]])+'</b> &nbsp; '});
  inner+='<br><span class="by">'+E(r.by||'—')+' · '+E(r.at||'—')+'</span></div>';
  if(ADM())inner+='<button class="pill gy" data-a="archnet" data-k="'+N.k+'" data-t="'+r.t+'">آرشیو</button>';
  inner+='</div>'});
 if(!rows.length)inner+='<div class="empty">هنوز پستی نیست — اولین را بفرست</div>';
 inner+='</div>';
 q('view').innerHTML=page('🌐 شبکه و بازار کارخانه‌ها',inner)}
function postNet(k){var u=U();if(!u)return;var N=NETS.find(function(x){return x.k===k});var v={};
 for(var i=0;i<N.f.length;i++){var el=q('nf_'+i);var val=el?el.value.trim():'';
  if(N.f[i][2]===1&&!val){toast('«'+N.f[i][1]+'» لازم است',1);return}v[N.f[i][0]]=val}
 var l=R(k);l.unshift({t:Date.now(),v:v,st:'ok',by:u.name,at:hnow()});W('pv_'+k,l);
 logA('🌐 پست شبکه: '+N.n+' — '+u.name);toast('✅ ارسال شد');view()}
/* پرداخت */
function vPay(){var u=U();
 var inner='<div class="pan"><h3>💳 عضویت فعلی شما: '+(u.plan>=2?'🟡 طلایی':u.plan>=1?'🥉 برنزی':'رایگان')+'</h3>';
 inner+='<div class="plans"><div class="plan"><b class="t">رایگان</b><div class="pr">۰</div><ul><li>داشبورد، گزارش پخت، درخواست، پشتیبانی</li></ul></div>';
 PLANS.forEach(function(p){inner+='<div class="plan'+(p.lv===2?' gd':'')+'"><b class="t">'+p.n+'</b><div class="pr">'+p.pr+'</div><ul>'+p.ft.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><button class="btn go sm" data-a="buyplan" data-lv="'+p.lv+'">💳 درخواست خرید</button></div>'});
 inner+='</div><div class="note">پرداخت واقعی (زرین‌پال) در نسخه نهایی وصل می‌شود — الان درخواست ثبت و مدیر تایید می‌کند.</div>';
 var reqs=S('pv_payreq',[]);
 if(ADM()&&reqs.length){inner+='<div class="pan"><h3>👑 درخواست‌های پرداخت</h3>'+reqs.filter(function(r){return r.st==='pend'}).map(function(r){return '<div class="ai-it"><span>💳</span><span style="flex:1"><b>'+E(r.by)+'</b> — '+E(r.plan)+'</span><button class="pill ok" data-a="payok" data-t="'+r.t+'">تایید پرداخت</button></div>'}).join('')+'</div>'}
 inner+='<div class="pan"><h3>📌 سوابق خرید شما</h3>'+(reqs.length?reqs.slice(0,10).map(function(r){return '<div class="ai-it"><span>▪</span><span style="flex:1">'+E(r.plan)+' — '+E(r.by)+' — '+E(r.st==='ok'?'تایید شده':'در انتظار')+'</span></div>'}).join(''):'<div class="empty">—</div>')+'</div>';
 q('view').innerHTML=page('💳 عضویت و پرداخت ماژول‌ها',inner)}
function buyPlan(lv){var u=U();if(!u)return;var p=PLANS.find(function(x){return x.lv===+lv});
 var l=S('pv_payreq',[]);l.unshift({t:Date.now(),by:u.name,email:u.email,plan:p.n,lv:p.lv,st:'pend'});
 W('pv_payreq',l);logA('💳 درخواست خرید '+p.n+' — '+u.name);toast('✅ درخواست ثبت شد — تایید مدیر = فعال‌سازی');view()}
function payok(t){var reqs=S('pv_payreq',[]),r=reqs.find(function(x){return String(x.t)===String(t)});
 if(r){r.st='ok';W('pv_payreq',reqs);
  var l=US(),u=l.find(function(x){return x.email===r.email});
  if(u){u.plan=r.lv||1;W('pv_users',l);logA('💳 عضویت '+r.plan+' برای '+u.name+' فعال شد');toast('عضویت '+u.name+' فعال شد')}render()}}
/* مالی */
function vFin(){var cur=TABS.fin||'sell';
 var inner=tabsUI('fin',[{k:'sell',n:'📦 فاکتور'},{k:'fin',n:'💰 دریافت/پرداخت'}],cur);
 if(cur==='sell')inner+='<div class="pan"><h3>➕ فاکتور</h3>'+formHTML('sell')+'</div>'+tableHTML('sell',[['item','محصول'],['qty','مقدار'],['price','قیمت'],['total','مبلغ کل'],['cust','خریدار'],['due','سررسید']]);
 else inner+='<div class="pan"><h3>➕ ثبت مالی</h3>'+formHTML('fin')+'</div>'+tableHTML('fin',[['ft','نوع'],['title','عنوان','l'],['amt','مبلغ']]);
 var fin=R('fin');var inn=fin.filter(function(x){return x.v.ft==='in'}).reduce(function(s,x){return s+(+x.v.amt||0)},0);
 var out2=fin.filter(function(x){return x.v.ft==='out'}).reduce(function(s,x){return s+(+x.v.amt||0)},0);
 inner+='<div class="mat-cards"><div class="mc" style="background:#0e2b1a"><b style="color:#7dffbe">'+F(inn)+'</b><span>درآمد</span></div><div class="mc" style="background:#3a1420"><b style="color:#ff9f9f">'+F(out2)+'</b><span>هزینه</span></div><div class="mc"><b style="color:#8fc4ff">'+F(inn-out2)+'</b><span>تراز</span></div></div>';
 q('view').innerHTML=page('💰 مالی',inner)}
/* انبار */
function vInv(){q('view').innerHTML=page('🏭 انبار','<div class="pan"><h3>➕ افزودن کالا</h3>'+formHTML('inv')+'</div>'+tableHTML('inv',[['item','کالا','l'],['qty','موجودی'],['unit','واحد']])+'<div class="pan"><h3>🛢 خروجی تولید (کد بچ را بنویس تا به همان بچ بخورد)</h3>'+formHTML('out')+'</div>'+tableHTML('out',[['prod','محصول'],['qty','مقدار'],['unit','واحد'],['batch','بچ']]))}
/* تنظیمات + دسترسی‌ها */
function vSettings(){var u=U();
 var inner='<div class="pan"><h3>👑 کاربران — تایید، نقش، دسترسی هر بخش</h3>';
 US().forEach(function(x){
  inner+='<div class="pan" style="margin-bottom:8px"><div class="ai-it"><span>'+(x.admin?'👑':x.plan>=2?'🟡':x.plan>=1?'🥉':'👁')+'</span><div style="flex:1"><b>'+E(x.name)+'</b> <span class="by">'+E(x.email)+'</span> '+(x.st==='pend'?'<span class="st-badge sb-pnd">در انتظار تایید</span>':'')+'</div>';
  if(x.st==='pend'&&ADM())inner+='<button class="pill ok" data-a="usr" data-x="ok" data-e="'+E(x.email)+'">تایید حساب</button>';
  if(ADM()&&x.email!==u.email){inner+='<button class="pill gy" data-a="usr" data-x="adm" data-e="'+E(x.email)+'">'+(x.admin?'ناظر شود':'مدیر شود')+'</button>'}
  inner+='</div>';
  if(ADM()&&!x.admin){inner+='<div style="margin-top:6px"><span class="by">دسترسی‌ها (کلیک = فعال/غیرفعال):</span><br>';
   MODS.forEach(function(m){var onx=hasMod(x,m[0]);inner+='<span class="perm'+(onx?' on':'')+'" data-a="perm" data-e="'+E(x.email)+'" data-m="'+m[0]+'">'+(onx?'✅ ':'⛔ ')+m[1]+'</span>'});
   inner+='</div>'}
  inner+='</div>'});
 inner+='</div>';
 inner+='<div class="pan"><h3>💳 درخواست‌های پرداخت</h3>'+((S('pv_payreq',[]).filter(function(r){return r.st==='pend'}).length)?S('pv_payreq',[]).filter(function(r){return r.st==='pend'}).map(function(r){return '<div class="ai-it"><span>💳</span><span style="flex:1"><b>'+E(r.by)+'</b> — '+E(r.plan)+'</span><button class="pill ok" data-a="payok" data-t="'+r.t+'">تایید</button></div>'}).join(''):'<div class="empty">—</div>')+'</div>';
 inner+='<div class="pan"><h3>♻️ خروج</h3><button class="btn out sm" data-a="logout">🚪 خروج</button></div>';
 q('view').innerHTML=page('⚙️ مدیریت و دسترسی‌ها',inner)}
function usr(x,e){var l=US(),u=l.find(function(y){return y.email===e});if(!u)return;
 if(x==='ok')u.st='ok';if(x==='adm')u.admin=!u.admin?1:0;
 W('pv_users',l);logA('👑 تغییر کاربر '+u.name);render()}
function perm(e,m){var l=US(),u=l.find(function(y){return y.email===e});if(!u)return;
 u.perms=u.perms||[];var i=u.perms.indexOf(m);
 if(i>=0)u.perms.splice(i,1);else u.perms.push(m);
 W('pv_users',l);logA('🔐 دسترسی '+m+' برای '+u.name+(i>=0?' گرفته شد':' داده شد'));view()}
function addPart(){var item=q('qp_item').value.trim(),qty=q('qp_qty').value,unit=q('qp_unit').value.trim()||'عدد';
 if(!item||!qty)return toast('نام و مقدار لازم است',1);
 var l=R('inv'),ex=l.find(function(x){return x.v.item===item});
 if(ex)ex.v.qty=(+ex.v.qty||0)+(+qty||0);else l.unshift({t:Date.now(),v:{item:item,qty:qty,unit:unit},st:'ok',by:U().name,at:hnow()});
 W('pv_inv',l);toast('📦 اضافه شد');view()}
function pm2cart(t){var l=R('pm'),p=l.find(function(x){return String(x.t)===String(t)});if(!p)return;
 var c=R('cartable');c.unshift({t:Date.now(),v:{tech:p.v.tech,title:p.v.job,due:p.v.next,note:p.v.eq},st:'pend',by:U().name,at:hnow()});
 W('pv_cartable',c);toast('📤 به کارتابل رفت');view()}

/* مسیریابی */
const VIEWS={home:vHome,dash:vDash,cook:vCook,prod:vProd,maint:vMaint,inv:vInv,req:vReq,people:vPeople,net:vNet,pay:vPay,fin:vFin,settings:vSettings};
const NEEDMOD={dash:'dash',cook:'cook',prod:'prod',maint:'maint',inv:'prod',req:'req',people:'people',net:'net',pay:'dash',fin:'dash',settings:'settings'};
function go(p){if(VIEWS[p]){route=p}},window.addEventListener('hashchange',function(){var p=(location.hash||'').replace('#/','');if(VIEWS[p]&&U()){route=p;render()}});
function render(){
 var u=U();
 var hdr=q('hdr'),lay=q('lay');
 if(!u){hdr.classList.add('hid');lay.classList.remove('hid');q('side').classList.add('hid');vHome();return}
 hdr.classList.remove('hid');lay.classList.remove('hid');q('side').classList.remove('hid');
 q('uname').textContent=u.name;
 q('ubadge').textContent=(u.admin?'مدیر کل 👑':'')+' '+planName(u.plan);
 q('ubadge').className='bdg'+(u.admin?'':' v');
 q('hics').innerHTML=[['dash','📊 داشبورد'],['cook','📋 پخت'],['net','🌐 شبکه'],['req','📥 درخواست'],['pay','💳 عضویت']].map(function(x){return '<button class="hbtn'+(route===x[0]?' on':'')+'" data-a="go" data-p="'+x[0]+'">'+x[1]+'</button>'}).join('');
 q('side').innerHTML=NAVG.map(function(g){
  var ok=g[1].filter(function(n){return u.admin||u.perms.indexOf(n[0])>=0});
  if(!ok.length)return '';
  return '<div class="gr">'+g[0]+'</div>'+ok.map(function(n){return '<button class="nv'+(route===n[0]?' on':'')+'" data-a="go" data-p="'+n[0]+'">'+n[1]+' '+n[2]+'</button>'}).join('')}).join('')+'<div style="border-top:1px solid var(--ln);margin-top:10px;padding-top:8px"><button class="nv" data-a="logout">🚪 خروج</button></div>';
 if(route==='home')route='dash';
 if(!u.admin&&!u.perms.some(function(m){return m===NEEDMOD[route]||m===route})){q('view').innerHTML=page('⛔ دسترسی ندارید','<div class="pan"><div class="empty">مدیر دسترسی این بخش را برای شما باز نکرده — از او درخواست کن</div><button class="btn out sm" data-a="go" data-p="req">📥 ثبت درخواست دسترسی</button></div>');return}
 (VIEWS[route]||vDash)();
 q('side').classList.remove('open');
}
function view(){render()}
/* کلیک مرکزی — بدون onclick تودرتو */
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 var a=t.dataset.a;
 if(a==='go'){route=t.dataset.p;location.hash='#/'+route;render()}
 else if(a==='ltab')ltab(+t.dataset.w);
 else if(a==='side')q('side').classList.toggle('open');
 else if(a==='login')doLogin();
 else if(a==='reg')doReg();
 else if(a==='logout')logout();
 else if(a==='add')addRec(t.dataset.s);
 else if(a==='appr')appr(t.dataset.s,t.dataset.t);
 else if(a==='arch')arch(t.dataset.s,t.dataset.t);
 else if(a==='rest')rest(t.dataset.s,t.dataset.t);
 else if(a==='tab')setTab(t.dataset.key,t.dataset.k);
 else if(a==='pickb')pickB(t.dataset.id);
 else if(a==='addcost')addBCost();
 else if(a==='togck')togck(t.dataset.i);
 else if(a==='addcrow')addcrow();
 else if(a==='addcsum')addcsum();
 else if(a==='env')recordEnv();
 else if(a==='print')window.print();
 else if(a==='cstart')cstart(t.dataset.t);
 else if(a==='cdone')cdone(t.dataset.t);
 else if(a==='startrec')startRec();
 else if(a==='stoprec')stopRec();
 else if(a==='clrrec'){CV=null;recUI()}
 else if(a==='pickfile'){var f=q('rq_file');if(f)f.click()}
 else if(a==='postreq')postReq();
 else if(a==='reqact')reqAct(t.dataset.x,t.dataset.t);
 else if(a==='postnet')postNet(t.dataset.k);
 else if(a==='archnet'){var l=R(t.dataset.k);var r=l.find(function(x){return String(x.t)===String(t.dataset.t)});if(r){r.st='arch';W('pv_'+t.dataset.k,l)}view()}
 else if(a==='buyplan')buyPlan(t.dataset.lv);
 else if(a==='payok')payok(t.dataset.t);
 else if(a==='usr')usr(t.dataset.x,t.dataset.e);
 else if(a==='perm')perm(t.dataset.e,t.dataset.m);
 else if(a==='addpart')addPart();
 else if(a==='pm2cart')pm2cart(t.dataset.t);
});
seed();render();
