<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پترو پارسیان — مدیریت پیرولیز</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a101f;--p1:#0e1a33;--p2:#122347;--ln:#22396b;--gold:#d4a437;--gr:#1db86a;--warn:#f0a92c;--dgr:#e2453c;--blu:#2f9be8;--pur:#7b5cd6}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 18% 0%,#13234c 0%,transparent 46%),var(--bg);color:#e9effb;min-height:100vh}
.hid{display:none!important}
#errbar{display:none;position:fixed;top:0;left:0;right:0;background:#7c1d1d;color:#fff;padding:8px;font-size:12px;z-index:9999;text-align:center}
.bg-blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.15;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--warn);top:-120px;left:-90px;animation:bl 12s ease-in-out infinite}
.b2{width:360px;height:360px;background:var(--pur);bottom:-120px;right:-80px;animation:bl 14s ease-in-out infinite reverse}
@keyframes bl{0%,100%{transform:translate(0,0)}50%{transform:translate(45px,35px)}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.view{animation:fi .3s ease}
#tw{position:fixed;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.ts{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;max-width:460px}
.ts.sh{opacity:1;transform:none}.ts.er{background:#3a1420;color:#ffc4c4;border-color:#7c2d2d}
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:linear-gradient(180deg,#13244a,#0d1a35);border:1px solid var(--ln);border-radius:20px;padding:30px 24px;max-width:430px;width:100%}
.lgl{text-align:center;font-size:52px}
.gate h1{color:var(--gold);font-size:21px;text-align:center;margin:6px 0 2px}
.gate .sub{color:#8fa8cc;font-size:12.5px;text-align:center;line-height:2}
.tabs{display:flex;gap:10px;margin:16px 0}
.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;cursor:pointer}
.tab.on{background:var(--gold);color:#1a1206;font-weight:800;border-color:var(--gold)}
.lg{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:14.5px;margin-bottom:9px}
.note{color:#8fa8cc;font-size:12px;text-align:center;margin-top:12px;line-height:2}.note b{color:var(--gold)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(10,18,38,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}.brand b{color:var(--gold);font-size:15px}.brand small{display:block;color:#8fa8cc;font-size:10.5px}
.hdr-ics{display:flex;gap:6px;overflow-x:auto}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--p1);border:1px solid var(--ln);color:#cfe0ff;border-radius:10px;padding:6px 9px;font-size:10px;font-family:inherit;cursor:pointer;min-width:56px}
.hbtn b{font-size:15px}.hbtn.on{border-color:var(--gold);color:var(--gold)}
.ui{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bdg{border-radius:99px;padding:4px 11px;font-size:11px;font-weight:800;background:var(--gold);color:#1a1206}.bdg.v{background:#2b4c80;color:#cfe0ff}
.layout{display:flex;min-height:calc(100vh - 58px)}
nav#side{width:212px;flex-shrink:0;background:rgba(12,22,44,.8);border-inline-end:1px solid var(--ln);padding:12px 9px;overflow-y:auto}
#sideToggle{display:none;background:var(--p1);border:1px solid var(--ln);color:var(--gold);border-radius:9px;padding:5px 10px;font-size:17px;font-family:inherit;cursor:pointer}
@media(max-width:960px){nav#side{position:fixed;right:-235px;z-index:200;transition:.3s;height:100vh;top:0}nav#side.open{right:0}#sideToggle{display:block}}
.gr{color:var(--gold);font-size:10.5px;margin:12px 6px 5px}
.nv{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#a9c2e8;padding:9px 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12.6px;text-align:right}
.nv:hover{background:rgba(255,255,255,.05);color:#fff}
.nv.on{background:linear-gradient(90deg,rgba(212,164,55,.22),transparent);color:var(--gold);border:1px solid rgba(212,164,55,.35)}
main{flex:1;padding:14px 16px 60px;min-width:0}
h2.vt{color:var(--gold);font-size:18px;margin-bottom:11px}
.pan{background:linear-gradient(180deg,#12224a,#0d1a35);border:1px solid var(--ln);border-radius:15px;padding:13px;margin-bottom:12px}
.pan h3{color:#cfe0ff;font-size:13.5px;margin-bottom:9px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:960px){.row2,.row3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:12px}
.kpi{border-radius:14px;padding:12px 14px;color:#fff;font-family:inherit;border:none;cursor:pointer;text-align:right}
.kpi small{display:block;font-size:10.5px;opacity:.95;margin-bottom:4px}.kpi b{font-size:17px}
.k1{background:linear-gradient(135deg,#159a52,#1db86a)}.k2{background:linear-gradient(135deg,#1565c0,#2f9be8)}
.k3{background:linear-gradient(135deg,#6d3fd4,#8b6cf0)}.k4{background:linear-gradient(135deg,#d97706,#f0a92c)}.k5{background:linear-gradient(135deg,#c0392b,#e2453c)}
.flow{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.fstp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;background:none;border:none;color:#9db4dd;font-family:inherit;font-size:9.3px;cursor:pointer;padding:5px 2px;border-radius:10px}
.fstp i{width:36px;height:36px;border-radius:50%;background:var(--p2);border:1.6px solid var(--ln);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px}
.fstp:hover i{border-color:var(--gold)}
.scrl{overflow-x:auto;border:1px solid var(--ln);border-radius:11px}
table.dtb{width:100%;border-collapse:collapse;font-size:11.5px;min-width:600px}
.dtb th{background:#152c58;color:var(--gold);padding:9px 7px;white-space:nowrap;border:1px solid #1d3566;font-weight:600}
.dtb td{padding:8px 7px;border:1px solid #1a2f5c;text-align:center;white-space:nowrap;color:#d8e4fa}
.dtb td.l{text-align:right;white-space:normal}
.dtb tr:nth-child(even) td{background:#0f1e3f}
td.hot{background:#e2453c33!important;color:#ff9f9f!important;font-weight:800}td.mid{background:#b8860b33!important;color:#ffd98c!important;font-weight:800}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:8px;margin-bottom:10px}
.fgrid label{display:block;font-size:10.5px;color:#8fa8cc;margin-bottom:4px}
.fgrid input,.fgrid select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:13px}
.btn{padding:10px 16px;border:none;border-radius:9px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.go{background:linear-gradient(90deg,#159a52,#28c76f);color:#fff}.btn.out{background:#26477e;color:#cfe0ff}
.btn.sm{padding:5px 10px;font-size:11px;border-radius:7px}
.rowact{display:flex;gap:5px;justify-content:center}
.pill{border:none;border-radius:7px;padding:5px 10px;font-family:inherit;font-weight:700;font-size:10.8px;cursor:pointer}
.pill.ok{background:var(--gr);color:#fff}.pill.wn{background:var(--warn);color:#1a1206}.pill.gy{background:#26477e;color:#cfe0ff}.pill.bl{background:var(--blu);color:#fff}
.del{background:none;border:none;color:#ff9b9b;cursor:pointer;font-size:14px}
.st-badge{border-radius:99px;padding:3px 9px;font-size:10px;font-weight:800;white-space:nowrap}
.sb-ok{background:#0e2b1a;color:#7dffbe;border:1px solid #1f5c39}.sb-pnd{background:#2b2210;color:#ffd98c;border:1px solid #6b5518}.sb-do{background:#142a4a;color:#8fc4ff;border:1px solid #2f5b9e}.sb-rt{background:#231a3d;color:#c9b3ff;border:1px solid #4a3a7a}
.rem{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:11px;font-size:12px;margin-bottom:6px;border-inline-start:4px solid;flex-wrap:wrap}
.rem .tech{margin-inline-start:auto;color:#8fa8cc;font-size:10.5px}
.rem-r{background:#2a1215;border-color:var(--dgr)}.rem-y{background:#2b2210;border-color:var(--warn)}.rem-b{background:#12283f;border-color:var(--blu)}
.gwrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gcard{text-align:center}.gcard .lbl{color:#8fa8cc;font-size:10px}
.flame{transform-origin:50% 100%;animation:ffl .9s ease-in-out infinite}.flame.f2{animation-duration:1.05s;animation-delay:.15s}.flame.f3{animation-duration:.78s;animation-delay:.3s}
@keyframes ffl{0%,100%{transform:scaleY(1)}30%{transform:scaleY(1.15) scaleX(.9)}60%{transform:scaleY(.88) scaleX(1.07)}}
.stm{animation:rise 2.6s ease-in infinite;transform-box:fill-box}.stm.s2{animation-delay:.7s}.stm.s3{animation-delay:1.4s}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.55}100%{transform:translateY(-42px) scale(1.7);opacity:0}}
.tl{display:flex;flex-direction:column;gap:8px}
.tl-r{display:flex;gap:9px;align-items:flex-start;font-size:11.6px}
.tl-d{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tb{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;font-size:12px;cursor:pointer}
.tb.on{background:var(--gold);color:#1a1206;font-weight:800;border-color:var(--gold)}
.ai-it{display:flex;gap:8px;padding:8px 2px;border-bottom:1px dashed #1c3560;font-size:12.2px;align-items:flex-start;flex-wrap:wrap}
.bcard{background:#0c1a35;border:1px solid var(--ln);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer}
.bcard.on{border-color:var(--gold);background:#12234a}
.bcard .brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.bcard .bx{flex:1;min-width:88px;text-align:center}.bcard .bx b{display:block;font-size:14px}.bcard .bx span{color:#8fa8cc;font-size:10px}
.mat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{background:#0c1a35;border:1px solid var(--ln);border-radius:11px;padding:10px;text-align:center}
.mc b{display:block;font-size:14.5px;color:#fff}.mc span{font-size:10px;color:#8fa8cc}
.empty{color:#8fa8cc;font-size:12.5px;text-align:center;padding:10px}
@media print{header,nav#side,#tw,.btn,.pill,.del,.chipbar{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="errbar"></div>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div>

<div id="gate" class="gate"><div class="card">
<div class="lgl">🔥</div><h1>پترو پارسیان — اکسیر جوانی</h1>
<div class="sub">PYROHUB · سامانه جامع مدیریت پیرولیز · 09154040240</div>
<div class="tabs"><button class="tab on" id="tl" onclick="stab(0)">ورود</button><button class="tab" id="tr" onclick="stab(1)">ثبت‌نام</button></div>
<div id="fl"><input id="le" class="lg" type="email" placeholder="ایمیل"><input id="lp" class="lg" type="password" placeholder="رمز عبور"><button class="btn go" style="width:100%" onclick="doLogin()">ورود به سامانه</button></div>
<div id="fr" class="hid"><input id="rn" class="lg" placeholder="نام و نام‌خانوادگی"><input id="re" class="lg" type="email" placeholder="ایمیل"><input id="rp" class="lg" type="password" placeholder="رمز (حداقل ۶)"><button class="btn go" style="width:100%" onclick="doReg()">ثبت‌نام</button></div>
<div class="note">حساب قبلی اگر کار نکرد، یک‌بار <b>ثبت‌نام</b> کن —<br><b>اولین ثبت‌نام = مدیر کل 👑</b> و پرسنل هم می‌تواند درخواست بدهد</div>
</div></div>

<div id="shell" class="hid">
<header>
<button id="sideToggle" onclick="q('side').classList.toggle('open')">☰</button>
<div class="brand"><span style="font-size:26px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · مدیریت پیرولیز</small></div></div>
<div class="hdr-ics">
<button class="hbtn" data-p="dash" onclick="go('dash')"><b>📊</b>داشبورد</button>
<button class="hbtn" data-p="agent" onclick="go('agent')"><b>🤖</b>ایجنت</button>
<button class="hbtn" data-p="req" onclick="go('req')"><b>📥</b>درخواست</button>
<button class="hbtn" data-p="charts" onclick="go('charts')"><b>📈</b>گزارش</button>
</div>
<div class="ui"><span id="uname"></span><span class="bdg" id="ubadge"></span><button class="btn out sm" onclick="logout()">خروج</button></div>
</header>
<div class="layout"><nav id="side"></nav><main id="view"></main></div>
</div>
<div id="tw"></div>

<script>
"use strict";
const q=i=>document.getElementById(i);
window.onerror=function(m,s,l){var b=q('errbar');if(b){b.style.display='block';b.textContent='⚠️ خطا: '+m+' (خط '+l+')'}};
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>(+n||0).toLocaleString('fa-IR');
function S(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('حافظه پر است!',1);return false}}
const R=k=>S('pv_'+k,[]);
const US=()=>S('pv_users',[]);
function U(){var s=S('pv_sess',null);if(!s)return null;var u=US().find(function(x){return x.email===s});return u&&u.st==='ok'?u:null}
function ADM(){var u=U();return !!u&&!!u.admin}
function toast(m,er){var t=document.createElement('div');t.className='ts'+(er?' er':'');t.textContent=m;q('tw').appendChild(t);requestAnimationFrame(function(){t.classList.add('sh')});setTimeout(function(){t.classList.remove('sh');setTimeout(function(){t.remove()},300)},3200)}
function logA(txt){var l=S('pv_agentlog',[]);l.unshift({t:Date.now(),txt:txt});W('pv_agentlog',l.slice(0,80))}
function stab(w){q('tl').classList.toggle('on',w===0);q('tr').classList.toggle('on',w===1);q('fl').classList.toggle('hid',w!==0);q('fr').classList.toggle('hid',w!==1)}

/* ---- تاریخ شمسی ---- */
function d2j(gy,gm,gd){var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;var gy2=(gm>2)?(gy+1):gy;var days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return[jy,jm,jd]}
function todayJ(){var d=new Date();var j=d2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0')}
function dayO(j){var p=(j||'').split('/');if(p.length!==3)return null;var y=+p[0],m=+p[1],d=+p[2];if(!y||!m||!d)return null;var doy=m<=6?(m-1)*31+d:186+(m-7)*30+d;return y*365+doy}
function daysU(j){var t=dayO(todayJ());var x=dayO(j);if(t==null||x==null)return null;return x-t}
function dLbl(d){if(d==null)return 'بدون تاریخ';if(d>0)return F(d)+' روز مانده';if(d===0)return 'امروز!';return F(-d)+' روز گذشته'}

/* ---- احراز ---- */
async function hs(t){try{var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pp·'+t));return [...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){var h=0,s='pp·'+t;for(var i=0;i<s.length;i++){h=((h*31)+s.charCodeAt(i))>>>0}return 'f'+h}}
async function doReg(){
 var n=q('rn').value.trim(),e=q('re').value.trim().toLowerCase(),p=q('rp').value;
 if(!n||!e||!p){toast('همه فیلدها را پر کنید',1);return}
 if(p.length<6){toast('رمز حداقل ۶ کاراکتر',1);return}
 var l=US();
 var exists=l.some(function(u){return u.email===e});
 if(exists){toast('این ایمیل قبلاً ثبت شده — وارد شوید',1);return}
 var h=await hs(p);
 if(l.length===0){
  l.push({email:e,pass:h,name:n,admin:1,st:'ok'});
  W('pv_users',l);W('pv_sess',e);toast('خوش آمدید مدیر کل 👑');seed();route='dash';render();
 }else{
  l.push({email:e,pass:h,name:n,admin:0,st:'ok'});
  W('pv_users',l);W('pv_sess',e);toast('خوش آمدی '+n+' 📥');seed();route='dash';render();
 }
}
async function doLogin(){
 var e=q('le').value.trim().toLowerCase(),p=q('lp').value;
 if(!e||!p){toast('ایمیل و رمز را وارد کنید',1);return}
 var u=US().find(function(x){return x.email===e});
 if(!u){toast('این ایمیل ثبت نشده — از تب ثبت‌نام وارد شو',1);return}
 var h=await hs(p);
 if(u.pass!==h){toast('رمز اشتباه است',1);return}
 if(u.st==='pend'){toast('حساب منتظر تایید مدیر است',1);return}
 W('pv_sess',e);q('lp').value='';seed();route='dash';render();toast('خوش آمدی '+u.name+' 👋');
}
function logout(){localStorage.removeItem('pv_sess');render()}
function approveUser(em){var l=US(),u=l.find(function(x){return x.email===em});if(u){u.st='ok';W('pv_users',l);toast('تایید شد')}render()}
function delUser(em){W('pv_users',US().filter(function(x){return x.email!==em}));render()}
function setAdm(em,v){var l=US(),u=l.find(function(x){return x.email===em});if(u){u.admin=v?1:0;W('pv_users',l);render()}}

/* ---- داده اولیه ---- */
function seed(){
 if(S('pv_seeded'))return;W('pv_seeded',1);

async function startRec(){
 try{
  var st=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaR=new MediaRecorder(st);CHUNKS=[];
  mediaR.ondataavailable=function(e){CHUNKS.push(e.data)};
  mediaR.onstop=function(){
   var b=new Blob(CHUNKS,{type:'audio/webm'});
   var r=new FileReader();
   r.onload=function(){CUR_VOICE=r.result;recUI()};
   r.readAsDataURL(b);
   st.getTracks().forEach(function(x){x.stop()});
  };
  mediaR.start();REC=true;recUI();
 }catch(e){toast('میکروفون در دسترس نیست',1)}
}

function vAgent(){
 var pend=R('req').filter(function(r){return r.st==='pend'});
 var rem=remList();
 var cs=R('chk').filter(function(x){return x.st==='pend'});
 var low=R('inv').filter(function(x){return +x.v.qty<5});
 var hot=R('hourly').filter(function(x){return +x.v.t1>320});
 var items=[];
 if(pend.length)items.push(['📥',F(pend.length)+' درخواست تازه در صندوق زیر']);
 if(rem.length)items.push(['⏰','یادآوری: '+rem[0].eq+' — '+dLbl(rem[0].d)]);
 if(cs.length)items.push(['🔒','چک‌لیست استارت ناقص — '+F(cs.length)+' مورد']);
 if(hot.length)items.push(['🚨',F(hot.length)+' دمای بالای ۳۲۰ درجه!']);
 if(low.length)items.push(['⚠️','موجودی کم: '+low.map(function(x){return x.v.item}).join('، ')]);
 if(!items.length)items.push(['✅','سامانه سالم است — هشدار جدی یافت نشد']);
 var inner='<div class="row2"><div class="pan"><h3>🩺 پایش کامل سامانه (لحظه‌ای)</h3>';
 items.forEach(function(x){inner+='<div class="ai-it"><span>'+x[0]+'</span><span>'+E(x[1])+'</span></div>'});
 inner+='</div><div class="pan"><h3>📥 صندوق درخواست</h3>'+reqList(R('req').slice(0,10))+'</div></div>';
 var log=S('pv_agentlog',[]);
 inner+='<div class="pan"><h3>📜 گزارش اقدامات ایجنت</h3>'+(log.length?log.slice(0,15).map(function(x){return '<div class="ai-it"><span>›</span><span>'+E(x.txt)+'</span></div>'}).join(''):'<div class="empty">—</div>')+'</div>';
 q('view').innerHTML=page('🤖 ایجنت هوشمند سامانه',inner);
}
function vPeople(){
 var L={};
 R('hrm').forEach(function(p){L[p.v.n]={n:p.v.n,r:p.v.r||'—',rep:0,repC:0,batch:0,task:0}});
 R('maint').forEach(function(m){if(L[m.v.tech]){L[m.v.tech].rep++;L[m.v.tech].repC+=(+m.v.cost||0)}});
 R('batch').forEach(function(b){if(L[b.v.op])L[b.v.op].batch++});
 R('cartable').forEach(function(c){if(c.st==='done'&&L[c.v.tech])L[c.v.tech].task++});
 var P=Object.values(L);
 var rows=P.map(function(p,i){return '<tr><td>'+(i+1)+'</td><td class="l">'+E(p.n)+'</td><td class="l">'+E(p.r)+'</td><td><b style="color:#f0a92c">'+F(p.rep)+'</b></td><td style="color:#ff9f9f">'+F(p.repC)+'</td><td style="color:#8fc4ff">'+F(p.batch)+'</td><td style="color:#7dffbe">'+F(p.task)+'</td></tr>'}).join('');
 var inner='<div class="pan"><h3>بر اساس ثبت‌های واقعی سامانه</h3><div class="scrl"><table class="dtb" style="min-width:520px"><thead><tr><th>#</th><th>نام</th><th>سمت</th><th>تعمیرات</th><th>هزینه (تومان)</th><th>بچ اپراتوری</th><th>کارتابل انجام‌شده</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">پرسنلی نیست</td></tr>')+'</tbody></table></div></div>';
 inner+='<div class="pan"><h3>➕ افزودن پرسنل</h3>'+formHTML('hrm')+'</div>'+tableHTML('hrm',[['n','نام','l'],['r','سمت','l'],['sh','شیفت']]);
 q('view').innerHTML=page('👥 عملکرد پرسنل',inner);
}
function vProc(){
 var cur=TABS.proc||'buy';

function vFin(){
 var cur=TABS.fin||'sell';
 var inner=tabsUI('fin',[{k:'sell',n:'📦 فاکتورها'},{k:'fin',n:'💰 دریافت/پرداخت'},{k:'due',n:'⚠️ مطالبات'}],cur);
 if(cur==='sell'){inner+='<div class="pan"><h3>➕ فاکتور جدید</h3>'+formHTML('sell')+'</div>'+tableHTML('sell',[['item','محصول'],['qty','مقدار'],['price','قیمت واحد'],['cust','خریدار'],['due','سررسید'],['total','مبلغ کل']])}
 else if(cur==='fin'){inner+='<div class="pan"><h3>➕ ثبت مالی</h3>'+formHTML('fin')+'</div>'+tableHTML('fin',[['ft','نوع'],['title','عنوان','l'],['amt','مبلغ']])}
 else{
  var d=R('sell').filter(function(x){return !x.v.paid});

  inner+='<div class="mat-cards">';
  inner+='<div class="mc" style="background:#0e2b1a"><b style="color:#7dffbe">'+F(tot)+'</b><span>کل مطالبات</span></div>';
  inner+='<div class="mc" style="background:#3a2a10"><b style="color:#ffd98c">'+F(d.length)+'</b><span>سررسید نشده</span></div>';
  inner+='<div class="mc" style="background:#2a1215"><b style="color:#ff9f9f">۰</b><span>سررسید گذشته</span></div></div>';
  d.forEach(function(x){
   inner+='<div class="pan"><div class="ai-it"><span>🧾</span><span style="flex:1"><b>'+E(x.v.item)+'</b> — '+E(x.v.cust)+' | '+F(x.v.total)+' ریال | سررسید: '+E(x.v.due||'—')+'</span>'+(ADM()?'<button class="pill ok" onclick="payOff('+x.t+')">تسویه شد</button>':'')+'</div></div>';
  });
 }
 q('view').innerHTML=page('💰 مالی و فروش',inner);
}
function payOff(t){var l=R('sell'),x=l.find(function(y){return y.t===t});if(x){x.v.paid=1;W('pv_sell',l);view()}}
function vCharts(){
 var dl=R('daily',[]);
 var vals=(dl&&dl.length)?dl:[1220,1450,1310,1520,1180,1380,1610,1420,1290,1580];
 var labels=vals.map(function(v,i){return String(i+1)});

 var outS=fin.filter(function(x){return x.v.ft==='out'}).reduce(function(s,x){return s+(+x.v.amt||0)},0);
 var inner='<div class="pan"><h3>📈 تولید و فروش (میلیون)</h3>'+bars(vals,labels,'#2f9be8')+'</div>';
 inner+='<div class="row2">';
 inner+='<div class="pan"><h3>🥧 ترکیب خوراک</h3>'+donut([{n:'لاستیک',v:65,c:'#2f9be8'},{n:'پلاستیک',v:20,c:'#38e0a0'},{n:'روغن سوخته',v:10,c:'#ff9d5c'},{n:'مخلوط',v:5,c:'#7b5cd6'}],120)+'</div>';
 inner+='<div class="pan"><h3>🥧 سهم شرکا (میلیون)</h3>'+donut([{n:'شرکت الف',v:62.5,c:'#ff9d5c'},{n:'شرکت ب',v:41.8,c:'#2f9be8'},{n:'خالص',v:20.7,c:'#38e0a0'}],120)+'</div>';
 inner+='</div>';
 inner+='<div class="pan"><h3>📊 گیج‌های لحظه‌ای</h3><div class="gwrap">'+gauge(+h0.v.t1||235,'°C',0,450,'دمای راکتور','#ff9d5c')+gauge(+h0.v.press||0.42,'Bar',0,1,'فشار','#38b6ff')+'</div></div>';
 inner+='<div class="row2"><div class="pan" style="background:#0e2b1a"><b style="color:#7dffbe;font-size:19px">'+F(inS)+'</b><br><span style="color:#8fa8cc">درآمد</span></div>';
 inner+='<div class="pan" style="background:#3a1420"><b style="color:#ff9f9f;font-size:19px">'+F(outS)+'</b><br><span style="color:#8fa8cc">هزینه‌ها</span></div></div>';
 inner+='<button class="btn out" onclick="window.print()">🖨️ چاپ گزارش</button>';
 q('view').innerHTML=page('📈 گزارش‌ها و نمودارها',inner);
}
function vSettings(){
 var inner='<div class="pan"><h3>👑 مدیریت کاربران</h3>';
 US().forEach(function(u){
  inner+='<div class="ai-it"><span>'+(u.admin?'👑':'👁')+'</span><div style="flex:1"><b>'+E(u.name)+'</b> <span style="color:#8fa8cc;font-size:11px">'+E(u.email)+'</span>'+(u.st==='pend'?' <span class="st-badge sb-pnd">در انتظار</span>':'')+'</div>';
  if(u.st==='pend'&&ADM())inner+='<button class="pill ok" onclick="approveUser(\''+E(u.email)+'\')">تایید</button>';
  if(ADM()&&u.email!==S('pv_sess')){inner+='<button class="btn out sm" onclick="setAdm(\''+E(u.email)+'\','+(!u.admin)+')">'+(u.admin?'ناظر شود':'مدیر شود')+'</button><button class="del" onclick="delUser(\''+E(u.email)+'\')">✖</button>'}
  inner+='</div>';
 });
 inner+='</div>';
 inner+='<div class="pan"><h3>♻️ خروج و ریست</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn out" onclick="logout()">🚪 خروج</button>';
 if(ADM())inner+='<button class="btn out" onclick="if(confirm(\'همه داده‌ها پاک شود؟\')){localStorage.clear();location.reload()}">♻️ ریست کامل</button>';
 inner+='</div></div>';
 q('view').innerHTML=page('⚙️ تنظیمات',inner);
}
function vServices(){

 sv.forEach(function(x){inner+='<div class="pan" style="text-align:center;margin:0;cursor:pointer" onclick="toast(\''+E(x[2])+'\')"><div style="font-size:26px">'+x[0]+'</div><b style="color:var(--gold)">'+x[1]+'</b><br><span style="color:#8fa8cc;font-size:11px">'+E(x[2])+'</span></div>'});

/* ---- مسیریابی ---- */
const NAVG=[
 ['کلی',[['dash','📊','داشبورد'],['charts','📈','گزارش‌ها']]],
 ['عملیات',[['prod','🔥','بچ و هزینه‌ها'],['maint','🔧','تعمیرات و کارتابل'],['inv','🏭','انبار']]],
 ['هوشمند',[['agent','🤖','ایجنت پایش'],['req','📥','درخواست پرسنل']]],
 ['سازمان',[['people','👥','عملکرد پرسنل'],['proc','🛒','خرید'],['fin','💰','مالی'],['services','🧩','خدمات'],['settings','⚙️','تنظیمات']]]
];
const VIEWS={dash:vDash,prod:vProd,proc:vProc,inv:vInv,fin:vFin,maint:vMaint,people:vPeople,charts:vCharts,agent:vAgent,req:vReq,services:vServices,settings:vSettings};
function go(p){location.hash='#/'+p}
let route='dash';
window.addEventListener('hashchange',function(){
 var p=(location.hash||'').replace('#/','')||'dash';
 if(VIEWS[p]){route=p;render()}
});
function buildSide(){
 q('side').innerHTML=NAVG.map(function(g){
  return '<div class="gr">'+g[0]+'</div>'+g[1].map(function(n){return '<button class="nv" data-p="'+n[0]+'" onclick="go(\''+n[0]+'\')">'+n[1]+' '+n[2]+'</button>'}).join('');
 }).join('');
}
function render(){
 var u=U();
 if(!u){q('gate').classList.remove('hid');q('shell').classList.add('hid');return}
 q('gate').classList.add('hid');q('shell').classList.remove('hid');
 q('uname').textContent=u.name;
 q('ubadge').textContent=u.admin?'مدیر کل 👑':'پرسنل';
 q('ubadge').className='bdg'+(u.admin?'':' v');
 buildSide();
 document.querySelectorAll('#side .nv').forEach(function(b){b.classList.toggle('on',b.dataset.p===route)});
 document.querySelectorAll('.hbtn').forEach(function(b){b.classList.toggle('on',b.dataset.p===route)});
 (VIEWS[route]||vDash)();
 q('side').classList.remove('open');
 window.scrollTo(0,0);
}
function view(){(VIEWS[route]||vDash)()}
seed();render();
</script>
