<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پترو پارسیان — اکسیر جوانی</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(900px 500px at 50% -150px,#152a52,#0a1428 65%);min-height:100vh;color:#e8eef7}
.hidden{display:none!important}
#tw{position:fixed;bottom:14px;left:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#12331f;color:#b9ffd7;border:1px solid #2e9e6b;padding:10px 18px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.3s;max-width:92%;font-size:14px}
.toast.show{opacity:1;transform:none}
.toast.error{background:#3a1414;color:#ffc4c4;border-color:#e05252}
#gate{display:flex;justify-content:center;padding:26px 12px}
.card{background:#0f1e3d;border:1px solid #24406f;border-radius:22px;max-width:430px;width:100%;padding:34px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{font-size:62px}
.card h1{color:#d4a437;font-size:24px;margin:10px 0 6px}
.sub{color:#8fa8cc;font-size:13.5px;margin-bottom:22px}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #2a4270;background:transparent;color:#cfe0f5;font-size:15px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#e6b84c,#c8942c);color:#221703;font-weight:800;border-color:transparent}
.fld{text-align:right;margin-bottom:12px}
.fld label{display:block;font-size:13px;color:#a8bdda;margin-bottom:6px}
input,select,button,textarea{font-family:inherit}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2a4270;background:#0b1830;color:#eef3fa;font-size:15px;outline:none}
.inp:focus{border-color:#d4a437}
.err{color:#ff8f8f;font-size:12px;min-height:16px;text-align:right;margin-top:4px}
.fbtn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#37bd7c,#248a58);color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px}
.fbtn.warn{background:linear-gradient(135deg,#e0703c,#b04417)}
.fbtn:active{transform:scale(.98)}
.hint{color:#7d92b5;font-size:12.5px;line-height:2;margin-top:16px}
.gold{color:#e6b84c;font-weight:700}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(13,25,50,.92);border-bottom:1px solid #24406f;position:sticky;top:0;z-index:50}
.hbrand{font-size:15px}
.hbrand b{color:#ffd97a}
.hsub{color:#8fa8cc;font-size:12px;margin-right:6px}
.huser{display:flex;align-items:center;gap:10px}
.uchip{text-align:left}
.uchip b{font-size:13px;display:block}
.uchip small{font-size:11px;color:#e6b84c}
#outBtn{background:#33141d;color:#ff9aa8;border:1px solid #6b2437;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:13px}
.wrap{display:flex;align-items:flex-start}
#aside{width:235px;flex-shrink:0;background:#0d1a36;border-left:1px solid #24406f;padding:14px 10px;min-height:calc(100vh - 58px)}
.grp{margin-bottom:16px}
.grp h4{color:#e6b84c;font-size:12px;margin:0 6px 8px}
.sitem{display:block;width:100%;text-align:right;padding:11px 12px;border-radius:10px;background:transparent;border:none;color:#cfe0f5;font-size:13.5px;cursor:pointer;margin-bottom:3px}
.sitem.on{background:#1b3158;color:#ffd97a;font-weight:700}
#main{flex:1;padding:16px 14px;max-width:880px}
.vhead h2{color:#ffd97a;font-size:19px}
.vhead p{color:#8fa8cc;font-size:12.5px;margin:4px 0 14px}
.panel{background:#0f1e3d;border:1px solid #24406f;border-radius:16px;padding:15px;margin-bottom:15px}
.panel h3{color:#dce8f8;font-size:14.5px;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:15px}
.kpi{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.kpi i{font-style:normal;font-size:26px}
.kpi h5{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:400;margin-bottom:3px}
.kpi .v{font-size:17px;font-weight:800}
.k-blue{background:#16335f}.k-green{background:#14432c}.k-org{background:#4b2d12}.k-red{background:#4a1414}.k-pur{background:#2e1f55}
.tbw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
th{color:#8fa8cc;font-size:11.5px;font-weight:400}
th,td{padding:9px 8px;border-bottom:1px solid #1d3260;text-align:center}
.badc{background:#4a1414;color:#ff9c9c;padding:2px 9px;border-radius:8px;display:inline-block}
.warnc{background:#4b2d12;color:#ffce8a;padding:2px 9px;border-radius:8px;display:inline-block}
.okc{background:#14432c;color:#9ce8bd;padding:2px 9px;border-radius:8px;display:inline-block}
.stbox{padding:13px;border-radius:12px;text-align:center;font-weight:800;margin:12px 0 6px}
.st-lock{background:#3d0f0f;color:#ff9c9c;border:1px solid #7a2020}
.st-open{background:#0f3d24;color:#9ce8bd;border:1px solid #1f6640}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid #2a4270;background:transparent;color:#cfe0f5;font-size:12.5px;cursor:pointer}
.seg button.on{background:#1b3158;color:#ffd97a;border-color:#c8942c}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 0}
.fs{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#a8bdda;width:64px}
.fi{width:44px;height:44px;border-radius:50%;background:#1b3158;border:1px solid #2f4d85;display:flex;align-items:center;justify-content:center;font-size:20px;animation:pop .5s both}
.far{color:#3a5a8f;font-size:13px}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.muted2{color:#7d92b5;font-size:12.5px;margin-top:8px;line-height:2}
.rolesel{background:#0b1830;color:#eef3fa;border:1px solid #2a4270;border-radius:8px;padding:6px;font-size:12.5px}
@media(max-width:720px){
.wrap{flex-direction:column}
#aside{width:100%;display:flex;overflow-x:auto;min-height:0;border-left:none;border-bottom:1px solid #24406f;padding:10px}
.grp{margin:0 6px;display:flex;gap:6px;align-items:flex-end;padding-top:30px;position:relative}
.grp h4{position:absolute;top:6px;right:2px}
.sitem{white-space:nowrap;margin:0;border:1px solid #2a4270}
}
</style>
</head>
<body>
<div id="tw"></div>

<div id="gate">
 <div class="card">
  <div class="logo">🔥</div>
  <h1>پترو پارسیان — اکسیر جوانی</h1>
  <div class="sub">PYROHUB · سامانه جامع مدیریت کارخانه‌های پیرولیز</div>
  <div class="tabs">
   <button id="tLogin" class="on" type="button">ورود</button>
   <button id="tReg" type="button">ثبت‌نام</button>
  </div>
  <div class="err" id="eTop"></div>
  <div class="fld hidden" id="gName">
   <label>نام و نام خانوادگی</label>
   <input class="inp" id="qName" placeholder="مثلاً: حسین سالیمی">
  </div>
  <div class="fld">
   <label>ایمیل</label>
   <input class="inp" id="qEmail" type="email" dir="ltr">
   <div class="err" id="eE"></div>
  </div>
  <div class="fld">
   <label>رمز عبور</label>
   <input class="inp" id="qPass" type="password" placeholder="حداقل ۶ کاراکتر" dir="ltr">
   <div class="err" id="eP"></div>
  </div>
  <div class="fld hidden" id="gPass2">
   <label>تکرار رمز عبور</label>
   <input class="inp" id="qPass2" type="password" dir="ltr">
   <div class="err" id="eP2"></div>
  </div>
  <button class="fbtn" id="goBtn" type="button">ورود به سامانه</button>
  <div class="hint">اولین ثبت‌نام = <span class="gold">مدیر کل 👑</span><br>ثبت‌نام‌های بعدی «ناظر» می‌شوند تا مدیر نقش‌شان را تعیین کند.</div>
 </div>
</div>

<div id="app" class="hidden">
 <header>
  <div class="hbrand">🔥 <b>پترو پارسیان</b><span class="hsub">اکسیر جوانی</span></div>
  <div class="huser">
   <div class="uchip"><b id="uName"></b><small id="uRole"></small></div>
   <button id="outBtn" type="button">خروج</button>
  </div>
 </header>
 <div class="wrap">
  <aside id="aside"></aside>
  <main id="main"></main>
 </div>
</div>
<script src="app.js"></script>
</body>
</html>
