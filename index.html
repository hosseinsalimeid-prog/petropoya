<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyroFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0a0e17;color:#eef2f7;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{background:#0d1220;border:1px solid #29323d;border-radius:9px;padding:10px;color:#eef2f7;font-family:inherit;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:#ff7a30}
.hid{display:none!important}
.btn{padding:10px 18px;border-radius:10px;font-weight:700;font-size:13.5px}
.bp{background:linear-gradient(135deg,#ff7a30,#ff9d5c);color:#12100d}
.bg{background:#243447;color:#cfe0ff}
.sm{padding:6px 12px;font-size:12px}
.full{width:100%}
#tw{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99}
.tst{background:#151d2e;border:1px solid #2bd9a8;padding:9px 16px;border-radius:20px;font-size:12.5px;display:none;max-width:88vw;text-align:center}
.tst.on{display:block}
#home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;text-align:center;background:radial-gradient(circle at 50% 0%,#182236 0%,#0a0e17 70%)}
.taglb{background:rgba(255,122,48,.12);color:#ffb066;border:1px solid rgba(255,122,48,.3);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700}
#home h1{color:#ff7a30;font-size:30px;margin:12px 0 6px}
#home p{color:#8b98a6;font-size:13.5px;line-height:2;max-width:460px;margin-bottom:20px}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:80;padding:14px}
.mbox{background:#111827;border:1px solid #29323d;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;position:relative}
.mx{position:absolute;top:10px;left:10px;background:#243447;color:#fff;width:28px;height:28px;border-radius:50%}
.mtabs{display:flex;gap:8px;margin:13px 0}
.mtab{flex:1;padding:9px;border-radius:10px;border:1px solid #29323d;color:#8b98a6;font-weight:700}
.mtab.on{background:#ff7a30;color:#12100d;border-color:#ff7a30}
label{font-size:11px;color:#8b98a6;display:block;margin:8px 0 4px}
.ckx{display:flex;align-items:center;gap:7px;background:#151d2e;border:1px solid #29323d;border-radius:9px;padding:9px 10px;font-size:11.5px;cursor:pointer}
.ckx input{width:15px;height:15px;accent-color:#2bd9a8}
#shell{display:flex;min-height:100vh}
.hd{position:sticky;top:0;z-index:60;background:rgba(10,14,23,.96);border-bottom:1px solid #29323d;height:50px;display:flex;align-items:center;gap:8px;padding:0 12px;width:100%}
.hd .br{color:#ff7a30;font-weight:800}
#side{width:200px;background:#0d1220;border-left:1px solid #29323d;padding:10px 8px;flex-shrink:0}
#side .g{font-size:9.5px;color:#5f6c79;padding:9px 8px 3px}
.nv{display:block;width:100%;padding:9px 10px;border-radius:9px;color:#8b98a6;font-size:12.5px;text-align:right;font-weight:600;margin-bottom:1px}
.nv.on{background:rgba(255,122,48,.14);color:#ffb066}
#main{flex:1;padding:14px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;flex-wrap:wrap;gap:8px}
.ph h2{font-size:17px;color:#ff7a30}
.s{color:#5f6c79;font-size:10.5px}
.dv{background:#111827;border:1px solid #29323d;border-radius:12px;padding:13px;margin-bottom:10px}
.dv h3{font-size:12.5px;margin-bottom:9px;color:#cfe0ff}
.kw{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:10px}
.kc{background:#111827;border:1px solid #29323d;border-radius:11px;padding:11px}
.kc .l{font-size:10px;color:#5f6c79;margin-bottom:4px}
.kc .v{font-size:16px;font-weight:700;color:#ffdd99}
.tblw{overflow-x:auto;border:1px solid #29323d;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:10.5px;min-width:540px}
th{background:#151d2e;color:#ffb066;padding:7px;text-align:right;border-bottom:2px solid rgba(255,122,48,.3);font-size:9.5px;white-space:nowrap}
td{padding:7px;border-bottom:1px solid #1c2531;white-space:nowrap;color:#c8d4de}
tr.arc{opacity:.55}
td.h{background:rgba(239,75,75,.18);color:#ffb4b4;font-weight:700}
td.m{background:rgba(245,185,66,.14);color:#ffdd99;font-weight:700}
td.g{color:#7dffce;font-weight:700}
td.e{background:rgba(79,163,209,.14);color:#8ec9e8}
.em{text-align:center;color:#5f6c79;padding:13px;font-size:11.5px}
.bp2{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;display:inline-block}
.ok2{background:#0e2b1a;color:#7dffce}.wr{background:#2b2210;color:#ffdd99}
.pl{border-radius:6px;padding:3px 8px;font-size:9.5px;font-weight:700;margin:1px}
.p1{background:#2bd9a8;color:#04120c}.p2{background:#f5b942;color:#1a1305}.p3{background:#243447;color:#bcd0e4}.p4{background:#4fa3d1;color:#04101a}.p5{background:#ef4b4b;color:#fff}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-bottom:9px}
.fg label{font-size:10px}
.nt{background:#151d2e;border-right:3px solid #f5b942;padding:9px 11px;border-radius:8px;font-size:11.5px;margin-bottom:9px;line-height:1.9;display:flex;gap:7px}
.nt.g2{border-right-color:#2bd9a8}
.gbx{background:#092318;border:1px solid rgba(43,217,168,.3);color:#b9ffe6;border-radius:10px;padding:10px;font-size:12px;text-align:center;margin-bottom:9px}
.lkb{background:#280f14;border:1px solid rgba(239,75,75,.35);color:#ffb4b4;border-radius:10px;padding:10px;font-size:12px;text-align:center;margin-bottom:9px}
.vbt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:18px;border:2px dashed #ff7a30;border-radius:14px;background:rgba(255,122,48,.06);width:100%;margin-bottom:11px}
.vbt .vi{font-size:28px}.vbt .vt{font-size:13px;font-weight:800;color:#ffb066}
.vbt .vs{font-size:10.5px;color:#8b98a6;text-align:center;line-height:1.8}
.vbt.rc{border-color:#ef4b4b;background:rgba(239,75,75,.08)}
.aud{background:#151d2e;border:1px solid #29323d;border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:11px;line-height:1.9}
.aud b{color:#ffb066}
.b4{background:rgba(239,75,75,.15);color:#ffb4b4;padding:2px 6px;border-radius:5px;font-size:10px;max-width:140px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.af{background:rgba(43,217,168,.15);color:#7dffce;padding:2px 6px;border-radius:5px;font-size:10px;max-width:140px;display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ptg{display:inline-block;background:#151d2e;border:1px solid #29323d;border-radius:8px;padding:4px 8px;font-size:9.5px;color:#8b98a6;cursor:pointer;margin:2px}
.ptg.on{background:#0e2b1a;border-color:rgba(43,217,168,.4);color:#7dffce}
.pmrow{background:#151d2e;border:1px solid #29323d;border-radius:10px;padding:10px;margin-bottom:8px;font-size:12px}
.spc{background:#111827;border:1px solid #29323d;border-radius:12px;padding:12px;cursor:pointer;margin-bottom:9px}
.spc .t{font-size:12.5px;font-weight:800;color:#ffb066;margin-bottom:5px}
.spc .r{display:flex;justify-content:space-between;font-size:10.5px;color:#8b98a6}
.spc .r b{color:#eef2f7}
.arcw{background:#151d2e;border:1px solid #29323d;border-radius:10px;padding:11px;margin-bottom:9px;font-size:11px}
.stp-w{display:flex;margin-top:9px}
.stp{flex:1;text-align:center;font-size:9.5px;color:#5f6c79}
.stp .dd{width:24px;height:24px;border-radius:50%;border:2px solid #29323d;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;background:#0a0e17;font-size:11px}
.stp.dn .dd{border-color:#2bd9a8;color:#2bd9a8;background:#0e2b1a}
.stp.ac .dd{border-color:#ff7a30;color:#ff7a30;background:rgba(255,122,48,.1)}
@media(max-width:760px){#side{position:fixed;right:-210px;top:50px;z-index:70;height:calc(100vh - 50px);transition:.3s}#side.op{right:0}}
</style>
</head>
<body>
<div id="ebar" style="display:none;position:fixed;top:0;left:0;right:0;background:#7c1d1d;color:#fff;padding:6px;font-size:11px;z-index:999;text-align:center"></div>
<div id="tw"><div class="tst" id="tst"></div></div>

<div id="home">
<div class="taglb">🔥 سیستم عامل صنعت پیرولیز</div>
<h1>PyroFlow</h1>
<p>گزارش پخت با شروع و پایان در جدول، بایگانی قفل‌شده، فرمان صوتی، Audit Trail و پایش تیم پشتیبانی</p>
<button class="btn bp" onclick="openAuth(0)">ورود به سامانه ←</button>
<br><br>
<button class="btn bg" onclick="openAuth(1)">ثبت‌نام کارخانه</button>
</div>

<div class="mod hid" id="authM">
<div class="mbox">
<button class="mx" onclick="closeAuth()">✕</button>
<div style="text-align:center;color:#ff7a30;font-weight:800;font-size:17px">🔥 PyroFlow</div>
<div class="mtabs">
<button class="mtab on" id="at0" onclick="aTab(0)">ورود</button>
<button class="mtab" id="at1" onclick="aTab(1)">ثبت‌نام</button>
</div>
<div id="lForm">
<label>ایمیل</label><input id="li_e" type="email">
<label>رمز</label><input id="li_p" type="password">
<button class="btn bp full" style="margin-top:13px" onclick="doLogin()">ورود به سامانه</button>
<button class="btn bg full sm" style="margin-top:8px" onclick="forgotPw()">🔑 فراموشی رمز</button>
</div>
<div id="rForm" class="hid">
<label class="ckx"><input type="checkbox" id="rIsMgr" onchange="mgrTgl()"><span><b>👑 من مدیر این کارخانه هستم</b></span></label>
<div id="rMgrRow" class="hid"><label>ایمیل دقیق مدیر کارخانه</label><input id="rMgr" type="email"></div>
<label>نام و نام‌خانوادگی *</label><input id="r_n">
<label>نام کارخانه</label><input id="r_c">
<label>ایمیل *</label><input id="r_e" type="email">
<label>رمز (حداقل ۶) *</label><input id="r_p" type="password">
<button class="btn bp full" style="margin-top:12px" onclick="doReg()">ثبت‌نام و ورود</button>
</div>
</div>
</div>

<div class="mod hid" id="editM">
<div class="mbox">
<button class="mx" onclick="closeEdit()">✕</button>
<div id="editF"></div>
</div>
</div>

<div id="shell" class="hid">
<div class="hd">
<button class="btn bg sm" onclick="sTgl()">☰</button>
<span class="br">🔥 PyroFlow</span>
<span style="flex:1"></span>
<span class="bp2 wr" id="hFac">—</span>
<button class="btn bg sm" onclick="doLogout()">خروج</button>
</div>
<div id="side"></div>
<div id="main"></div>
</div>

<script>
"use strict";
/* ══════ بلوک A — هستهٔ حیاتی (ورود/ثبت‌نام همیشه کار می‌کند) ══════ */
window.onerror=function(m,s,l){var b=document.getElementById('ebar');if(b){b.style.display='block';b.textContent='⚠️ '+m+' (خط '+l+')'}};
function q(i){return document.getElementById(i)}
function E(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function F(n){return Number(n||0).toLocaleString('fa-IR')}
function p2(n){return (n<10?'0':'')+n}
function toast(m,bad){var t=q('tst');if(!t)return;t.textContent=m;t.style.borderColor=bad?'#ef4b4b':'#2bd9a8';t.classList.add('on');if(t._x)clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('on')},3200)}
function fa2en(s){var a='۰۱۲۳۴۵۶۷۸۹';return String(s||'').replace(/[۰-۹]/g,function(c){return String(a.indexOf(c))})}
function LSg(k,d){try{var v=localStorage.getItem(k);if(v==null)return d;return JSON.parse(v)}catch(e){return d}}
function LSs(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function R(k,d){return LSg(k,d)}
function W(k,v){LSs(k,v)}
function hj(){var d=new Date();return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())}
function hhm(){var d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())}
function US(){return R('pf_users',[])}
function SETU(l){W('pf_users',l)}
function U(){var s=R('pf_sess',null);if(!s)return null;var l=US();for(var i=0;i<l.length;i++){if(l[i].email===s&&l[i].st==='ok')return l[i]}return null}
function ADM(){var u=U();return !!u&&!!u.admin}
function hs(t){try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode('pp'+t)).then(function(b){var a=new Uint8Array(b),o='';for(var i=0;i<a.length;i++)o+=a[i].toString(16).padStart(2,'0');return o})}catch(e){return Promise.resolve('f'+t.length)}}
function openAuth(m){
 q('authM').classList.remove('hid');
 q('at0').classList.toggle('on',m===0);
 q('at1').classList.toggle('on',m===1);
 q('lForm').classList.toggle('hid',m!==0);
 q('rForm').classList.toggle('hid',m!==1);
}
function closeAuth(){q('authM').classList.add('hid')}
function aTab(m){openAuth(m)}
function mgrTgl(){q('rMgrRow').classList.toggle('hid',q('rIsMgr').checked)}
function seedOrg(){
 if(R('pf_seeded',0))return;
 W('pf_seeded',1);
 W('pf_crow',[]);W('pf_crowArch',[]);W('pf_audit',[]);W('pf_proc',null);
 W('pf_ck',{});W('pf_csum',[]);W('pf_env',[]);W('pf_batch',[]);W('pf_inv',[]);
 W('pf_out',[]);W('pf_fin',[]);W('pf_sell',[]);W('pf_maint',[]);W('pf_hrm',[]);
 W('pf_req',[]);W('pf_payreq',[]);W('pf_pwr',[]);W('pf_supvisits',[]);
 W('pf_agentlog',[{t:Date.now(),txt:'📥 سیستم فعال شد'}]);
}
async function doReg(){
 var n=q('r_n').value.trim();
 var e=q('r_e').value.trim().toLowerCase();
 var p=q('r_p').value;
 var c=q('r_c').value.trim();
 var isM=q('rIsMgr').checked;
 if(!n||!e||!p){toast('نام، ایمیل و رمز الزامی است',1);return}
 if(p.length<6){toast('رمز حداقل ۶ کاراکتر',1);return}
 var l=US();
 for(var i=0;i<l.length;i++){if(l[i].email===e){toast('این ایمیل قبلاً ثبت شده',1);return}}
 var h=await hs(p);
 var u={email:e,pass:h,name:n,cname:c,st:'pend',perms:['dash','cook','req','ai'],org:'',admin:0};
 if(isM){
  var first=true;
  for(var j=0;j<l.length;j++){if(l[j].admin){first=false;break}}
  u.admin=1;u.super=first?1:0;u.org=e;u.st='ok';u.plan=first?2:1;
  l.push(u);SETU(l);W('pf_sess',e);closeAuth();seedOrg();
  if(window.route!==undefined){window.route='dash';render()}
  toast('خوش آمدید مدیر 👑'+(first?' مدیرکل 🌟':''),0);
 }else{
  var mg=q('rMgr').value.trim().toLowerCase();
  if(!mg){toast('ایمیل مدیر الزامی است',1);return}
  var mgr=null;
  for(var k=0;k<l.length;k++){if(l[k].email===mg&&l[k].admin)mgr=l[k]}
  if(!mgr){toast('مدیری با این ایمیل یافت نشد',1);return}
  u.org=mg;
  l.push(u);SETU(l);
  toast('ثبت شد — مدیر باید تایید کند ⏳',0);closeAuth();
 }
}
async function dologinCore(e,p){
 var l=US(),u=null;
 for(var i=0;i<l.length;i++){if(l[i].email===e)u=l[i]}
 if(!u){toast('ایمیل یافت نشد — ثبت‌نام کنید',1);return}
 var h=await hs(p);
 if(u.pass!==h){toast('رمز اشتباه است',1);return}
 if(u.st==='pend'){toast('حساب منتظر تایید مدیر است',1);return}
 W('pf_sess',e);seedOrg();closeAuth();
 if(window.APP_READY){window.route=(u.sup&&!u.admin)?'sup':'dash';render()}
 else{toast('ورود موفق — صفحه بارگذاری کامل نشد؛ رفرش کن','');setTimeout(function(){location.reload()},1200)}
}
function doLogin(){var e=q('li_e').value.trim().toLowerCase(),p=q('li_p').value;if(!e||!p){toast('ایمیل و رمز را وارد کن',1);return}dologinCore(e,p)}
function doLogout(){W('pf_sess',null);if(window.APP_READY){route='home';render()}else{location.reload()}}
function forgotPw(){
 var e=prompt('ایمیل حساب:');if(!e)return;e=e.trim().toLowerCase();
 var l=US(),u=null;
 for(var i=0;i<l.length;i++){if(l[i].email===e)u=l[i]}
 if(!u){toast('ایمیل یافت نشد',1);return}
 var np=prompt('رمز جدید (حداقل ۶):');if(!np||np.length<6){toast('رمز نامعتبر',1);return}
 hs(np).then(function(nh){
  if(u.admin){for(var j=0;j<l.length;j++){if(l[j].email===e)l[j].pass=nh}SETU(l);toast('✅ رمز عوض شد',0)}
  else{var r=R('pf_pwr',[]);r.unshift({t:Date.now(),em:e,name:u.name,nh:nh,org:u.org});W('pf_pwr',r);toast('درخواست ثبت شد — مدیر تایید کند',0)}
 });
}
function logA(sec,rid,f,b4,af){
 var u=U();if(!u)return;
 var l=R('audit',[]);
 l.unshift({sec:sec,rid:String(rid),f:f,b4:String(b4),af:String(af),by:u.name,ro:(u.admin?'مدیر':'اپراتور'),at:hj(),tm:hhm()});
 W('audit',l.slice(0,500));
}
function canEdit(s){var u=U();if(!u)return false;if(u.admin||u.super)return true;return (u.perms||[]).indexOf('edit_'+s)>=0}
</script>

<script>
"use strict";
/* ══════ بلوک B — صفحات اپلیکیشن ══════ */
var TABS={fin:'sell'};
var route='home';
var APP_READY=true;
/* فرم‌های عمومی: هر بخش = فهرست فیلدها */
var FORMS={
 batch:[['id','کد بچ'],['feed','خوراک'],['raw','تن'],['op','اپراتور']],
 inv:[['item','کالا'],['qty','مقدار'],['unit','واحد']],
 out:[['prod','محصول'],['qty','مقدار'],['unit','واحد'],['batch','بچ']],
 fin:[['ft','in/out'],['title','عنوان'],['amt','مبلغ']],
 sell:[['item','محصول'],['qty','مقدار'],['price','قیمت'],['cust','خریدار']],
 maint:[['eq','تجهیز'],['note','شرح'],['part','قطعه'],['cost','هزینه'],['tech','تعمیرکار'],['next','بازبینی']],
 hrm:[['n','نام'],['r','سمت'],['sh','شیفت']]
};
var SECAF={crow:'رکورد پخت',batch:'بچ',inv:'انبار',fin:'مالی',sell:'فاکتور',maint:'تعمیر',hrm:'پرسنل'};
var MODS=[['dash','📊'],['cook','📋'],['arch','📖'],['prod','📦'],['maint','🔧'],['inv','🏭'],['fin','💰'],['req','📥'],['ai','🤖'],['people','👥'],['pay','💳'],['settings','⚙️']];
var MODSN={dash:'داشبورد',cook:'گزارش پخت',arch:'بایگانی',prod:'بچ',maint:'تعمیرات',inv:'انبار',fin:'مالی',req:'درخواست',ai:'دستیار',people:'پرسنل',pay:'عضویت',settings:'مدیریت'};
var EMODS=[['crow','رکورد پخت'],['batch','بچ'],['inv','انبار'],['fin','مالی'],['sell','فاکتور']];
function genForm(sec){
 var fs=FORMS[sec],h='<div class="fg">';
 for(var i=0;i<fs.length;i++){h+='<div><label>'+fs[i][1]+'</label><input id="gf'+i+'"></div>'}
 h+='</div><button class="btn bp sm" onclick="saveForm(\''+sec+'\')">➕ ثبت</button>';
 return h;
}
function saveForm(sec){

    for(var j=0;j<asg.length;j++){
     var o=US().filter(function(x){return x.email===asg[j]})[0];
     h+='<span class="ptg on">'+E(o?(o.cname||o.name):asg[j])+' <b onclick="supAssign(\''+s.email+'\',\''+asg[j]+'\')">✕</b></span>';
    }
    h+='</div>';
   }
   var free=mgrs.filter(function(o){return asg.indexOf(o.email)<0});
   if(free.length&&asg.length<10){
    h+='<div style="margin-top:5px"><select id="ss'+i+'" style="font-size:11px">';
    for(var k=0;k<free.length;k++)h+='<option value="'+free[k].email+'">'+E(free[k].cname||free[k].name)+'</option>';
    h+='</select> <button class="pl p1" onclick="supAssign(\''+s.email+'\',q(\'ss'+i+'\').value)">+ واگذار</button></div>';
   }
   h+='</div>';
  }
  var non=US().filter(function(x){return !x.sup&&x.email!==u.email&&x.st==='ok'});
  if(non.length){
   h+='<div style="margin-top:9px"><span class="s">ساخت پشتیبان:</span><br><select id="mks" style="font-size:11px;margin:5px 0">';
   for(var m=0;m<non.length;m++)h+='<option value="'+non[m].email+'">'+E(non[m].name)+' — '+E(non[m].cname||'')+'</option>';
   h+='</select> <button class="pl p4" onclick="mkSup(q(\'mks\').value)">🎧 پشتیبان کن</button></div>';
  }
  h+='</div>';
 }
 if(u.admin){
  var myS=US().filter(function(x){return x.sup&&x.assign&&x.assign.indexOf(u.email)>=0});
  h+='<div class="dv"><h3>🎧 پشتیبان‌های متصل به تو</h3>';
  if(!myS.length)h+='<div class="em">—</div>';
  for(var i2=0;i2<myS.length;i2++)h+='<div class="pmrow">🎧 <b>'+E(myS[i2].name)+'</b> — می‌تواند صفحات را ببیند و تماس آموزشی ثبت کند</div>';
  h+='</div>';
  var pwr=R('pf_pwr',[]).filter(function(x){return !x.st&&x.org===u.email});
  if(pwr.length){
   h+='<div class="dv"><h3>🔑 درخواست‌های بازیابی رمز</h3>';
   for(var p3=0;p3<pwr.length;p3++)h+='<div class="pmrow">'+E(pwr[p3].name)+' <button class="pl p1" onclick="okPw('+pwr[p3].t+')">✅ تایید</button> <button class="pl p5" onclick="noPw('+pwr[p3].t+')">✕</button></div>';
   h+='</div>';
  }
 }
 q('main').innerHTML=h;
}
function okPw(t){var u=U();if(!u||!u.admin)return;var pw=R('pf_pwr',[]),l=US();for(var i=0;i<pw.length;i++){if(String(pw[i].t)===String(t)&&pw[i].org===u.email){for(var j=0;j<l.length;j++){if(l[j].email===pw[i].em&&l[j].org===u.email)l[j].pass=pw[i].nh}pw[i].st='ok'}}W('pf_pwr',pw);SETU(l);toast('✅ رمز عوض شد',0);render()}
function noPw(t){var u=U();if(!u||!u.admin)return;var pw=R('pf_pwr',[]).filter(function(x){return String(x.t)!==String(t)});W('pf_pwr',pw);render()}
function mkSup(e){var u=U();if(!u||!u.super)return;var l=US();for(var i=0;i<l.length;i++){if(l[i].email===e){if(l[i].sup){l[i].sup=0;l[i].assign=[]}else{l[i].sup=1;l[i].assign=[]}}}SETU(l);toast('✅','');render()}
function supAssign(se,oe){var u=U();if(!u||!u.super)return;var l=US();for(var i=0;i<l.length;i++){if(l[i].email===se&&l[i].sup){l[i].assign=l[i].assign||[];var ix=l[i].assign.indexOf(oe);if(ix>=0)l[i].assign.splice(ix,1);else if(l[i].assign.length<10)l[i].assign.push(oe);else{toast('حداکثر ۱۰ کارخانه',1);return}}}SETU(l);render()}
/* ══════ پشتیبانی ══════ */
var SUPOrg=null;
function vSup(){
 var u=U();
 var orgs=u.super?US().filter(function(x){return x.admin&&x.st==='ok'&&x.email!==u.email}):US().filter(function(x){return x.admin&&u.assign&&u.assign.indexOf(x.email)>=0});
 if(!orgs.length){q('main').innerHTML='<div class="ph"><h2>🎧 پایش</h2></div><div class="lkb">مدیرکل هنوز کارخانه‌ای به تو اختصاص نداده</div>';return}
 var h='<div class="ph"><h2>🎧 پایش کارخانه‌ها</h2><span class="s">'+orgs.length+' کارخانه</span></div>';
 for(var i=0;i<orgs.length;i++){
  var o=orgs[i];
  h+='<div class="spc" onclick="SUPOrg=\''+o.email+'\';go2(\'supf\')">';
  h+='<div class="t">'+E(o.cname||o.name)+'</div>';
  h+='<div class="r"><span>👤 مدیر</span><b>'+E(o.name)+'</b></div>';
  h+='<div class="r"><span>💳 عضویت</span><b>'+planN(o.plan)+'</b></div>';
  h+='<div class="r"><span>🎧 پایش</span><b>'+(o.mon?'فعال':'—')+'</b></div>';
  h+='</div>';
 }
 q('main').innerHTML=h;
}
function vSupF(){
 var u=U(),org=SUPOrg;
 if(!org){go2('sup');return}
 var canSee=u.super||(u.assign||[]).indexOf(org)>=0;
 if(!canSee){go2('sup');return}
 var ox=US().filter(function(x){return x.email===org})[0]||{cname:'—',name:'—'};
 var ar=R('pf_crowArch_'+org,[]);
 var cr=R('pf_crow_'+org,[]);
 var pr=R('pf_proc_'+org,null);
 var h='<div class="ph"><h2>🎧 '+E(ox.cname||ox.name)+'</h2><button class="btn bg sm" onclick="go2(\'sup\')">← فهرست</button></div>';
 h+='<div class="dv"><h3>⏱ وضعیت فعلی</h3>';
 if(pr&&pr.st==='run')h+='<div class="gbx">🟢 فعال — شروع '+E(pr.stT||'—')+' · اپراتور '+E(pr.by||'—')+' · مدت '+Math.round((Date.now()-pr.s)/60000)+' دقیقه</div>';
 else if(pr&&pr.st==='done')h+='<div class="gbx">🏁 آخرین پخت '+(pr.dur||'—')+' دقیقه</div>';
 else h+='<div class="lkb">⏸ فرایند فعالی نیست</div>';
 h+='</div>';
 if(cr.length){
  h+='<div class="dv"><h3>📊 رکوردهای فعلی ('+cr.length+')</h3>'+crowTable(cr,false)+'</div>';
 }
 h+='<div class="dv" style="border-color:rgba(180,138,255,.4)"><h3>📖 بایگانی پخت‌های گذشته ('+ar.length+') — گزارش‌ساز</h3>';
 if(!ar.length)h+='<div class="em">—</div>';
 for(var i2=0;i2<ar.length;i2++){
  var a=ar[i2];
  var vc=0;
  for(var j2=0;j2<a.rows.length;j2++)if(a.rows[j2].kind==='voice')vc++;
  h+='<div class="arcw"><div style="font-weight:800;color:#ffb066">'+E(a.st||'—')+' → '+E(a.en||'—')+' <span class="bp2 ok2">'+a.dur+' دقیقه</span> <span class="bp2 wr">'+a.rows.length+' ردیف</span></div>';
  h+='<div class="s" style="margin:4px 0">👤 '+E(a.by||'—')+' · '+E(a.when||'—')+' · 🎙 '+vc+' صوتی</div>';
  h+='<details><summary style="cursor:pointer;color:#ffb066;font-size:11px">▶ جزئیات</summary><div style="margin-top:7px">'+crowTable(a.rows,true)+'</div></details></div>';
 }
 h+='</div>';
 var vis=R('pf_supvisits',[]).filter(function(x){return x.o===org});
 h+='<div class="dv"><h3>📞 تماس‌ها و یادداشت‌ها</h3>';
 if(!vis.length)h+='<div class="em">—</div>';
 for(var i3=0;i3<Math.min(8,vis.length);i3++)h+='<div style="font-size:10.5px;padding:4px 0;border-bottom:1px dashed #29323d">'+(vis[i3].kind==='تماس آموزشی'?'📞':'📝')+' <b>'+E(vis[i3].by)+'</b> — '+E(vis[i3].txt)+' <span class="s">'+ago(vis[i3].t)+'</span></div>';
 h+='<button class="btn bp sm" style="margin-top:8px" onclick="supVisit2(\''+org+'\',\'تماس آموزشی\')">📞 تماس جدید</button> <button class="btn bg sm" onclick="supVisit2(\''+org+'\',\'یادداشت\')">📝 یادداشت</button></div>';
 q('main').innerHTML=h;
}
function supVisit2(org,k){
 var my=US().filter(function(x){return x.email===org})[0];
 if(!my){return}
 var t=prompt(k==='تماس آموزشی'?'📞 خلاصه تماس:':'📝 یادداشت:');
 if(!t)return;
 var u=U();
 var l=R('pf_supvisits',[]);
 l.unshift({t:Date.now(),by:u.name,kind:k,txt:String(t).slice(0,300),o:org});
 W('pf_supvisits',l.slice(0,100));
 toast('✅ ثبت شد — مدیر می‌بیند',0);
 view();
}
/* ═════‌مسیریابی ═════ */
var NAVG=[
 ['اصلی',[['dash','📊','داشبورد'],['cook','📋','گزارش پخت'],['arch','📖','بایگانی']]],
 ['عملیات',[['prod','📦','بچ'],['maint','🔧','تعمیرات'],['inv','🏭','انبار'],['fin','💰','مالی']]],
 [('هوشمند'),[['req','📥','درخواست'],['ai','🤖','دستیار'],['people','👥','پرسنل']]],
 ['سیستم',[['pay','💳','عضویت'],['settings','⚙️','مدیریت']]]
];
var VIEWS={dash:vDash,cook:vCook,arch:vArch,prod:vProd,maint:vMaint,inv:vInv,req:vReq,ai:vAI,people:vPeople,fin:vFin,pay:vPay,settings:vSettings,sup:vSup,supf:vSupF};
function go2(p){if(!VIEWS[p])return;route=p;render()}
function sTgl(){q('side').classList.toggle('hid');if(window.innerWidth<760)q('side').classList.toggle('op')}
function render(){
 var u=U();
 var sh=q('shell'),hm=q('home');
 if(!u){sh.classList.add('hid');hm.classList.remove('hid');return}
 sh.classList.remove('hid');hm.classList.add('hid');
 if(route==='home')route=(u.sup&&!u.admin)?'sup':'dash';
 q('hFac').textContent=(u.cname||u.name);
 var s='';
 if(u.sup&&!u.admin){
  s+='<div class="g">پشتیبانی</div>';
  s+='<button class="nv'+(route==='sup'||route==='supf'?' on':'')+'" onclick="go2(\'sup\')">🎧 پایش کارخانه‌ها</button>';
  s+='<div class="g">حساب</div>';
  s+='<button class="nv'+(route==='settings'?' on':'')+'" onclick="go2(\'settings\')">⚙️ حساب من</button>';
 }else{
  for(var g=0;g<NAVG.length;g++){
   var items=NAVG[g][1];
   var ok=[];
   for(var i=0;i<items.length;i++){
    var m=items[i][0];
    if(u.admin||u.super||(u.perms||[]).indexOf(m)>=0||m==='dash'||m==='cook'||m==='arch'||m==='ai'||m==='pay')ok.push(items[i]);
   }
   if(!ok.length)continue;
   s+='<div class="g">'+NAVG[g][0]+'</div>';
   for(var j=0;j<ok.length;j++)s+='<button class="nv'+(route===ok[j][0]?' on':'')+'" onclick="go2(\''+ok[j][0]+'\')">'+ok[j][1]+' '+ok[j][2]+'</button>';
  }
  if(u.sup||u.super){
   s+='<div class="g">پشتیبانی</div>';
   s+='<button class="nv'+(route==='sup'||route==='supf'?' on':'')+'" onclick="go2(\'sup\')">🎧 پایش کارخانه‌ها</button>';
  }
 }
 s+='<button class="nv" onclick="doLogout()" style="margin-top:8px;border-top:1px solid #29323d">🚪 خروج</button>';
 q('side').innerHTML=s;
 var V=VIEWS[route];
 if(V)V();
}
function view(){render()}
render();
</script>
