<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پترو پارسیان — اکسیر جوانی</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,-apple-system,sans-serif;background:#0a1424;color:#e8eefc}
.hidden{display:none!important}
#shell{display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0d1a33;border-bottom:1px solid #24406e;padding:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{color:#d4a437;font-size:16px}
.brand small{display:block;color:#8fa8cc;font-size:11px}
.uinfo{display:flex;align-items:center;gap:10px;font-size:13.5px}
#row{display:flex;flex:1;align-items:stretch}
#nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#0c1830;border-bottom:1px solid #1c3560}
.chip{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid #2c4c80;background:#0f1e3d;color:#a9c2e8;cursor:pointer;font-size:13.5px;font-family:inherit}
.chip.on{background:#d4a437;border-color:#d4a437;color:#1a1206;font-weight:700}
main{flex:1;padding:16px;width:100%;max-width:1150px;margin:0 auto}
.sect{color:#d4a437;font-size:19px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{border-radius:14px;padding:14px;font-weight:800;font-size:19px}
.kpi small{display:block;font-size:11.5px;font-weight:400;opacity:.9;margin-bottom:4px}
.kpi.g{background:#159a52}.kpi.b{background:#1565c0}.kpi.p{background:#7c3aed}.kpi.o{background:#d97706}.kpi.r{background:#dc2626}
.panel{background:#0f1e3d;border:1px solid #24406e;border-radius:16px;padding:16px;margin-bottom:16px;overflow-x:auto}
.panel h3{color:#d4a437;font-size:15px;margin-bottom:10px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:12px}
.fld label{display:block;font-size:12px;color:#8fa8cc;margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px;border-radius:10px;border:1px solid #2c4c80;background:#f7f7d8;color:#111;font-size:14px;font-family:inherit}
.btn{padding:12px 18px;border:none;border-radius:10px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-go{background:linear-gradient(90deg,#159a52,#22c55e);color:#fff}
.btn-out{background:#24406e;color:#cfe0ff}
.btnw{display:flex;gap:8px;flex-wrap:wrap}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid #1c3560;font-size:13.5px;align-items:center}
.row small{color:#8fa8cc}
.pill{border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:none;display:inline-block}
.pill.ok{background:#22c55e;color:#fff}.pill.no{background:#3a1414;color:#ffc4c4;border:1px solid #7c2d2d}.pill.gy{background:#24406e;color:#cfe0ff}
.del{background:none;border:none;color:#ff9b9b;cursor:pointer;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 5px;border-bottom:1px solid #1c3560;text-align:right;color:#cfe0ff;white-space:nowrap}
th{color:#8fa8cc;font-weight:400;font-size:11.5px}
.zp{color:#fff;font-size:11px;border-radius:99px;padding:3px 9px;white-space:nowrap}
.flow{display:flex;gap:4px;overflow-x:auto;padding:4px 0}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#8fa8cc;min-width:58px;text-align:center}
.st b{font-size:22px}
.lock{background:#3a1414;color:#ffc4c4;border:1px solid #7c2d2d;border-radius:12px;padding:11px;text-align:center;margin-top:10px;font-size:13px}
.unl{background:#12331f;color:#b9ffd7;border:1px solid #1f5c39;border-radius:12px;padding:11px;text-align:center;margin-top:10px;font-size:13px}
.empty{color:#8fa8cc;font-size:13px;text-align:center;padding:8px}
.ai-out{background:#0c1830;border:1px dashed #2c4c80;border-radius:12px;padding:12px;font-size:13.5px;line-height:2;white-space:pre-wrap;margin-top:10px}
.badge{display:inline-block;background:#d4a437;color:#1a1206;font-weight:700;font-size:12px;border-radius:99px;padding:4px 12px}
.badge.v{background:#2c4c80;color:#cfe0ff}
#tw{position:fixed;bottom:14px;left:14px;right:14px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:99}
.toast{background:#12331f;color:#b9ffd7;border:1px solid #1f5c39;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;max-width:420px}
.toast.show{opacity:1;transform:none}
.toast.error{background:#3a1424;color:#ffc4c4;border-color:#7c2d2d}
/* login */
#gate .card{background:#0f1e3d;border:1px solid #24406e;border-radius:18px;padding:28px 22px;max-width:420px;margin:40px auto;width:calc(100% - 32px)}
#gate .fld{margin-bottom:12px}
.tabs{display:flex;gap:10px;margin:18px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #2c4c80;background:#0c1a33;color:#a9c2e8;font-size:15px;font-family:inherit;cursor:pointer}
.tab.active{background:#d4a437;border-color:#d4a437;color:#1a1206;font-weight:700}
.logo{font-size:60px;text-align:center}
h1{color:#d4a437;font-size:23px;text-align:center;margin:8px 0 4px}
.sub{color:#8fa8cc;font-size:13px;text-align:center}
.note{color:#8fa8cc;font-size:12.5px;text-align:center;margin-top:16px;line-height:2}
.note b{color:#d4a437}
#gate input{background:#f7f7d8}
@media(min-width:900px){
 #nav{flex-direction:column;width:230px;flex-shrink:0;border-bottom:none;border-inline-end:1px solid #1c3560;overflow-y:auto}
 .chip{border-radius:10px;text-align:right}
 main{max-width:none}
}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">🔥</div>
    <h1>پترو پارسیان — اکسیر جوانی</h1>
    <div class="sub">PYROHUB · سامانه جامع مدیریت کارخانه‌های پیرولیز</div>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="showTab('login')">ورود</button>
      <button class="tab" id="tab-reg" onclick="showTab('reg')">ثبت‌نام</button>
    </div>
    <div id="f-login">
      <div class="fld"><label style="color:#8fa8cc;font-size:12px;display:block;margin-bottom:5px">ایمیل</label><input id="l-e" type="email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;font-family:inherit" autocomplete="email"></div>
      <div class="fld"><label style="color:#8fa8cc;font-size:12px;display:block;margin-bottom:5px">رمز عبور</label><input id="l-p" type="password" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;font-family:inherit" autocomplete="current-password"></div>
      <button class="btn btn-go" style="width:100%" onclick="doLogin()">ورود به سامانه</button>
    </div>
    <div id="f-reg" class="hidden">
      <div class="fld"><label style="color:#8fa8cc;font-size:12px;display:block;margin-bottom:5px">نام و نام خانوادگی</label><input id="r-n" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;font-family:inherit"></div>
      <div class="fld"><label style="color:#8fa8cc;font-size:12px;display:block;margin-bottom:5px">ایمیل</label><input id="r-e" type="email" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;font-family:inherit" autocomplete="email"></div>
      <div class="fld"><label style="color:#8fa8cc;font-size:12px;display:block;margin-bottom:5px">رمز عبور (حداقل ۶)</label><input id="r-p" type="password" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;font-family:inherit"></div>
      <button class="btn btn-go" style="width:100%" onclick="doReg()">ثبت‌نام</button>
    </div>
    <div class="note">اولین ثبت‌نام = <b>مدیر کل 👑</b><br>ثبت‌نام‌های بعدی پس از تأیید مدیر فعال می‌شوند.</div>
  </div>
</div>

<div id="shell" class="hidden">
  <header>
    <div class="brand"><span style="font-size:30px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · 09154040240</small></div></div>
    <div class="uinfo"><span id="uname"></span><span id="ubadge"></span><button class="btn btn-out" style="padding:8px 16px" onclick="logout()">خروج</button></div>
  </header>
  <div id="row">
    <nav id="nav"></nav>
    <main id="view"></main>
  </div>
</div>

<div id="tw"></div>

<script>
/* ===== پایه ===== */
const UKEY='pyro_users_v2',SKEY='pyro_session_v2';
const K={chk:'pyro_chk_v3',temp:'pyro_temp_v3',prod:'pyro_prod_v3',inv:'pyro_inv_v3',fin:'pyro_fin_v3',hrm:'pyro_hrm_v3',task:'pyro_task_v3',files:'pyro_files_v3'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('fa-IR');
const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return!0}catch(e){toast('فضای ذخیره‌سازی مرورگر پر است!',1);return!1}};
const users=()=>get(UKEY,[]),saveUsers=u=>set(UKEY,u);
const me=()=>{const e=localStorage.getItem(SKEY);if(!e)return null;const u=users().find(x=>x.email===e);return(u&&u.status==='active')?u:null};
const can=()=>{const u=me();return!!u&&u.role==='admin'};
async function hash(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pyro·'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'pyro·'+t)h=(h*31+c.charCodeAt(0))>>>0;return'f'+h}}
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' error':'');t.textContent=m;$('tw').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3200)}
function showTab(w){$('tab-login').classList.toggle('active',w==='login');$('tab-reg').classList.toggle('active',w==='reg');$('f-login').classList.toggle('hidden',w!=='login');$('f-reg').classList.toggle('hidden',w!=='reg')}

/* ===== ورود/ثبت‌نام (همان حساب قبلی کار می‌کند) ===== */
async function doReg(){const n=$('r-n').value.trim(),e=$('r-e').value.trim().toLowerCase(),p=$('r-p').value;if(!n||!e||!p)return toast('همه فیلدها لازم است',1);if(p.length<6)return toast('رمز حداقل ۶ کاراکتر',1);const l=users();if(l.some(u=>u.email===e))return toast('این ایمیل قبلاً ثبت شده',1);if(l.length===0){l.push({name:n,email:e,pass:await hash(p),role:'admin',status:'active'});saveUsers(l);localStorage.setItem(SKEY,e);toast('خوش آمدی مدیر کل 👑');render()}else{l.push({name:n,email:e,pass:await hash(p),role:'viewer',status:'pending'});saveUsers(l);toast('درخواستت ثبت شد؛ منتظر تأیید مدیر 🌱');showTab('login')}}
async function doLogin(){const e=$('l-e').value.trim().toLowerCase(),p=$('l-p').value;const u=users().find(x=>x.email===e);if(!u||u.pass!=="await hash(p)".replace && u.pass!==await hash(p))return toast('ایمیل یا رمز اشتباه است',1);if(u.status==='pending')return toast('حسابت در انتظار تأیید مدیر است ⏳',1);localStorage.setItem(SKEY,e);toast('خوش آمدی '+u.name+' 👋');render()}
function logout(){localStorage.removeItem(SKEY);render();toast('خارج شدی')}
function decide(em,ok){if(!can())return;let l=users();const u=l.find(x=>x.email===em);if(!u)return;if(ok){u.status='active';u.role='viewer';toast(u.name+' تأیید شد ✅')}else{l=l.filter(x=>x.email!==em);toast('رد شد')}saveUsers(l);show(cur)}
function setRole(em,r){if(!can())return;const l=users();const u=l.find(x=>x.email===em);if(!u)return;const o=l.some(x=>x.role==='admin'&&x.email!==em&&x.status==='active');if(u.role==='admin'&&!o&&r!=='admin')return toast('حداقل یک مدیر باید بماند',1);u.role=r;saveUsers(l);toast('نقش تغییر کرد');show(cur)}

/* ===== ثابت‌ها ===== */
const FA=['اکسیر جوانی','پالایش پارس','بسته‌بندی درخشان','ترابری سریع'];
const FLOW=[['🛒','خرید'],['🚚','حمل‌ونقل'],['🧰','آماده‌سازی مواد'],['⚗️','ذخیره راکتور'],['📝','چک‌لیست'],['▶️','Start راکتور'],['🌡️','ثبت دما'],['🔥','Cracking'],['💧','روغن‌گیری'],['❄️','Cooling'],['🧪','نمونه‌گیری'],['📋','ثبت خروجی'],['📦','فروش'],['🏭','انبار']];
const DEF_CHK=[['بجرانی','انجام پروتکل‌های دستورالعمل عملیاتی'],['بجرانی','نشت و آب‌بندی درب راکتور'],['بجرانی','وضعیت شعله و مشعل‌ها'],['غیربجرانی','سنجش کاتالیست راکتور'],['بجرانی','سیستم برق و تابلوبرق'],['غیربجرانی','مسیر خروجی گاز و ضدانفجار'],['غیربجرانی','تجهیزات اطمینان و خاموش‌کننده‌ها'],['بجرانی','صحت مسیرها و ظرفیت‌ها']];
function chkList(){let c=get(K.chk,null);if(!c||!c.length){c=DEF_CHK.map((x,i)=>({id:i,g:x[0],t:x[1],done:false}));set(K.chk,c)}return c}
function zst(x){x=+x;const b=x<=220?['#159a52','پایین 🟢']:x<=270?['#b8860b','بازه مجرانی 🟡']:x<=320?['#dc2626','Cracking 🔴']:['#1565c0','خیلی بالا ⚠️'];return'<span class="zp" style="background:'+b[0]+'">'+b[1]+'</span>'}
function kpi(c,t,v){return'<div class="kpi '+c+'"><small>'+t+'</small>'+fmt(v)+'</div>'}
function today(){return new Date().toDateString()}
function finBal(){const f=get(K.fin,[]);return f.filter(r=>r.type==='in').reduce((s,r)=>s+ +r.amt,0)-f.filter(r=>r.type==='out').reduce((s,r)=>s+ +r.amt,0)}
function delRow(k,t){if(!can())return toast('دسترسی ثبت با مدیر کل است',1);set(k,get(k,[]).filter(r=>r.t!==t));toast('حذف شد');show(cur)}

/* ===== ناوبری ===== */
const NS=[['dash','🏠','داشبورد'],['prod','⚗️','تولید راکتور'],['inv','📦','انبار موجودی'],['fin','💰','مالی و فروش'],['hrm','👷','پرسنل'],['task','🎓','آموزش و تکالیف'],['files','📎','مرکز فایل‌ها'],['users','👑','کاربران و دسترسی'],['ai','🤖','هوش مصنوعی']];
let cur='dash';
$('nav').innerHTML=NS.map(n=>'<button class="chip" data-s="'+n[0]+'" onclick="show(\''+n[0]+'\')">'+n[1]+' '+n[2]+'</button>').join('');
function show(s){cur=s;document.querySelectorAll('#nav .chip').forEach(c=>c.classList.toggle('on',c.dataset.s===s));VIEWS[s]();window.scrollTo(0,0)}

/* ===== نمای داشبورد ===== */
function vDash(){
 const hrm=get(K.hrm,[]),prod=get(K.prod,[]),files=get(K.files,[]),tasks=get(K.task,[]);
 const tp=prod.filter(r=>new Date(r.t).toDateString()===today()).reduce((s,r)=>s+ (+r.amt),0);
 const tin=get(K.fin,[]).filter(r=>r.type==='in').reduce((s,r)=>s+ +r.amt,0);
 let h='<h2 class="sect">🏠 نمای کلی سازمان</h2><div class="kpis">'+
 kpi('g','🏭 کارخانه‌ها',4)+kpi('b','👷 پرسنل فعال',hrm.length)+kpi('p','⚗️ تولید امروز (تن)',tp)+kpi('o','💵 مجموع فروش (تومان)',tin)+kpi('r','📊 سود خالص (تومان)',finBal())+'</div>';
 h+='<div class="panel"><h3>⚡ چرخه کامل تولید</h3><div class="flow">'+FLOW.map(x=>'<div class="st"><b>'+x[0]+'</b>'+x[1]+'</div>').join('')+'</div></div>';
 h+='<div class="panel"><h3>🔔 هشدارهای دستیار هوشمند</h3>'+alerts()+'</div>';
 h+='<div class="panel"><h3>📌 خلاصه</h3><div class="row"><span>📁 فایل‌های بارگذاری‌شده</span><b>'+fmt(files.length)+'</b></div><div class="row"><span>🎓 تکالیف انجام‌شده</span><b>'+fmt(tasks.filter(t=>t.done).length)+' از '+fmt(tasks.length)+'</b></div><div class="row"><span>⚗️ کل تولید ثبت‌شده (تن)</span><b>'+fmt(prod.reduce((s,r)=>s+ +r.amt,0))+'</b></div></div>';
 $('view').innerHTML=h}
function alerts(){const a=[];const p=users().filter(x=>x.status==='pending').length;if(p)a.push('⏳ '+fmt(p)+' درخواست ثبت‌نام در انتظار تأیید');const rem=chkList().filter(x=>!x.done).length;if(rem)a.push('🔒 چک‌لیست قبل از استارت ناقص است ('+fmt(rem)+' مورد مانده)');const hot=get(K.temp,[]).filter(x=>+x.temp>320).length;if(hot)a.push('🔥 '+fmt(hot)+' رکورد دمای بالای ۳۲۰ درجه — ایمنی را بررسی کن');get(K.inv,[]).forEach(i=>{if(+i.qty<10)a.push('⚠️ موجودی «'+i.name+'» کم است ('+fmt(i.qty)+' '+i.unit+')')});if(finBal()<0)a.push('🔴 تراز مالی منفی است');if(!a.length)return'<div class="empty">✅ همه‌چیز مرتب است — دستیار نگرانی نمی‌بیند</div>';return a.map(x=>'<div class="row"><span>'+esc(x)+'</span></div>').join('')}

/* ===== تولید ===== */
function vProd(){
 const ch=chkList();const rem=ch.filter(x=>!x.done).length;
 let h='<h2 class="sect">⚗️ تولید و راه‌اندازی راکتور</h2>';
 h+='<div class="panel"><h3>✅ چک‌لیست قبل از استارت (Pre-Start)</h3>'+ch.map(c=>'<div class="row"><span>'+esc(c.t)+' <small>— '+esc(c.g)+'</small></span>'+(can()?'<button class="pill '+(c.done?'ok':'no')+'" onclick="toggleChk('+c.id+')">'+(c.done?'✓ انجام شد':'در انتظار')+'</button>':'<span class="zp" style="background:'+(c.done?'#159a52':'#555')+'">'+(c.done?'انجام شد':'مانده')+'</span>')+'</div>').join('');
 h+=rem===0?'<div class="unl">🟢 START UNLOCKED — همه موارد تأیید شده، آماده شروع!</div>':'<div class="lock">🔴 START LOCKED — '+fmt(rem)+' مورد باقی مانده</div></div>';
 const temps=get(K.temp,[]).slice().sort((a,b)=>b.t-a.t);
 h+='<div class="panel"><h3>🌡️ ثبت دمای ساعتی</h3>';
 if(can())h+='<div class="frm"><div class="fld"><label>ساعت (مثل 06:00)</label><input id="t-h"></div><div class="fld"><label>دمای راکتور °C</label><input id="t-temp" type="number"></div><div class="fld"><label>گاز خروجی °C</label><input id="t-gas" type="number"></div><div class="fld"><label>فشار (Bar)</label><input id="t-press" type="number" step="0.01"></div><div class="btnw"><button class="btn btn-go" onclick="addTemp()">ثبت دما</button></div></div>';
