<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>پترو پارسیان اکسیر جوانی | PYROHUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8b64c;--pan:rgba(13,35,66,.85);--br:rgba(64,140,255,.22);--tx:#dcebf7;--mut:#7d9bbd;--grn:#10b981;--blu:#2196f3;--org:#ff9800;--red:#f44336}
*{box-sizing:border-box}.hidden{display:none!important}
html,body{margin:0;background:radial-gradient(1000px 500px at 50% -80px,#0e2c55,#040d1f 65%);color:var(--tx);font-family:Vazirmatn,system-ui,sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gcard{width:min(94vw,420px);background:var(--pan);border:1px solid var(--br);border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
.gflame{font-size:50px}.gcard h1{color:var(--gold);margin:8px 0 2px;font-size:21px}.gcard p{color:var(--mut);margin:0 0 14px;font-size:12.5px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--br);background:transparent;color:var(--tx);font-family:inherit;cursor:pointer;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,#e8b64c,#c98a1e);color:#1a1206;font-weight:900;border-color:transparent}
label.f{display:block;text-align:right;margin-top:10px;font-size:13px;color:var(--mut)}
.inp{width:100%;padding:11px;margin-top:6px;border:1px solid #1d3a63;border-radius:10px;background:#081a36;color:var(--tx);font-family:inherit}
.inp option{color:#0f1724}
.err{color:#ff8a80;font-size:12px;min-height:16px;text-align:right;margin-top:4px}
.gbtn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);color:#03291d;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:14px}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#0a1f3f,#071530);border:1px solid var(--br);border-radius:16px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffcc66,#e65100);display:flex;align-items:center;justify-content:center;font-size:25px;box-shadow:0 0 22px #ff980055}
.bz{font-weight:900;color:var(--gold);font-size:12.5px}.bz small{display:block;color:var(--mut);font-weight:400;font-size:10.5px}
.htitle{flex:1;text-align:center;min-width:200px}.htitle h1{margin:0;color:var(--gold);font-size:clamp(15px,2.4vw,24px)}
.htitle p{margin:2px 0 0;color:var(--mut);font-size:11.5px}
.ubox{display:flex;align-items:center;gap:10px;background:#0a2244;border:1px solid var(--br);border-radius:12px;padding:7px 12px;font-size:12px}
.ubox b{color:var(--gold)}
#outBtn{background:#3a1520;border:none;color:#ff8a80;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:11px;font-family:inherit}
.layout{display:flex;gap:14px;margin-top:14px;align-items:flex-start}
aside{width:230px;flex-shrink:0;background:var(--pan);border:1px solid var(--br);border-radius:14px;padding:12px;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto}
.grp h4{margin:10px 0 6px;font-size:11.5px;color:var(--gold);border-bottom:1px dashed #2a4a78;padding-bottom:4px}
.sitem{display:block;width:100%;text-align:right;background:transparent;border:none;color:var(--tx);font-family:inherit;font-size:12.5px;padding:8px;border-radius:8px;cursor:pointer;transition:.15s}
.sitem:hover{background:#123159}
.sitem.on{background:linear-gradient(90deg,#e8b64c22,transparent);border-right:3px solid var(--gold);color:var(--gold);font-weight:700}
main{flex:1;min-width:0}
.view{animation:up .35s both}
.vhead{background:var(--pan);border:1px solid var(--br);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.vhead h2{margin:0;color:var(--gold);font-size:19px}.vhead p{margin:4px 0 0;color:var(--mut);font-size:12.5px}
.panel{background:var(--pan);border:1px solid var(--br);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h3{color:var(--gold);font-size:14.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#e8b64c44,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;color:#fff;border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.kpi i{font-style:normal;font-size:26px}.kpi h5{margin:0;font-size:11.5px;font-weight:400;opacity:.9}.kpi .v{font-size:18px;font-weight:900;direction:ltr;text-align:right}
.k-green{background:linear-gradient(135deg,#0f9d58,#087f43)}.k-blue{background:linear-gradient(135deg,#1e88e5,#0d5bb5)}
.k-pur{background:linear-gradient(135deg,#8e24aa,#ff9800)}.k-org{background:linear-gradient(135deg,#fb8c00,#ef6c00)}.k-red{background:linear-gradient(135deg,#d32f2f,#8e0000)}
.tbw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th{color:var(--gold);font-weight:400;font-size:11.5px;padding:8px;border-bottom:1px solid #1d3a63;text-align:center}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05);text-align:center}
.okc{color:var(--grn)}.warnc{color:var(--org)}.badc{color:#ff6f60}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.fbtn{background:linear-gradient(135deg,#10b981,#059669);color:#03291d;border:none;border-radius:10px;padding:10px 18px;font-family:inherit;font-weight:900;cursor:pointer;font-size:13.5px}
.fbtn.ghost{background:#123159;color:var(--tx);border:1px solid var(--br)}
.fbtn.red{background:linear-gradient(135deg,#d32f2f,#8e0000);color:#fff;padding:4px 10px;font-size:11.5px}
.fbtn.warn{background:linear-gradient(135deg,#fb8c00,#ef6c00);color:#fff}
.muted2{font-size:11px;color:#7d8ea0;margin-top:8px;line-height:1.9}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{padding:8px 14px;border-radius:10px;border:1px solid var(--br);background:#0a2244;color:var(--tx);font-family:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,#e8b64c,#c98a1e);color:#1a1206;font-weight:900}
.stbox{border-radius:12px;padding:13px;text-align:center;font-weight:900;font-size:15px;margin-top:12px}
.st-lock{background:rgba(244,67,54,.15);border:1px solid #f44336;color:#ff8a80}
.st-open{background:rgba(16,185,129,.16);border:1px solid #10b981;color:#34d399;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 22px #10b98166}}
.tick{width:18px;height:18px;accent-color:#10b981;cursor:pointer}
.shake{animation:shk .4s}@keyframes shk{25%{transform:translateX(4px)}75%{transform:translateX(-4px)}}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.band{border-radius:10px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:700;border:1px solid rgba(255,255,255,.15)}
.b1{background:linear-gradient(135deg,#1b5e20,#2e7d32)}.b2{background:linear-gradient(135deg,#e65100,#f57c00)}
.b3{background:linear-gradient(135deg,#b71c1c,#d32f2f)}.b4{background:linear-gradient(135deg,#0d47a1,#1565c0)}
.band small{display:block;font-weight:400;opacity:.85;direction:ltr}
.flow{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:8px 2px}
.fs{flex-shrink:0;width:74px;text-align:center}
.fs .fi{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;background:#0c2951;border:2px solid var(--blu);display:flex;align-items:center;justify-content:center;font-size:18px;animation:pul 3s infinite}
.fs span{font-size:10px;color:var(--mut);line-height:1.4;display:block}
.far{color:var(--grn);font-size:15px;flex-shrink:0;animation:blk 1.2s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #2196f344}50%{box-shadow:0 0 0 7px transparent}}
@keyframes blk{50%{opacity:.25}}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gauge{background:#081a36;border:1px solid var(--br);border-radius:12px;padding:10px;text-align:center}
.gauge .gv{font-size:22px;font-weight:900;color:var(--gold);direction:ltr}.gauge .gt{font-size:11px;color:var(--mut);margin-top:2px}
.tl{position:relative;padding-right:16px}.tl::before{content:'';position:absolute;right:5px;top:6px;bottom:6px;width:2px;background:#1d3a63}
.tli{position:relative;padding:5px 0;font-size:12.5px}.tli::before{content:'';position:absolute;right:-15.5px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tli b{direction:ltr;display:inline-block;margin-left:6px;color:var(--c)}
.aii{display:flex;gap:9px;align-items:flex-start;background:#081a36;border:1px solid var(--br);border-right:3px solid var(--org);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;animation:up .5s both}
.aii.b{border-right-color:var(--blu)}.aii i{font-style:normal;font-size:16px}
.roleb{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;background:#123159;border:1px solid var(--br)}
.r-admin{background:#3d2f10;border-color:var(--gold);color:var(--gold)}
.rolesel{padding:6px;border-radius:8px;background:#081a36;color:var(--tx);border:1px solid #1d3a63;font-family:inherit;font-size:12px}
.tw{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{background:#0a2244;color:var(--tx);border:1px solid var(--br);border-right:4px solid var(--grn);padding:11px 15px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(12px);transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.error{border-right-color:var(--red)}
.toast.show{opacity:1;transform:none}
@media(max-width:960px){
.layout{flex-direction:column}
aside{position:static;width:100%;max-height:none;display:flex;gap:8px;overflow-x:auto;align-items:center;padding:8px}
.grp{display:flex;gap:4px;flex-shrink:0;align-items:center}.grp h4{display:none}
.sitem{white-space:nowrap;padding:7px 10px}.g2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="gate">
 <div class="gcard">
  <div class="gflame">🔥</div>
  <h1>پترو پارسیان — اکسیر جوانی</h1>
  <p>PYROHUB · سامانه جامع مدیریت کارخانه‌های پیرولیز</p>
  <div class="tabs"><button id="tLogin" class="on">ورود</button><button id="tReg">ثبت‌نام</button></div>
  <div id="gName" class="hidden"><label class="f">نام و نام خانوادگی<input id="qName" class="inp"></label></div>
  <label class="f">ایمیل<input id="qEmail" class="inp" type="email" dir="ltr" autocomplete="email"></label><div class="err" id="eE"></div>
  <label class="f">رمز عبور<input id="qPass" class="inp" type="password" dir="ltr" placeholder="حداقل ۶ کاراکتر"></label><div class="err" id="eP"></div>
  <div id="gPass2" class="hidden"><label class="f">تکرار رمز<input id="qPass2" class="inp" type="password" dir="ltr"></label><div class="err" id="eP2"></div></div>
  <div class="err" id="eTop"></div>
  <button class="gbtn" id="goBtn">ورود به سامانه</button>
  <p style="margin-top:10px;font-size:11px;line-height:1.9">اولین ثبت‌نام = <b style="color:var(--gold)">مدیر کل</b> 👑<br>ثبت‌نام‌های بعدی «ناظر» می‌شوند تا مدیر نقششان را تعیین کند.</p>
 </div>
</div>

<div id="app" class="hidden">
<div class="wrap">
 <header class="hdr">
  <div class="brand"><div class="logo">🔥</div><div class="bz">PETRO PARSIAN<small>EXIR JAVANI · 09154040240</small></div></div>
  <div class="htitle"><h1>پترو پارسیان اکسیر جوانی</h1><p>سامانه جامع مدیریت کارخانه‌های پیرولیز — PYROHUB</p></div>
  <div class="ubox"><span id="uIcon">👤</span><div><b id="uName">—</b><div style="color:var(--mut);font-size:10px" id="uRole">—</div></div><button id="outBtn">خروج</button></div>
 </header>
 <div class="layout">
  <aside id="aside"></aside>
  <main><div id="main"></div></main>
 </div>
</div>
</div>

<div class="tw" id="tw"></div>
<script src="app.js"></script>
</body>
</html>
