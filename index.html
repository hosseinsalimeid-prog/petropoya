<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PyroFlow</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0a0e17;color:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
input{background:#111827;border:1px solid #29323d;border-radius:10px;padding:11px 13px;color:#eef2f7;font-family:inherit;font-size:14px;width:280px}
input:focus{outline:none;border-color:#ff7a30}
button{font-family:inherit;cursor:pointer;border:none;padding:11px 24px;border-radius:11px;font-weight:700}
.bp{background:linear-gradient(135deg,#ff7a30,#ff9d5c);color:#12100d}
.bg{background:#243447;color:#eef2f7}
h1{color:#ff7a30;font-size:22px;margin-bottom:4px}
p{color:#8b98a6;font-size:13px;text-align:center;line-height:1.9}
.err{color:#ff5470;font-size:12px;display:none;padding:8px;background:rgba(239,75,75,.12);border-radius:8px}
.ok{color:#2bd9a8;font-size:12px;display:none;padding:8px;background:rgba(43,217,168,.12);border-radius:8px}
</style>
</head>
<body>

<h1>🧪 تست اتصال به سامانه PyroFlow</h1>
<p>برای اینکه بدانیم مشکل کجاست، این صفحه فقط تست می‌کند — بعد که مشخص شد وارد می‌شود، کد کامل را جایگزین می‌کنیم</p>

<div id="err" class="err"></div>
<div id="okk" class="ok"></div>

<input id="le" placeholder="ایمیل">
<input id="lp" type="password" placeholder="رمز">
<p style="color:#5f6c79;font-size:11px">سوال آزمایشی — هر ایمیل/رمز وارد کن، فقط باید دکمه کار کند</p>
<button class="bp" onclick="doTest()" style="width:280px">تست جاوااسکریپت</button>
<div id="log" style="font-size:11px;color:#5f6c79;font-family:monospace;max-width:400px;text-align:center"></div>

<script>
"use strict";
var q=function(i){return document.getElementById(i)};
function show(i,m){var e=q(i);e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},4000)}
function doTest(){
 var log=q('log');
 try{
  log.textContent='';
  log.textContent='⏳ اول: چک تابع doTest';
  if(typeof doTest!=='function'){log.textContent='❌ doTest شناسایی نشد';return}
  var e=q('le').value, p=q('lp').value;
  log.textContent='✓ ایمیل: '+e+' | رمز: '+p.length+' کاراکتر';
  var ok=q('okk');ok.textContent='✅ جاوااسکریپت کار می‌کند — Logs: '+log.textContent;
  show('okk','✅ جاوااسکریپت کامل کار می‌کند — می‌توانی کد کامل را جای‌گذاری کنی');
 }catch(e){
  log.textContent='💥 خطا: '+e.message;
  show('err','💥 '+(e.message||'x'));
 }
}
</script>
</body>
</html>
