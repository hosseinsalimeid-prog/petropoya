<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پترو پارسیان — v7 کامل</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,-apple-system,sans-serif;background:#0a1424;color:#e8eefc}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0d1a33;border-bottom:1px solid #24406e;padding:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{color:#d4a437}.brand small{display:block;color:#8fa8cc;font-size:11px}
.uinfo{display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
#row{display:flex}
#nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#0c1830;border-bottom:1px solid #1c3560}
.chip{white-space:nowrap;padding:9px 14px;border-radius:99px;border:1px solid #2c4c80;background:#0f1e3d;color:#a9c2e8;cursor:pointer;font-size:13.5px;font-family:inherit}
.chip.on{background:#d4a437;border-color:#d4a437;color:#1a1206;font-weight:700}
main{flex:1;padding:14px;width:100%;max-width:1150px;margin:0 auto}
.sect{color:#d4a437;font-size:19px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:14px}
.kpi{border-radius:14px;padding:14px;font-weight:800;font-size:19px;cursor:pointer;border:none;font-family:inherit;color:#fff}
.kpi:active{transform:scale(.96)}.kpi small{display:block;font-size:11.5px;font-weight:400;opacity:.9;margin-bottom:4px}
.g{background:#159a52}.b{background:#1565c0}.p{background:#7c3aed}.o{background:#d97706}.r{background:#dc2626}
.panel{background:#0f1e3d;border:1px solid #24406e;border-radius:16px;padding:14px;margin-bottom:14px}
.panel h3{color:#d4a437;font-size:15px;margin-bottom:10px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;margin-bottom:10px}
.fld label{display:block;font-size:12px;color:#8fa8cc;margin-bottom:5px;text-align:right}
.fld input,.fld select{width:100%;padding:11px;border-radius:10px;border:1px solid #2c4c80;background:#f7f7d8;color:#111;font-size:14px;font-family:inherit}
.btn{padding:12px 18px;border:none;border-radius:10px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-go{background:linear-gradient(90deg,#159a52,#22c55e);color:#fff}
.btn-out{background:#24406e;color:#cfe0ff}
.btnw{display:flex;gap:8px;flex-wrap:wrap}
.rec{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid #1c3560;font-size:13.5px;align-items:center;flex-wrap:wrap}
.rec .c{flex:1;line-height:1.9;min-width:180px}
.rec small{color:#8fa8cc}
.pill{border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:none;display:inline-block}
.pill.ok{background:#22c55e;color:#fff}.pill.gy{background:#24406e;color:#cfe0ff}
.del{background:none;border:none;color:#ff9b9b;cursor:pointer;font-size:16px}
.zp{color:#fff;font-size:11px;border-radius:99px;padding:3px 9px;white-space:nowrap}
.flow{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#a9c2e8;min-width:62px;text-align:center;cursor:pointer;background:none;border:none;font-family:inherit;padding:6px 2px;border-radius:10px}
.st:active{background:#1a2c52}.st b{font-size:24px}
.lock{background:#3a1414;color:#ffc4c4;border:1px solid #7c2d2d;border-radius:12px;padding:11px;text-align:center;font-size:13.5px}
.unl{background:#12331f;color:#b9ffd7;border:1px solid #1f5c39;border-radius:12px;padding:11px;text-align:center;font-size:13.5px}
.bar{height:9px;background:#0c1830;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d4a437,#f0c75e)}
.empty{color:#8fa8cc;font-size:13px;text-align:center;padding:8px}
.al{display:flex;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid #1c3560;font-size:13.5px;cursor:pointer;align-items:center}
.ai-out{background:#0c1830;border:1px dashed #2c4c80;border-radius:12px;padding:12px;font-size:13.5px;line-height:2;white-space:pre-wrap}
.badge{display:inline-block;background:#d4a437;color:#1a1206;font-weight:700;font-size:12px;border-radius:99px;padding:4px 12px}
.badge.v{background:#2c4c80;color:#cfe0ff}
#tw{position:fixed;bottom:14px;left:14px;right:14px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:99}
.toast{background:#12331f;color:#b9ffd7;border:1px solid #1f5c39;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;max-width:420px}
.toast.show{opacity:1;transform:none}.toast.error{background:#3a1424;color:#ffc4c4;border-color:#7c2d2d}
.card{background:#0f1e3d;border:1px solid #24406e;border-radius:18px;padding:28px 22px;max-width:420px;margin:40px auto;width:calc(100% - 32px)}
.tabs{display:flex;gap:10px;margin:18px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:1px solid #2c4c80;background:#0c1a33;color:#a9c2e8;font-size:15px;font-family:inherit;cursor:pointer}
.tab.active{background:#d4a437;border-color:#d4a437;color:#1a1206;font-weight:700}
.logo{font-size:60px;text-align:center}h1{color:#d4a437;font-size:23px;text-align:center;margin:8px 0 4px}
.sub{color:#8fa8cc;font-size:13px;text-align:center}
.note{color:#8fa8cc;font-size:12.5px;text-align:center;margin-top:16px;line-height:2}.note b{color:#d4a437}
.lg{width:100%;padding:12px;border-radius:10px;border:1px solid #2c4c80;background:#f7f7d8;font-family:inherit;font-size:15px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 5px;border-bottom:1px solid #1c3560;text-align:right;color:#cfe0ff;white-space:nowrap}
th{color:#8fa8cc;font-weight:400;font-size:11.5px}
select{background:#0c1a33;color:#e8eefc;border:1px solid #2c4c80;border-radius:8px;padding:5px 8px;font-family:inherit}
@media(min-width:900px){#nav{flex-direction:column;width:230px;flex-shrink:0}.chip{border-radius:10px;text-align:right}main{max-width:none}}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <div class="logo">🔥</div>
    <h1>پترو پارسیان — اکسیر جوانی</h1>
    <div class="sub">PYROHUB · سامانه جامع مدیریت کارخانه‌های پیرولیز</div>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="showTab('login')">ورود</button>
      <button class="tab" id="tab-reg" onclick="showTab('reg')">ثبت‌نام</button>
    </div>
    <div id="f-login">
      <input id="l-e" class="lg" type="email" placeholder="ایمیل" onkeydown="if(event.key==='Enter')doLogin()">
      <input id="l-p" class="lg" type="password" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-go" style="width:100%" onclick="doLogin()">ورود به سامانه</button>
    </div>
    <div id="f-reg" class="hidden">
      <input id="r-n" class="lg" placeholder="نام و نام خانوادگی">
      <input id="r-e" class="lg" type="email" placeholder="ایمیل">
      <input id="r-p" class="lg" type="password" placeholder="رمز عبور (حداقل ۶)">
      <button class="btn btn-go" style="width:100%" onclick="doReg()">ثبت‌نام</button>
    </div>
    <div class="note">اولین ثبت‌نام = <b>مدیر کل 👑</b><br>حساب قبلی‌ات با همان ایمیل و رمز کار می‌کند.</div>
  </div>
</div>

<div id="shell" class="hidden">
  <header>
    <div class="brand"><span style="font-size:30px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · 09154040240</small></div></div>
    <div class="uinfo"><span id="uname"></span><span id="ubadge"></span><button class="btn btn-out" style="padding:8px 16px" onclick="logout()">خروج</button></div>
  </header>
  <div id="row"><nav id="nav"></nav><main id="view"></main></div>
</div>

<div id="tw"></div>

<script>
/* ============ ابزار ============ */
const UKEY='pyro_users_v2',SKEY='pyro_session_v2',CK='pyro_chk_v3',FK='pyro_files_v3';
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('fa-IR');
const get=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('فضای ذخیره پر است! چند فایل را حذف کن',1);return false}};
const DK=s=>'pyro_s_'+s;
const rows=s=>get(DK(s),[]);
const users=()=>get(UKEY,[]),saveUsers=u=>put(UKEY,u);
const me=()=>{const e=localStorage.getItem(SKEY);if(!e)return null;const u=users().find(x=>x.email===e);return u&&u.status==='active'?u:null};
const adm=()=>{const u=me();return!!u&&u.role==='admin'};
async function hash(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pyro·'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of 'pyro·'+t)h=(h*31+c.charCodeAt(0))>>>0;return'f'+h}}
function toast(m,er){const t=document.createElement('div');t.className='toast'+(er?' error':'');t.textContent=m;$('tw').appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3200)}
function showTab(w){$('tab-login').classList.toggle('active',w==='login');$('tab-reg').classList.toggle('active',w==='reg');$('f-login').classList.toggle('hidden',w!=='login');$('f-reg').classList.toggle('hidden',w!=='reg')}

/* ============ ورود / ثبت‌نام ============ */
async function doReg(){
 const n=$('r-n').value.trim(),e=$('r-e').value.trim().toLowerCase(),p=$('r-p').value;
 if(!n||!e||!p)return toast('همه فیلدها را پر کن',1);
 if(p.length<6)return toast('رمز حداقل ۶ کاراکتر',1);
 const l=users();
 if(l.some(u=>u.email===e))return toast('این ایمیل قبلاً ثبت شده',1);
 if(l.length===0){l.push({name:n,email:e,pass:await hash(p),role:'admin',status:'active'});saveUsers(l);localStorage.setItem(SKEY,e);toast('خوش آمدی مدیر کل 👑');render()}
 else{l.push({name:n,email:e,pass:await hash(p),role:'viewer',status:'pending'});saveUsers(l);toast('درخواستت ثبت شد؛ منتظر تأیید مدیر 🌱');showTab('login')}
}
async function doLogin(){
 const e=$('l-e').value.trim().toLowerCase(),p=$('l-p').value;
 if(!e||!p)return toast('ایمیل و رمز را وارد کن',1);
 const u=users().find(x=>x.email===e);
 if(!u)return toast('ایمیل یا رمز اشتباه است',1);
 if(u.pass!==await hash(p))return toast('ایمیل یا رمز اشتباه است',1);
 if(u.status==='pending')return toast('حسابت در انتظار تأیید مدیر است ⏳',1);
 localStorage.setItem(SKEY,e);$('l-p').value='';toast('خوش آمدی '+u.name+' 👋');render();
}
function logout(){localStorage.removeItem(SKEY);cur='dash';render()}
function decide(em,ok){if(!adm())return;let l=users();const u=l.find(x=>x.email===em);if(!u)return;
 if(ok){u.status='active';toast(u.name+' تأیید شد ✅')}else{l=l.filter(x=>x.email!==em);toast('رد شد')}
 saveUsers(l);show('users')}
function setRole(em,r){if(!adm())return;const l=users();const u=l.find(x=>x.email===em);if(!u)return;
 const o=l.some(x=>x.role==='admin'&&x.email!==em&&x.status==='active');
 if(u.role==='admin'&&!o&&r!=='admin')return toast('حداقل یک مدیر باید بماند',1);
 u.role=r;saveUsers(l);toast('نقش تغییر کرد');show('users')}

/* ============ تعریف بخش‌ها (همه با فرم ثبت) ============ */
const SEC=[
{id:'buy',ic:'🛒',t:'خرید',f:[['item','نام کالا / ماده','req'],['qty','مقدار','number'],['unit','واحد','t'],['price','قیمت (تومان)','number'],['vendor','فروشنده','t']]},
{id:'trans',ic:'🚚',t:'حمل‌ونقل',f:[['item','محموله','req'],['from','مبدأ','t'],['to','مقصد','t'],['price','هزینه (تومان)','number'],['carrier','راننده / وسیله','t']]},
{id:'mat',ic:'🧰',t:'آماده‌سازی مواد',f:[['item','ماده','req'],['qty','مقدار','number'],['prep','مرحله آماده‌سازی','t']]},
{id:'reat',ic:'🛢️',t:'ذخیره راکتور',f:[['item','محتویات','req'],['qty','مقدار (کیلوگرم)','number'],['cond','وضعیت / کیفیت','t']]},
{id:'crack',ic:'🔥',t:'پیرولیز (Cracking)',f:[['batch','شماره بچ','req'],['dur','مدت (ساعت)','number'],['tmax','بیشینه دما (°C)','number'],['yld','بازده (%)','number']]},
{id:'oil',ic:'💧',t:'روغن‌گیری',f:[['oil','نوع روغن','req'],['qty','مقدار (لیتر)','number'],['grade','درجه کیفیت','t']]},
{id:'cool',ic:'❄️',t:'Cooling',f:[['sys','سیستم','req'],['dur','مدت (دقیقه)','number'],['tout','دمای خروجی (°C)','number']]},
{id:'sample',ic:'🧪',t:'نمونه‌گیری',f:[['test','نوع آزمایش','req'],['result','نتیجه','t'],['lab','آزمایشگاه','t']]},
{id:'output',ic:'📋',t:'ثبت خروجی',f:[['prod','محصول','req'],['qty','مقدار (تن)','number'],['grade','درجه','t']]},
{id:'sale',ic:'📦',t:'فروش',f:[['cust','مشتری','req'],['item','محصول','t'],['qty','مقدار','number'],['price','مبلغ (تومان)','number']]},
{id:'inv',ic:'🏭',t:'انبار موجودی',f:[['item','کالا','req'],['qty','موجودی','number'],['unit','واحد','t'],['cat','دسته','t']]},
{id:'temp',ic:'🌡️',t:'ثبت دما',f:[['h','ساعت (06:00)','req'],['t1','دمای راکتور (°C)','number'],['g','گاز خروجی (°C)','number'],['p','فشار (Bar)','number']]},
{id:'fin',ic:'💰',t:'مالی',f:[['type','نوع','sel','in:درآمد|out:هزینه'],['title','عنوان','req'],['amt','مبلغ (تومان)','number']]},
{id:'hrm',ic:'👷',t:'پرسنل',f:[['name','نام و نام خانوادگی','req'],['role','سمت','t'],['tel','تلفن','t']]},
{id:'task',ic:'🎓',t:'آموزش و تکالیف',f:[['title','عنوان تکلیف','req'],['tip','آموزش / SOP','t']]}
];
const FLOW=[['buy','🛒','خرید'],['trans','🚚','حمل‌ونقل'],['mat','🧰','آماده‌سازی مواد'],['reat','🛢️','ذخیره راکتور'],['chk','📝','چک‌لیست'],['start','▶️','Start راکتور'],['temp','🌡️','ثبت دما'],['crack','🔥','Cracking'],['oil','💧','روغن‌گیری'],['cool','❄️','Cooling'],['sample','🧪','نمونه‌گیری'],['output','📋','ثبت خروجی'],['sale','📦','فروش'],['inv','🏭','انبار']];

/* ============ موتور ثبت عمومی ============ */
function field(f,sid){
 const id=sid+'_'+f[0];
 if(f[2]==='sel')return '<div class="fld"><label>'+f[1]+'</label><select id="'+id+'" onkeydown="if(event.key===\'Enter\')addRec(\''+sid+'\')">'+f[3].split('|').map(o=>{const p=o.split(':');return '<option value="'+p[0]+'">'+p[1]+'</option>'}).join('')+'</select></div>';
 return '<div class="fld"><label>'+f[1]+'</label><input id="'+id+'" type="'+(f[2]==='number'?'number':'text')+'" onkeydown="if(event.key===\'Enter\')addRec(\''+sid+'\')"></div>';
}
function addRec(sid){
 if(!adm())return toast('ثبت فقط با مدیر کل 👑',1);
 const S=SEC.find(x=>x.id===sid);if(!S)return;
 const r={t:Date.now(),v:{}};
 for(const f of S.f){const el=$(sid+'_'+f[0]);const v=el?el.value.trim():'';
  if(f[2]==='req'&&!v){toast(f[1]+' لازم است',1);el&&el.focus();return}
  r.v[f[0]]=v}
 const l=rows(sid);l.push(r);
 if(put(DK(sid),l)){toast('در «'+S.t+'» ثبت شد ✅');show(sid)}
}
function delRec(sid,t){if(!adm())return toast('فقط مدیر',1);put(DK(sid),rows(sid).filter(r=>r.t!==t));toast('حذف شد');show(sid)}
function togTask(t){if(!adm())return;const l=rows('task');const r=l.find(x=>x.t===t);if(r){r.v.done=!r.v.done;put(DK('task'),l);show('task')}}
function zone(t){t=+t;if(!t)return'';if(t<=220)return'<span class="zp" style="background:#159a52">پایین 🟢</span>';if(t<=270)return'<span class="zp" style="background:#b8860b">بازه مجاز 🟡</span>';if(t<=320)return'<span class="zp" style="background:#dc2626">Cracking 🔴</span>';return'<span class="zp" style="background:#1565c0">خیلی بالا ⚠️</span>'}
function rowHtml(S,r){
 const d=new Date(r.t).toLocaleDateString('fa-IR')+' '+new Date(r.t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
 let core=S.f.map(f=>{const v=r.v[f[0]]||'';
  if(S.id==='fin'&&f[0]==='type')return v==='in'?'<span class="zp" style="background:#159a52">درآمد</span>':'<span class="zp" style="background:#dc2626">هزینه</span>';
  if(S.id==='task'&&f[0]==='title')return (r.v.done?'✅ ':'⬜ ')+esc(v);
  return esc(v)}).join(' · ');
 if(S.id==='temp')core+=' '+zone(r.v.t1);
 let btns='';
 if(S.id==='task')btns+='<button class="pill '+(r.v.done?'gy':'ok')+'" onclick="togTask('+r.t+')">'+(r.v.done?'برگشت':'انجام شد')+'</button> ';
 if(adm())btns+='<button class="del" onclick="delRec(\''+S.id+'\','+r.t+')">✖</button>';
 return '<div class="rec"><div class="c">'+core+'<br><small>'+d+'</small></div><div>'+btns+'</div></div>';
}
function vSec(sid){
 const S=SEC.find(x=>x.id===sid);if(!S)return show('dash');
 const l=rows(sid).slice().sort((a,b)=>b.t-a.t);
 let h='<h2 class="sect">'+S.ic+' '+S.t+'</h2>';
 if(adm())h+='<div class="panel"><h3>➕ فرم ثبت — '+S.t+'</h3><div class="frm">'+S.f.map(f=>field(f,sid)).join('')+'</div><div class="btnw"><button class="btn btn-go" onclick="addRec(\''+sid+'\')">ثبت در سامانه</button></div></div>';
 else h+='<div class="panel"><div class="empty">👁 نمایش — ثبت فقط با مدیر کل 👑</div></div>';
 const sum=l.reduce((s,r)=>s+(+r.v.qty||+r.v.amt||+r.v.price||0),0);
 if(sum>0)h+='<div class="panel"><div class="rec"><span>Σ مجموع مبالغ/مقادیر این بخش</span><b>'+fmt(sum)+'</b></div></div>';
 h+='<div class="panel"><h3>📋 تاریخچه ('+fmt(l.length)+')</h3>'+(l.length?l.map(r=>rowHtml(S,r)).join(''):'<div class="empty">هنوز رکوردی ثبت نشده — از فرم بالا ثبت کن</div>')+'</div>';
 $('view').innerHTML=h;
}

/* ============ چک‌لیست ============ */
const CHKD=['انجام پروتکل‌های دستورالعمل عملیاتی','نشت و آب‌بندی درب راکتور','وضعیت شعله و مشعل‌ها','سنجش کاتالیست و بریزی راکتور','سیستم برق و تابلوبرق','مسیر خروجی گاز و ضدانفجار','تجهیزات اطمینان و خاموش‌کننده‌ها','صحت مسیرها و ظرفیت‌ها'];
function chk(){let c=get(CK,null);if(!c){c=CHKD.map((t,i)=>({i,t,done:false}));put(CK,c)}return c}
function togCk(i){if(!adm())return toast('فقط مدیر',1);const c=chk();c[i].done=!c[i].done;put(CK,c);show('chk')}
function vChk(){const c=chk();const done=c.filter(x=>x.done).length;
 let h='<h2 class="sect">📝 چک‌لیست قبل از استارت</h2><div class="panel"><h3>'+fmt(done)+' از '+fmt(c.length)+' انجام شده</h3><div class="bar"><i style="width:'+(done*100/c.length)+'%"></i></div>';
 h+=c.map(x=>'<div class="rec"><div class="c">'+(x.done?'✅':'⬜')+' '+esc(x.t)+'</div>'+(adm()?'<button class="pill '+(x.done?'gy':'ok')+'" onclick="togCk('+x.i+')">'+(x.done?'حذف تأیید':'تأیید')+'</button>':'')+'</div>').join('');
 h+=done===c.length?'<div class="unl" style="margin-top:10px">🟢 START UNLOCKED — آماده راه‌اندازی!</div>':'<div class="lock" style="margin-top:10px">🔴 START LOCKED — '+fmt(c.length-done)+' مورد مانده</div>';
 h+='</div>';$('view').innerHTML=h;
}

/* ============ استارت راکتور ============ */
function doStart(){if(!adm())return;const l=rows('start');l.push({t:Date.now(),v:{by:me().name,h:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}});put(DK('start'),l);toast('استارت راکتور ثبت شد 🚀');show('start')}
function vStart(){const c=chk();const rem=c.filter(x=>!x.done).length;const l=rows('start').slice().sort((a,b)=>b.t-a.t);
 let h='<h2 class="sect">▶️ راه‌اندازی راکتور (Start)</h2>';
 h+=rem===0?'<div class="unl">🟢 START UNLOCKED — همه موارد چک‌لیست تأیید شده</div>':'<div class="lock">🔴 START LOCKED — '+fmt(rem)+' مورد چک‌لیست مانده</div>';
 h+='<div class="panel">'+(adm()?(rem===0?'<button class="btn btn-go" style="width:100%;font-size:17px" onclick="doStart()">🚀 ثبت شروع راکتور همین حالا</button>':'<button class="btn btn-out" style="width:100%" onclick="show(\'chk\')">برو به چک‌لیست ✔</button>'):'<div class="empty">استارت فقط با مدیر کل 👑</div>')+'</div>';
 h+='<div class="panel"><h3>📚 سابقه استارت‌ها ('+fmt(l.length)+')</h3>'+(l.length?l.map(r=>'<div class="rec"><div class="c">👤 '+esc(r.v.by)+' — ساعت '+esc(r.v.h)+'<br><small>'+new Date(r.t).toLocaleDateString('fa-IR')+'</small></div>'+(adm()?'<button class="del" onclick="delRec(\'start\','+r.t+')">✖</button>':'')+'</div>').join(''):'<div class="empty">هنوز استارتی ثبت نشده</div>')+'</div>';
 $('view').innerHTML=h;
}

/* ============ داشبورد ============ */
function netFin(){const inc=rows('sale').reduce((s,r)=>s+(+r.v.price||0),0)+rows('fin').filter(r=>r.v.type==='in').reduce((s,r)=>s+(+r.v.amt||0),0);
 const exp=rows('buy').reduce((s,r)=>s+(+r.v.price||0),0)+rows('trans').reduce((s,r)=>s+(+r.v.price||0),0)+rows('fin').filter(r=>r.v.type==='out').reduce((s,r)=>s+(+r.v.amt||0),0);
 return{inc,exp,net:inc-exp}}
function alertsList(){const a=[];
 const p=users().filter(x=>x.status==='pending').length;if(p)a.push(['⏳ '+fmt(p)+' درخواست ثبت‌نام منتظر تأیید','users']);
 const rem=chk().filter(x=>!x.done).length;if(rem)a.push(['🔒 چک‌لیست ناقص است ('+fmt(rem)+' مورد مانده)','chk']);
 const hot=rows('temp').filter(r=>+r.v.t1>320).length;if(hot)a.push(['🔥 '+fmt(hot)+' رکورد دمای بالای ۳۲۰ درجه','temp']);
 rows('inv').forEach(i=>{if(+i.v.qty<10)a.push(['⚠️ موجودی «'+i.v.item+'» کم است ('+fmt(i.v.qty)+' '+i.v.unit+')','inv'])});
 if(netFin().net<0)a.push(['🔴 تراز مالی منفی است','fin']);
 return a}
function vDash(){const f=netFin();const outs=rows('output');
 const td=new Date().toDateString();
 const outT=outs.filter(r=>new Date(r.t).toDateString()===td).reduce((s,r)=>s+(+r.v.qty||0),0);
 let h='<h2 class="sect">🏠 نمای کلی سازمان — برای ثبت، هر کارت را لمس کن</h2><div class="kpis">';
 h+='<button class="kpi g" onclick="show(\'inv\')"><small>🏭 کارخانه‌ها</small>'+fmt(4)+'</button>';
 h+='<button class="kpi b" onclick="show(\'hrm\')"><small>👷 پرسنل فعال</small>'+fmt(rows('hrm').length)+'</button>';
 h+='<button class="kpi p" onclick="show(\'output\')"><small>⚗️ تولید امروز (تن)</small>'+fmt(outT)+'</button>';
 h+='<button class="kpi o" onclick="show(\'sale\')"><small>💵 فروش (تومان)</small>'+fmt(f.inc)+'</button>';
 h+='<button class="kpi r" onclick="show(\'fin\')"><small>📊 سود خالص (تومان)</small>'+fmt(f.net)+'</button></div>';
 h+='<div class="panel"><h3>⚡ چرخه کامل تولید — هر مرحله یک بخش ثبت دارد</h3><div class="flow">'+FLOW.map(x=>'<button class="st" onclick="show(\''+x[0]+'\')"><b>'+x[1]+'</b>'+x[2]+'</button>').join('')+'</div></div>';
 const al=alertsList();
 h+='<div class="panel"><h3>🔔 هشدارهای دستیار هوشمند</h3>'+(al.length?al.map(x=>'<div class="al" onclick="show(\''+x[1]+'\')"><span>'+esc(x[0])+'</span><span>←</span></div>').join(''):'<div class="empty">✅ همه‌چیز مرتب است</div>')+'</div>';
 h+='<div class="panel"><h3>📌 خلاصه</h3><div class="rec"><span>📁 فایل‌ها</span><b>'+fmt(get(FK,[]).length)+'</b></div><div class="rec"><span>🎓 تکالیف انجام‌شده</span><b>'+fmt(rows('task').filter(t=>t.v.done).length)+' از '+fmt(rows('task').length)+'</b></div><div class="rec"><span>🚀 استارت‌های ثبت‌شده</span><b>'+fmt(rows('start').length)+'</b></div></div>';
 $('view').innerHTML=h;
}

/* ============ فایل‌ها ============ */
function kb(s){return s>=1048576?fmt(s/1048576)+' MB':fmt(Math.max(1,Math.round(s/1024)))+' KB'}
function upFiles(inp){if(!adm())return;const fs=[...inp.files];if(!fs.length)return;let fin=0,n=0;
 fs.forEach(f=>{if(f.size>1572864){fin++;toast('«'+f.name+'» بزرگ‌تر از ۱.۵MB است',1);if(fin===fs.length)show('files');return}
  const r=new FileReader();
  r.onload=()=>{const l=get(FK,[]);l.push({t:Date.now()+fin,name:f.name,size:f.size,type:f.type||'',d:r.result});
   if(put(FK,l))n++;fin++;if(fin===fs.length){toast(n>0?fmt(n)+' فایل بارگذاری شد ✅':'بارگذاری نشد',n>0?0:1);show('files')}};
  r.readAsDataURL(f)})}
function delFile(t){if(!adm())return;put(FK,get(FK,[]).filter(f=>f.t!==t));toast('حذف شد');show('files')}
function vFiles(){const l=get(FK,[]).slice().sort((a,b)=>b.t-a.t);const tot=l.reduce((s,f)=>s+f.size,0);
 let h='<h2 class="sect">📎 مرکز فایل‌ها</h2><div class="panel"><h3>📤 بارگزاری فایل</h3>';
 if(adm()){h+='<input type="file" id="finp" multiple style="display:none" onchange="upFiles(this)"><button class="btn btn-go" onclick="$(\'finp\').click()">📤 انتخاب فایل (عکس، PDF، دیتاشیت...)</button><p style="color:#8fa8cc;font-size:12px;margin-top:8px">هر فایل تا ۱.۵ مگابایت · مجموع فعلی: '+kb(tot)+'</p>'}
 else h+='<div class="empty">👁 بارگزاری فقط با مدیر کل</div>';
 h+='</div><div class="panel"><h3>📁 فایل‌های سامانه ('+fmt(l.length)+')</h3>'+(l.length?l.map(f=>'<div class="rec"><div class="c">'+(f.type&&f.type.indexOf('image')===0?'🖼️':'📄')+' <b>'+esc(f.name)+'</b> <small>'+kb(f.size)+'</small></div><div><a class="pill ok" href="'+f.d+'" download="'+esc(f.name)+'">دانلود</a> '+(adm()?'<button class="del" onclick="delFile('+f.t+')">✖</button>':'')+'</div></div>').join(''):'<div class="empty">فایلی نیست</div>')+'</div>';
 $('view').innerHTML=h;
}

/* ============ کاربران ============ */
function vUsers(){if(!adm()){$('view').innerHTML='<h2 class="sect">👑 کاربران</h2><div class="panel"><div class="empty">🔒 فقط مدیر کل</div></div>';return}
 const p=users().filter(x=>x.status==='pending');
 let h='<h2 class="sect">👑 مدیریت کاربران</h2><div class="panel"><h3>⏳ درخواست‌های در انتظار</h3>';
 h+=p.length?p.map(x=>'<div class="rec"><div class="c"><b>'+esc(x.name)+'</b> <small>'+esc(x.email)+'</small></div><div><button class="pill ok" onclick="decide(\''+esc(x.email)+'\',1)">تأیید</button> <button class="del" style="color:#ff9b9b" onclick="decide(\''+esc(x.email)+'\',0)">رد ✖</button></div></div>').join(''):'<div class="empty">درخواستی نیست</div>';
 h+='</div><div class="panel"><h3>📋 کاربران فعال</h3><table><tr><th>نام</th><th>ایمیل</th><th>نقش</th></tr>'+users().filter(x=>x.status==='active').map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td><select onchange="setRole(\''+esc(x.email)+'\',this.value)"><option value="admin"'+(x.role==='admin'?' selected':'')+'>مدیر کل 👑</option><option value="viewer"'+(x.role==='viewer'?' selected':'')+'>ناظر 👁</option></select></td></tr>').join('')+'</table></div>';
 $('view').innerHTML=h;
}

/* ============ هوش مصنوعی ============ */
function snap(){const o={user:me().name,checklist:chk(),temps:rows('temp').slice(-8),production:rows('output').slice(-8),sales:rows('sale').slice(-5),inventory:rows('inv'),balance:netFin()};try{return JSON.stringify(o).slice(0,3000)}catch(e){return'{}'}}
function agentScan(){const rep=[];let fx=0;
 let inv=rows('inv');const m=new Map();
 inv.forEach(i=>{const k=i.v.item+'|'+i.v.unit;if(m.has(k)){m.get(k).v.qty=+m.get(k).v.qty+(+i.v.qty||0);fx++}else m.set(k,i)});
 if(fx){put(DK('inv'),[...m.values()]);rep.push('🧹 '+fmt(fx)+' رکورد تکراری انبار ادغام شد')}
 const p=users().filter(x=>x.status==='pending').length;if(p)rep.push('⏳ '+fmt(p)+' درخواست ثبت‌نام منتظر تأیید توست (بخش کاربران)');
 const rem=chk().filter(x=>!x.done).length;rep.push(rem?'🔒 چک‌لیست استارت ناقص: '+fmt(rem)+' مورد مانده':'✅ چک‌لیست کامل — START آزاد است');
 const hot=rows('temp').filter(r=>+r.v.t1>320).length;rep.push(hot?'🔥 '+fmt(hot)+' دمای بالای ۳۲۰ درجه ثبت شده':'🌡️ دماها در محدوده مجاز');
 rows('inv').forEach(i=>{if(+i.v.qty<10)rep.push('⚠️ موجودی «'+i.v.item+'» کم است')});
 rep.push('💰 سود خالص: '+fmt(netFin().net)+' تومان');
 rep.push('🎓 تکالیف: '+fmt(rows('task').filter(t=>t.v.done).length)+' از '+fmt(rows('task').length)+' · 📁 فایل: '+fmt(get(FK,[]).length)+' · 👷 پرسنل: '+fmt(rows('hrm').length));
 $('aiout').textContent='🤖 گزارش اسکن:\n\n'+rep.map(x=>'• '+x).join('\n')+(fx?'\n\n✨ انبار مرتب شد':'\n\n✨ نیازی به اصلاح نبود');
 toast(' اسکن کامل شد 🤖')}
function aiReport(){const f=netFin();
 $('aiout').textContent='📊 گزارش مدیریتی — پترو پارسیان\n\n• مدیر: '+me().name+'\n• فروش+درآمد: '+fmt(f.inc)+' تومان\n• هزینه‌ها: '+fmt(f.exp)+' تومان\n• سود خالص: '+fmt(f.net)+' تومان\n• انبار: '+fmt(rows('inv').length)+' قلم · پرسنل: '+fmt(rows('hrm').length)+' نفر\n• استارت‌ها: '+fmt(rows('start').length)+' · خروجی کل: '+fmt(rows('output').reduce((s,r)=>s+(+r.v.qty||0),0))+' تن\n\n🔔 تمرکز فوری:\n'+(alertsList().map(x=>'• '+x[0]).join('\n')||'• همه‌چیز مرتب است')+'\n\n🤖 پیشنهاد: چک‌لیست را کامل کنید، موجودی‌های کم را سفارش دهید و دماهای امروز را ثبت کنید.'}
async function aiAsk(){const q=$('aiq').value.trim()||'وضعیت کارخانه را تحلیل کن و سه اقدام فوری بگو';
 if(typeof puter==='undefined'){$('aiout').textContent='⚠️ سرویس AI وصل نشد (اینترنت؟). اسکن و گزارش آفلاین کار می‌کنند.';return}
 $('aiout').textContent='⏳ در حال تحلیل...';
 try{const r=await puter.ai.chat('تو دستیار ارشد کارخانه پیرولیز «پترو پارسیان» هستی. فارسی، کوتاه و کاربردی جواب بده.\n\nداده‌ها:\n'+snap()+'\n\nسؤال: '+q);
  const t=typeof r==='string'?r:(r&&r.message&&r.message.content)||r.text||'—';$('aiout').textContent=t}
 catch(e){$('aiout').textContent='⚠️ خطا: '+(e.message||e)}}

/* ============ ناوبری ============ */
let cur='dash';
const NAV=[['dash','🏠','داشبورد']].concat(SEC.map(s=>[s.id,s.ic,s.t])).concat([['files','📎','فایل‌ها'],['users','👑','کاربران'],['ai','🤖','دستیار AI']]);
$('nav').innerHTML=NAV.map(n=>'<button class="chip" data-s="'+n[1]+'" onclick="show(\''+n[1]+'\')">'+n[2]+' '+n[3]+'</button>').join('');
function show(s){cur=s;
 document.querySelectorAll('#nav .chip').forEach(c=>c.classList.toggle('on',c.dataset.s===s));
 if(s==='dash')vDash();else if(s==='chk')vChk();else if(s==='start')vStart();else if(s==='files')vFiles();else if(s==='users')vUsers();else if(s==='ai')vAI();else vSec(s);
 window.scrollTo(0,0)}
function vAI(){$('view').innerHTML='<h2 class="sect">🤖 دستیار هوشمند سازمان</h2><div class="panel"><h3>⚡ اقدامات خودکار (آفلاین و فوری)</h3><div class="btnw"><button class="btn btn-go" onclick="agentScan()">🧹 اسکن کامل + مرتب‌سازی</button><button class="btn btn-out" onclick="aiReport()">📊 گزارش مدیریتی</button></div></div><div class="panel"><h3>💬 گفتگو با AI</h3><div class="frm" style="grid-template-columns:1fr auto"><div class="fld"><label>سؤال یا دستور</label><input id="aiq" onkeydown="if(event.key===\'Enter\')aiAsk()"></div><button class="btn btn-go" onclick="aiAsk()">🚀</button></div><div class="ai-out" id="aiout" style="margin-top:10px">👉 از دکمه‌های بالا شروع کن یا سؤال بنویس.\n- اسکن و گزارش: آفلاین و آنی.\n- چت: با سرویس AI آنلاین وصل می‌شود.</div></div>'}

/* ============ اجرا ============ */
function render(){const u=me();
 if(!u){$('gate').classList.remove('hidden');$('shell').classList.add('hidden');return}
 $('gate').classList.add('hidden');$('shell').classList.remove('hidden');
 $('uname').textContent=u.name;
 $('ubadge').innerHTML=u.role==='admin'?'<span class="badge">مدیر کل 👑</span>':'<span class="badge v">ناظر 👁</span>';
 show(cur)}
render();
</script>
</body>
</html>
