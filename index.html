<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پترو پارسیان — مدیریت پیرولیز</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a101f;--p1:#0e1a33;--p2:#122347;--ln:#22396b;--gold:#d4a437;--gr:#1db86a;--warn:#f0a92c;--dgr:#e2453c;--blu:#2f9be8;--pur:#7b5cd6}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:radial-gradient(ellipse at 18% 0%,#13234c 0%,transparent 46%),var(--bg);color:#e9effb;min-height:100vh}
.hid{display:none!important}
.bg-blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.15;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--warn);top:-120px;left:-90px;animation:bl 12s ease-in-out infinite}
.b2{width:360px;height:360px;background:var(--pur);bottom:-120px;right:-80px;animation:bl 14s ease-in-out infinite reverse}
@keyframes bl{0%,100%{transform:translate(0,0)}50%{transform:translate(45px,35px)}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.view{animation:fi .35s ease}
#tw{position:fixed;bottom:16px;left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:999;pointer-events:none}
.ts{background:#0e2b1a;color:#b9ffd7;border:1px solid #1f5c39;padding:11px 20px;border-radius:12px;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s;max-width:460px}
.ts.sh{opacity:1;transform:none}.ts.er{background:#3a1420;color:#ffc4c4;border-color:#7c2d2d}
.gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:linear-gradient(180deg,#13244a,#0d1a35);border:1px solid var(--ln);border-radius:20px;padding:30px 24px;max-width:430px;width:100%}
.lgl{text-align:center;font-size:52px}
.gate h1{color:var(--gold);font-size:21px;text-align:center;margin:6px 0 2px}
.gate .sub{color:#8fa8cc;font-size:12.5px;text-align:center;line-height:2}
.tabs{display:flex;gap:10px;margin:16px 0}
.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;cursor:pointer}

.lg{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:14.5px;margin-bottom:9px}
.note{color:#8fa8cc;font-size:12px;text-align:center;margin-top:12px;line-height:2}.note b{color:var(--gold)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(10,18,38,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding:10px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:10px}.brand b{color:var(--gold);font-size:16px}.brand small{display:block;color:#8fa8cc;font-size:10.5px}

.hbtn b{font-size:16px}.hbtn.on{border-color:var(--gold);color:var(--gold)}
.ui{display:flex;align-items:center;gap:8px;font-size:12.5px}

nav#side{width:212px;flex-shrink:0;background:rgba(12,22,44,.78);border-inline-end:1px solid var(--ln);padding:12px 9px;overflow-y:auto}
#sideToggle{display:none;background:var(--p1);border:1px solid var(--ln);color:var(--gold);border-radius:9px;padding:5px 10px;font-size:17px;font-family:inherit;cursor:pointer}
@media(max-width:960px){nav#side{position:fixed;right:-235px;z-index:200;transition:.3s;height:100vh;top:0}nav#side.open{right:0}#sideToggle{display:block}}
.gr{color:var(--gold);font-size:10.5px;margin:12px 6px 5px}
.nv{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#a9c2e8;padding:9px 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12.6px;text-align:right}
.nv:hover{background:rgba(255,255,255,.05);color:#fff}
.nv.on{background:linear-gradient(90deg,rgba(212,164,55,.22),transparent);color:var(--gold);border:1px solid rgba(212,164,55,.35)}
main{flex:1;padding:14px 16px 60px;min-width:0}
h2.vt{color:var(--gold);font-size:18px;margin-bottom:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pan{background:linear-gradient(180deg,#12224a,#0d1a35);border:1px solid var(--ln);border-radius:15px;padding:13px;margin-bottom:12px}
.pan h3{color:#cfe0ff;font-size:13.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:960px){.row2,.row3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:12px}
.kpi{border-radius:14px;padding:12px 14px;color:#fff;font-family:inherit;border:none;cursor:pointer;text-align:right}
.kpi small{display:block;font-size:10.5px;opacity:.95;margin-bottom:4px}.kpi b{font-size:17px}
.k1{background:linear-gradient(135deg,#159a52,#1db86a)}.k2{background:linear-gradient(135deg,#1565c0,#2f9be8)}
.k3{background:linear-gradient(135deg,#6d3fd4,#8b6cf0)}.k4{background:linear-gradient(135deg,#d97706,#f0a92c)}.k5{background:linear-gradient(135deg,#c0392b,#e2453c)}
.flow{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.fstp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px;background:none;border:none;color:#9db4dd;font-family:inherit;font-size:9.3px;cursor:pointer;padding:5px 2px;border-radius:10px}
.fstp i{width:36px;height:36px;border-radius:50%;background:var(--p2);border:1.6px solid var(--ln);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:16px;transition:.25s}
.fstp:hover i{border-color:var(--gold);transform:translateY(-3px)}
.scrl{overflow-x:auto;border:1px solid var(--ln);border-radius:11px}
table.dtb{width:100%;border-collapse:collapse;font-size:11.5px;min-width:600px}
.dtb th{background:#152c58;color:var(--gold);padding:9px 7px;white-space:nowrap;border:1px solid #1d3566;font-weight:600}
.dtb td{padding:8px 7px;border:1px solid #1a2f5c;text-align:center;white-space:nowrap;color:#d8e4fa}
.dtb td.l{text-align:right;white-space:normal}
.dtb tr:nth-child(even) td{background:#0f1e3f}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:8px;margin-bottom:10px}
.fgrid label{display:block;font-size:10.5px;color:#8fa8cc;margin-bottom:4px}
.fgrid input,.fgrid select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--ln);background:#f7f7dd;color:#111;font-family:inherit;font-size:13px}
.btn{padding:10px 16px;border:none;border-radius:9px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.btn.go{background:linear-gradient(90deg,#159a52,#28c76f);color:#fff}.btn.out{background:#26477e;color:#cfe0ff}
.btn.sm{padding:5px 10px;font-size:11px;border-radius:7px}
.rowact{display:flex;gap:5px;justify-content:center}
.pill{border:none;border-radius:7px;padding:5px 10px;font-family:inherit;font-weight:700;font-size:10.8px;cursor:pointer}
.pill.ok{background:var(--gr);color:#fff}.pill.wn{background:var(--warn);color:#1a1206}.pill.gy{background:#26477e;color:#cfe0ff}.pill.bl{background:var(--blu);color:#fff}
.del{background:none;border:none;color:#ff9b9b;cursor:pointer;font-size:14px}
.st-badge{border-radius:99px;padding:3px 9px;font-size:10px;font-weight:800;white-space:nowrap}
.sb-ok{background:#0e2b1a;color:#7dffbe;border:1px solid #1f5c39}.sb-pnd{background:#2b2210;color:#ffd98c;border:1px solid #6b5518}.sb-do{background:#142a4a;color:#8fc4ff;border:1px solid #2f5b9e}.sb-rt{background:#231a3d;color:#c9b3ff;border:1px solid #4a3a7a}
.rem{display:flex;gap:9px;align-items:center;padding:9px 11px;border-radius:11px;font-size:12px;margin-bottom:6px;border-inline-start:4px solid;flex-wrap:wrap}
.rem .tech{margin-inline-start:auto;color:#8fa8cc;font-size:10.5px}
.rem-r{background:#2a1215;border-color:var(--dgr)}.rem-y{background:#2b2210;border-color:var(--warn)}.rem-b{background:#12283f;border-color:var(--blu)}
.gwrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gcard{text-align:center}.gcard .lbl{color:#8fa8cc;font-size:10px}
.flame{transform-origin:50% 100%;animation:ffl .9s ease-in-out infinite}.flame.f2{animation-duration:1.05s;animation-delay:.15s}.flame.f3{animation-duration:.78s;animation-delay:.3s}
@keyframes ffl{0%,100%{transform:scaleY(1)}30%{transform:scaleY(1.15) scaleX(.9)}60%{transform:scaleY(.88) scaleX(1.07)}}
.stm{animation:rise 2.6s ease-in infinite;transform-box:fill-box}.stm.s2{animation-delay:.7s}.stm.s3{animation-delay:1.4s}
@keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.55}100%{transform:translateY(-42px) scale(1.7);opacity:0}}
.tl{display:flex;flex-direction:column;gap:8px}
.tl-r{display:flex;gap:9px;align-items:flex-start;font-size:11.6px}
.tl-d{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;box-shadow:0 0 8px currentColor}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tb{padding:8px 14px;border-radius:99px;border:1px solid var(--ln);background:#0c1a35;color:#a9c2e8;font-family:inherit;font-size:12px;cursor:pointer}
.tb.on{background:var(--gold);color:#1a1206;font-weight:800;border-color:var(--gold)}
.ai-it{display:flex;gap:8px;padding:8px 2px;border-bottom:1px dashed #1c3560;font-size:12.2px;align-items:flex-start;flex-wrap:wrap}
.bcard{background:#0c1a35;border:1px solid var(--ln);border-radius:13px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.2s}
.bcard:hover{border-color:var(--gold)}
.bcard.on{border-color:var(--gold);background:#12234a}
.bcard .brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px}
.bcard .bx{flex:1;min-width:90px;text-align:center}.bcard .bx b{display:block;font-size:14px}.bcard .bx span{color:#8fa8cc;font-size:10px}
.mat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{background:#0c1a35;border:1px solid var(--ln);border-radius:11px;padding:10px;text-align:center}
.mc b{display:block;font-size:14.5px;color:#fff}.mc span{font-size:10px;color:#8fa8cc}
.empty{color:#8fa8cc;font-size:12.5px;text-align:center;padding:10px}
@media print{header,nav#side,#tw,.btn,.pill,.del,.chipbar{display:none!important}body{background:#fff;color:#000}.pan{border-color:#999}}
</style>
</head>
<body>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div>

<div id="gate" class="gate"><div class="card">
<div class="lgl">🔥</div><h1>پترو پارسیان — اکسیر جوانی</h1>
<div class="sub">PYROHUB · سامانه جامع مدیریت پیرولیز · 09154040240</div>
<div class="tabs"><button class="tab on" id="tl" onclick="stab(0)">ورود</button><button class="tab" id="tr" onclick="stab(1)">ثبت‌نام</button></div>
<div id="fl"><input id="le" class="lg" type="email" placeholder="ایمیل"><input id="lp" class="lg" type="password" placeholder="رمز عبور"><button class="btn go" style="width:100%" onclick="doLogin()">ورود به سامانه</button></div>
<div id="fr" class="hid"><input id="rn" class="lg" placeholder="نام و نام‌خانوادگی"><input id="re" class="lg" type="email" placeholder="ایمیل"><input id="rp" class="lg" type="password" placeholder="رمز (حداقل ۶)"><button class="btn go" style="width:100%" onclick="doReg()">ثبت‌نام</button></div>
<div class="note">حساب قبلی کار می‌کند · <b>اولین ثبت‌نام = مدیر کل 👑</b><br>پرسنل هم با ثبت‌نام می‌تواند درخواست ثبت کند</div>
</div></div>

<div id="shell" class="hid">
<header>
<button id="sideToggle" onclick="q('side').classList.toggle('open')">☰</button>
<div class="brand"><span style="font-size:26px">🔥</span><div><b>پترو پارسیان</b><small>اکسیر جوانی · مدیریت پیرولیز</small></div></div>
<div class="hdr-ics">
<button class="hbtn" data-p="dash" onclick="go('dash')"><b>📊</b>داشبورد</button>
<button class="hbtn" data-p="agent" onclick="go('agent')"><b>🤖</b>ایجنت</button>
<button class="hbtn" data-p="req" onclick="go('req')"><b>📥</b>درخواست‌ها</button>
<button class="hbtn" data-p="charts" onclick="go('charts')"><b>📈</b>گزارش‌ها</button>
</div>
<div class="ui"><span id="uname"></span><span class="bdg" id="ubadge"></span><button class="btn out sm" onclick="logout()">خروج</button></div>
</header>
<div class="layout"><nav id="side"></nav><main id="view"></main></div>
</div>
<div id="tw"></div>

<script>
"use strict";
const q=i=>document.getElementById(i);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>(+n||0).toLocaleString('fa-IR');
const S=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return!0}catch(e){toast('حافظه پر است!',1);return!1}};
const R=k=>S('pv_'+k,[]);
const US=()=>S('pv_users',[]);
const U=()=>{const s=S('pv_sess',null);if(!s)return null;const u=US().find(x=>x.email===s);return u&&u.st==='ok'?u:null};
const ADM=()=>{const u=U();return!!u&&u.admin};
function toast(m,er){const t=document.createElement('div');t.className='ts'+(er?' er':'');t.textContent=m;q('tw').appendChild(t);requestAnimationFrame(()=>t.classList.add('sh'));setTimeout(()=>{t.classList.remove('sh');setTimeout(()=>t.remove(),300)},3200)}
function stab(w){q('tl').classList.toggle('on',w===0);q('tr').classList.toggle('on',w===1);q('fl').classList.toggle('hid',w!==0);q('fr').classList.toggle('hid',w!==1)}
function logA(txt){const l=S('pv_agentlog',[]);l.unshift({t:Date.now(),txt});W('pv_agentlog',l.slice(0,80))}

/* ===== تاریخ شمسی ===== */
function todayJ(){const d=new Date();const j=d2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+String(j[1]).padStart(2,'0')+'/'+String(j[2]).padStart(2,'0')}
function d2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy=(gy<=1600)?0:979;gy-=(gy<=1600)?621:1600;const gy2=(gm>2)?(gy+1):gy;let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}let jm,jd;if(days<186){jm=1+Math.floor(days/31);jd=1+(days%31)}else{jm=7+Math.floor((days-186)/30);jd=1+((days-186)%30)}return[jy,jm,jd]}
function dayO(j){const p=(j||'').split('/');if(p.length!==3)return null;const y=+p[0],m=+p[1],d=+p[2];if(!y||!m||!d)return null;const doy=m<=6?(m-1)*31+d:186+(m-7)*30+d;return y*365+doy}
function daysU(j){const t=dayO(todayJ()),x=dayO(j);return(x==null||t==null)?null:x-t}
function dLbl(d){return d==null?'بدون تاریخ':d>0?F(d)+' روز مانده':d===0?'امروز!':F(-d)+' روز گذشته'}

/* ===== Auth ===== */
async function hs(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('pp·'+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function doReg(){const n=q('rn').value.trim(),e=q('re').value.trim().toLowerCase(),p=q('rp').value;
 if(!n||!e||!p)return toast('همه فیلدها را پر کنید',1);
 if(p.length<6)return toast('رمز حداقل ۶ کاراکتر',1);
 const l=US();if(l.some(u=>u.email===e))return toast('ایمیل تکراری است',1);
 const h=await hs(p);
 if(!l.length){l.push({email:e,pass:h,name:n,admin:1,st:'ok'});W('pv_users',l);W('pv_sess',e);toast('خوش آمدید مدیر کل 👑');seed();render()}
 else{l.push({email:e,pass:h,name:n,admin:0,st:'ok'});W('pv_users',l);W('pv_sess',e);toast('خوش آمدی '+n+' — درخواست بده یا کارتابلت را ببین 📥');render()}
}
async function doLogin(){const e=q('le').value.trim().toLowerCase(),p=q('lp').value;const u=US().find(x=>x.email===e);
 if(!u||u.pass!==await hs(p))return toast('ایمیل/رمز اشتباه',1);
 W('pv_sess',e);seed();render()}
function logout(){localStorage.removeItem('pv_sess');render()}
function approveUser(em){const l=US(),u=l.find(x=>x.email===em);if(u){u.st='ok';W('pv_users',l);toast('تایید شد')}render()}
function delUser(em){W('pv_users',US().filter(x=>x.email!==em));render()}
function setAdm(em,v){const l=US(),u=l.find(x=>x.email===em);if(u){u.admin=v?1:0;W('pv_users',l);render()}}

/* ===== Seed ===== */
function seed(){if(S('pv_seeded'))return;W('pv_seeded',1);
 W('pv_chk',[1,2,3,4].map((i,k)=>({t:k+1,v:{ft:k%2?'غیربجرانی':'بجرانی',desc:['انجام پروتکل‌های دستورالعمل عملیاتی','نشت و آب‌بندی درب راکتور','وضعیت شعله و مشعل‌ها','سیستم برق و تابلو برق'][k],by:'اپراتور الف'},st:'ok'})));
 W('pv_hourly',[{t:1,v:{h:'06:00',t1:180,t2:85,t3:120,t4:150,t5:110,press:'0.25',dir:'CW'}},{t:2,v:{h:'07:00',t1:195,t2:88,t3:125,t4:160,t5:115,press:'0.28',dir:'CW'}},{t:3,v:{h:'08:00',t1:245,t2:90,t3:130,t4:170,t5:120,press:'0.32',dir:'CW'}},{t:4,v:{h:'09:00',t1:285,t2:92,t3:135,t4:180,t5:125,press:'0.35',dir:'CCW'}}]);
